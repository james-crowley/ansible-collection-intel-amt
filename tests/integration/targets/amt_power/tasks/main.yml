# Drives the real amt_power module against the local mock WS-Man server. The mock's
# AmtState.power_state is real, mutable state shared by every request against one
# running instance, which is what makes state=on/off convergence and idempotence
# observable here without any fault-injection control channel.

- name: Create a scratch directory for this target's runtime files
  ansible.builtin.tempfile:
    state: directory
    prefix: amt_power_integration_
  register: scratch_dir
  delegate_to: localhost

- name: Set mock-server paths for this run
  ansible.builtin.set_fact:
    mock_servers_dir: "{{ role_path }}/../../mock_servers"
    plain_ready_file: "{{ scratch_dir.path }}/wsman_plain_ready.json"

- name: Start the plaintext mock WS-Man server
  ansible.builtin.shell: |
    set -e
    nohup {{ ansible_playbook_python }} {{ mock_servers_dir }}/run_wsman_mock.py \
      --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ plain_ready_file }} \
      > {{ scratch_dir.path }}/wsman_plain.log 2>&1 &
    echo $!
  args:
    executable: /bin/bash
  register: plain_start
  changed_when: false
  delegate_to: localhost

- name: Wait for the mock server to report ready
  ansible.builtin.wait_for:
    path: "{{ plain_ready_file }}"
    state: present
    timeout: 15
  delegate_to: localhost

- name: Read mock server connection info and pid
  ansible.builtin.set_fact:
    plain_info: "{{ lookup('ansible.builtin.file', plain_ready_file) | from_json }}"
    plain_pid: "{{ plain_start.stdout | trim }}"

- name: Exercise amt_power against the mock server
  block:
    - name: Query current power state (never mutates)
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: query
      delegate_to: localhost
      no_log: true
      register: power_query

    - name: Assert the query reports the mock's default power state (on) and changed=false
      ansible.builtin.assert:
        that:
          - power_query.changed == false
          - power_query.previous_state.normalized == 'on'
          - power_query.desired_state is none

    - name: Check mode previews turning the endpoint off without mutating it
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: "off"
      delegate_to: localhost
      no_log: true
      check_mode: true
      register: power_off_check

    - name: Assert check mode reports the intended change but performs no mutation
      ansible.builtin.assert:
        that:
          - power_off_check.changed == true
          - power_off_check.desired_state == 'off'

    - name: Confirm check mode did not actually turn the endpoint off
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: query
      delegate_to: localhost
      no_log: true
      register: power_still_on

    - name: Assert the endpoint is still reported on after the check-mode preview
      ansible.builtin.assert:
        that:
          - power_still_on.previous_state.normalized == 'on'

    - name: Turn the endpoint off for real
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: "off"
      delegate_to: localhost
      no_log: true
      register: power_off

    - name: Assert the off request converged and reports changed=true
      ansible.builtin.assert:
        that:
          - power_off.changed == true
          - power_off.desired_state == 'off'
          - power_off.return_value == 0
          - power_off.previous_state.normalized == 'on'

    - name: Idempotence -- requesting off again reports changed=false
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: "off"
      delegate_to: localhost
      no_log: true
      register: power_off_again

    - name: Assert the already-off request is a no-op
      ansible.builtin.assert:
        that:
          - power_off_again.changed == false
          - power_off_again.previous_state.normalized == 'off'

    - name: Turn the endpoint back on
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: "on"
      delegate_to: localhost
      no_log: true
      register: power_on

    - name: Assert turning it back on converges and reports changed=true
      ansible.builtin.assert:
        that:
          - power_on.changed == true
          - power_on.desired_state == 'on'

    - name: Fault injection -- wrong password is refused with error_class=authentication
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: definitely-the-wrong-password
        use_tls: false
        allow_insecure_transport: true
        state: query
      delegate_to: localhost
      no_log: true
      register: power_bad_password
      ignore_errors: true

    - name: Assert the wrong-password call failed with error_class=authentication
      ansible.builtin.assert:
        that:
          - power_bad_password.failed == true
          - power_bad_password.error_class == 'authentication'
  always:
    - name: Stop the mock WS-Man server
      ansible.builtin.command: "kill {{ plain_pid }}"
      delegate_to: localhost
      ignore_errors: true  # noqa: ignore-errors -- best-effort cleanup; the assertions above are what must pass.
      changed_when: false

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ scratch_dir.path }}"
        state: absent
      delegate_to: localhost
