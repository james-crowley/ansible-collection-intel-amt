# A two-host inventory, used only to prove roles/amt_baremetal_install/tasks/validate.yml
# actually refuses to run against more than one host per play.
#
# This is the guard standing between an operator and power-cycling a whole lab:
# delegate_to: localhost does not stop Ansible fanning a task out across every host in
# a play, so a ten-host play would issue ten resets. Both names are unresolvable
# RFC 2606 .invalid names, and the guard fires before any connection is attempted, so
# nothing here ever reaches a network.
all:
  vars:
    ansible_connection: local
  hosts:
    amt-target-a.invalid: {}
    amt-target-b.invalid: {}
