# Drives the real roles/amt_baremetal_install role -- 14 task files, previously with no
# automated test of any kind -- against local mock WS-Man servers.
#
# What is under test here is the *role's* logic, not the modules beneath it: which power
# transition it chooses, where it resolves its endpoint from, what it refuses, and what
# it always cleans up. Every module the role calls already has its own integration
# target next to this one.
#
# Two of the six defects hardware qualification found were in this role, and both are
# regression-tested here:
#
#   1. It always issued `reset`. A master bus reset does nothing to a machine that is
#      already off, so the role attached media, armed a one-shot boot, and reported
#      success having booted nothing. Scenarios 7 and 8 assert the transition is chosen
#      from the *observed* power state: `on` for an endpoint that is off, `reset` for
#      one that is running.
#   2. Its connection variables defaulted to `inventory_hostname`. AMT answers on a
#      separate management address, so that silently targeted the wrong endpoint or an
#      unresolvable name. Scenario 4 asserts an unset `amt_host` fails loudly in
#      validate.yml, and scenario 7 asserts a set one resolves from `amt_host` while
#      `inventory_hostname` is something else entirely.
#
# Three further defects were found by this target itself and are regression-tested here:
#
#   3. validate.yml's second fan-out assertion (`ansible_play_batch | length == 1`) was
#      dead code billed as "a second, independent guard". Scenario 2 now asserts the
#      counterfactual directly: in a two-host `serial: 1` play -- the exact case that
#      assertion claimed to catch -- its predicate *holds* while the roster assertion is
#      the one that fires. It could never have caught anything.
#   4. attach_media.yml never forwarded a port to `amt_media`, so IDE-R could only ever
#      reach the stock redirection ports (16994/16995). Scenario 16 drives the whole
#      media phase against the mock IDE-R server on an ephemeral port, which is only
#      reachable via the new `amt_baremetal_install_media_port`.
#   5. `amt_baremetal_install_handoff_host` defaulted to the AMT *management* address
#      while the role's own comment said to point it at whatever the OS answers on.
#      Scenario 15 asserts it is now required (and refused up front, before the
#      destructive boundary) whenever the hand-off wait is enabled.
#   6. A failed media attach orphaned the IDE-R daemon it had already spawned, because
#      the session id was only recorded from a *successful* attach. Scenario 17 asserts
#      the id is claimed before the attach and that the always-detach therefore actually
#      runs -- measured by amt_media's own session state file being gone from the runtime
#      directory afterwards, which only state=detached removes.
#
# A seventh, found while fixing #87: every `nested_observation` field in
# files/nested_play.yml is its own quoted scalar template
# (`"{{ amt_baremetal_install_run_state | default(none) }}"` and friends). On
# ansible-core <=2.18 that has the exact same defect #87 fixes in the role's own
# defaults/main.yml: Jinja's finalize step stringifies a bare None before Ansible's
# convert_data step gets a chance to evaluate it back, so a field that was genuinely
# never set (the role refused before reaching it) arrives here as "" rather than as
# None. `run_state is none` / `power_action is none` below would therefore have quietly
# stopped proving anything on those cores -- an empty string is not none, so a refusal
# that left them unset and one that (hypothetically) set them to "" would both read as
# "passed". `is falsy` catches both None and "", exactly like validate.yml's
# `is truthy` guards now do, for the same reason: don't touch files/nested_play.yml or
# tasks/run_nested.yml here, that file is owned by #80's concurrent fix, so the
# assertions are hardened on this side of the boundary instead. This does NOT apply to
# `run_state.session_id is none` / `run_state.last_failure is none` a little further
# down: those read a sub-field of a run_state that is itself a real dict (dicts survive
# the round trip; only bare None does not), sourced from a state file loaded with
# `from_json`, not from a live scalar template evaluating to None.
#
# Why this target is called amt_baremetal_install_role and not amt_baremetal_install:
# ansible-test runs each target as a role and resolves it by the collection-qualified
# name, so a target sharing a name with a role in roles/ silently runs *that role* with
# no assertions at all instead of the target. Verified: a target directory named
# amt_baremetal_install ran roles/amt_baremetal_install/tasks/validate.yml directly and
# none of the target's own tasks executed.
#
# No hardware, no network beyond 127.0.0.1, nothing destructive, and HOME is redirected
# into this target's scratch directory for every nested run so that not even the role's
# default `~/.ansible/intel_amt/...` state paths can touch the real one.

- name: Create a scratch directory for this target's runtime files
  ansible.builtin.tempfile:
    state: directory
    prefix: amt_baremetal_install_role_integration_
  register: scratch_dir
  delegate_to: localhost

- name: Set the paths this target works from
  ansible.builtin.set_fact:
    mock_servers_dir: "{{ role_path }}/../../mock_servers"
    # ansible-test's per-target workdir deliberately contains non-ASCII characters. The
    # nested playbook and inventories are copied into the plain scratch path instead, so
    # nothing depends on how a second ansible-playbook process, its argv encoding and the
    # ambient locale interact.
    nested_dir: "{{ scratch_dir.path }}/nested"
    plain_ready_file: "{{ scratch_dir.path }}/wsman_plain_ready.json"
    powered_off_ready_file: "{{ scratch_dir.path }}/wsman_powered_off_ready.json"
    no_caps_ready_file: "{{ scratch_dir.path }}/wsman_no_caps_ready.json"
    ider_ready_file: "{{ scratch_dir.path }}/ider_ready.json"
    media_allowed_dir: "{{ scratch_dir.path }}/media/allowed"
    media_outside_dir: "{{ scratch_dir.path }}/media/outside"

- name: Create the directories the nested runs need
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ nested_dir }}"
    - "{{ scratch_dir.path }}/home"
    - "{{ scratch_dir.path }}/dumps"
    - "{{ scratch_dir.path }}/state"
    - "{{ media_allowed_dir }}"
    - "{{ media_outside_dir }}"
  delegate_to: localhost

- name: Stage the nested playbook and its inventories
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nested_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - nested_play.yml
    - inventory_one_host.yml
    - inventory_two_hosts.yml
  delegate_to: localhost

- name: Write the configuration the nested runs use
  ansible.builtin.copy:
    # Explicit and minimal, so a nested run inherits none of the ansible.cfg
    # ansible-test generates for the outer run.
    content: |
      [defaults]
      gathering = explicit
      retry_files_enabled = false
      host_key_checking = false
      interpreter_python = auto_silent
    dest: "{{ nested_dir }}/nested_ansible.cfg"
    mode: "0600"
  delegate_to: localhost

- name: Create the CD/DVD images the media-phase scenarios point at
  # Two images, 4096 bytes each = 2 CD sectors (see ider.MediaImage):
  #
  #   outside/boot.iso - deliberately *outside* the allowed directory scenario 14 passes,
  #                      which is how that scenario forces a failure inside the media
  #                      phase with no IDE-R endpoint involved at all.
  #   allowed/boot.iso - inside it, for scenario 16, which is the opposite case: the
  #                      media phase running all the way through to a real IDE-R
  #                      handshake against the mock server.
  ansible.builtin.command: "dd if=/dev/zero of={{ item }}/boot.iso bs=512 count=8"
  loop:
    - "{{ media_outside_dir }}"
    - "{{ media_allowed_dir }}"
  delegate_to: localhost
  changed_when: true

- name: Resolve how the nested ansible-playbook runs are invoked
  ansible.builtin.set_fact:
    nested_ansible_playbook: ansible-playbook
    # ansible-test exports this for the integration run; the fallback derives the same
    # path from role_path for anyone running the target another way.
    nested_collections_path: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH')
         | default(role_path | regex_replace('/ansible_collections/.*$', ''), true) }}

- name: Compose the environment every nested run uses
  # Deliberately short. ansible-test exports a dozen ANSIBLE_* variables for the outer
  # run and most are harmless to inherit; the ones that are not get a real value rather
  # than an empty one, because several of these are list-typed and an empty string
  # parses as a one-element list containing "" (ANSIBLE_CALLBACKS_ENABLED="" fails the
  # whole run with "A non-empty plugin name is required").
  ansible.builtin.set_fact:
    nested_env:
      ANSIBLE_CONFIG: "{{ nested_dir }}/nested_ansible.cfg"
      ANSIBLE_COLLECTIONS_PATH: "{{ nested_collections_path }}"
      ANSIBLE_PLAYBOOK_DIR: "{{ nested_dir }}"
      ANSIBLE_FORCE_COLOR: "false"
      ANSIBLE_NOCOLOR: "1"
      # ansible-test enables its junit callback for the outer run and every nested run
      # inherits it. Point it at the scratch tree so 14 nested playbooks do not litter
      # the real ansible-test junit output that CI collects.
      JUNIT_OUTPUT_DIR: "{{ scratch_dir.path }}/junit"
      # Belt and braces: the role's own defaults put its run-state and media-session
      # directories under ~, and no scenario should ever be able to reach the real one.
      HOME: "{{ scratch_dir.path }}/home"

- name: Start the mock WS-Man server the powered-on scenarios drive
  ansible.builtin.shell: |
    set -e
    nohup {{ ansible_playbook_python }} {{ mock_servers_dir }}/run_wsman_mock.py \
      --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ plain_ready_file }} \
      > {{ scratch_dir.path }}/wsman_plain.log 2>&1 &
    echo $!
  args:
    executable: /bin/bash
  register: plain_start
  changed_when: false
  delegate_to: localhost

- name: Start a second mock WS-Man server, to be powered off before it is used
  # A separate endpoint rather than powering the first one off and back on between
  # scenarios: the observed power state is the input to the decision under test, so each
  # of the two decisions gets an endpoint whose state nothing else in this target moves.
  ansible.builtin.shell: |
    set -e
    nohup {{ ansible_playbook_python }} {{ mock_servers_dir }}/run_wsman_mock.py \
      --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ powered_off_ready_file }} \
      > {{ scratch_dir.path }}/wsman_powered_off.log 2>&1 &
    echo $!
  args:
    executable: /bin/bash
  register: powered_off_start
  changed_when: false
  delegate_to: localhost

- name: Start a mock WS-Man server whose firmware advertises neither IDE-R nor forced PXE
  # See files/run_wsman_mock_capabilities.py for why this needs a wrapper around the
  # shared runner rather than a flag on it.
  ansible.builtin.shell: |
    set -e
    nohup {{ ansible_playbook_python }} {{ role_path }}/files/run_wsman_mock_capabilities.py \
      --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ no_caps_ready_file }} \
      --no-ider --no-force-pxe \
      > {{ scratch_dir.path }}/wsman_no_caps.log 2>&1 &
    echo $!
  args:
    executable: /bin/bash
  register: no_caps_start
  changed_when: false
  delegate_to: localhost

- name: Wait for all three mock servers to report ready
  ansible.builtin.wait_for:
    path: "{{ item }}"
    state: present
    timeout: 15
  loop:
    - "{{ plain_ready_file }}"
    - "{{ powered_off_ready_file }}"
    - "{{ no_caps_ready_file }}"
  delegate_to: localhost

- name: Read mock server connection info and pids
  ansible.builtin.set_fact:
    plain_info: "{{ lookup('ansible.builtin.file', plain_ready_file) | from_json }}"
    powered_off_info: "{{ lookup('ansible.builtin.file', powered_off_ready_file) | from_json }}"
    no_caps_info: "{{ lookup('ansible.builtin.file', no_caps_ready_file) | from_json }}"
    plain_pid: "{{ plain_start.stdout | trim }}"
    powered_off_pid: "{{ powered_off_start.stdout | trim }}"
    no_caps_pid: "{{ no_caps_start.stdout | trim }}"

- name: Exercise the role against the mock endpoints
  block:
    # ------------------------------------------------------------------------------
    # Preconditions. Every scenario below depends on one of these being true of the
    # endpoint it drives, so each is asserted directly rather than assumed. If the mock
    # ever stops modelling one of them, the precondition fails here by name instead of
    # a scenario quietly proving something else.
    # ------------------------------------------------------------------------------
    - name: Confirm the powered-on endpoint really reports power on and both capabilities
      james_crowley.intel_amt.amt_info:
        host: 127.0.0.1
        port: "{{ plain_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
      delegate_to: localhost
      no_log: true
      register: precondition_plain

    - name: Assert the powered-on endpoint's preconditions
      ansible.builtin.assert:
        that:
          - precondition_plain.amt.power_state.normalized == 'on'
          - precondition_plain.amt.capabilities.boot_once_pxe == true
          - precondition_plain.amt.capabilities.storage_redirection == true
        fail_msg: >-
          The scenarios below need an endpoint observed powered on that advertises both
          boot capabilities.

    - name: Power the second endpoint off, so the role observes a machine that is off
      james_crowley.intel_amt.amt_power:
        host: 127.0.0.1
        port: "{{ powered_off_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
        state: "off"
      delegate_to: localhost
      no_log: true
      register: precondition_power_off

    - name: Confirm the second endpoint now reports power off
      james_crowley.intel_amt.amt_info:
        host: 127.0.0.1
        port: "{{ powered_off_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
      delegate_to: localhost
      no_log: true
      register: precondition_powered_off

    - name: Assert the powered-off endpoint's precondition
      ansible.builtin.assert:
        that:
          - precondition_power_off.changed == true
          - precondition_powered_off.amt.power_state.normalized == 'off'
        fail_msg: >-
          Scenario 7 is only a regression test for the always-reset defect if the
          endpoint it drives is genuinely observed powered off first.

    - name: Confirm the capability-degraded endpoint really advertises neither capability
      james_crowley.intel_amt.amt_info:
        host: 127.0.0.1
        port: "{{ no_caps_info.port }}"
        username: admin
        password: test-password-not-real
        use_tls: false
        allow_insecure_transport: true
      delegate_to: localhost
      no_log: true
      register: precondition_no_caps

    - name: Assert the capability-degraded endpoint's precondition
      ansible.builtin.assert:
        that:
          - precondition_no_caps.amt.reachable == true
          - precondition_no_caps.amt.capabilities.storage_redirection == false
          - precondition_no_caps.amt.capabilities.boot_once_pxe == false
        fail_msg: >-
          files/run_wsman_mock_capabilities.py did not actually make this endpoint report
          the capabilities absent, so scenarios 5 and 6 would pass against a fully
          capable endpoint and prove nothing. See that script's docstring.

    - name: Reserve, then release, a TCP port nothing is listening on
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-c"
          - "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1]); s.close()"
      register: closed_port_probe
      changed_when: false
      delegate_to: localhost

    - name: Confirm nothing is listening on the released port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ closed_port_probe.stdout | trim | int }}"
        state: stopped
        timeout: 10
      delegate_to: localhost

    - name: Compose the connection variables every scenario shares
      ansible.builtin.set_fact:
        closed_port: "{{ closed_port_probe.stdout | trim | int }}"
        # Deliberately the conventional `amt_*` inventory variables rather than
        # `amt_baremetal_install_*` ones: that fallback is the mechanism the
        # inventory-variable regression lives in, so every scenario exercises it.
        # amt_host is *not* here -- scenario 4 is the one that leaves it unset.
        nested_base_vars:
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          amt_username: admin
          amt_password: test-password-not-real
          amt_use_tls: false
          amt_allow_insecure_transport: true
          amt_baremetal_install_confirm_destructive: true
          amt_baremetal_install_boot_provider: pxe
          amt_baremetal_install_wait_for_handoff: false
          amt_baremetal_install_observe_retries: 2
          amt_baremetal_install_observe_delay: 1
          amt_baremetal_install_media_runtime_dir: "{{ scratch_dir.path }}/media-runtime"

    # ------------------------------------------------------------------------------
    # (1) The fan-out guard. This is what stands between an operator and power-cycling
    # every machine in a play, and it had never been exercised.
    # ------------------------------------------------------------------------------
    - name: Scenario 1 -- a two-host play is refused
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: fanout_two_hosts
        scenario_inventory: "{{ nested_dir }}/inventory_two_hosts.yml"
        scenario_hosts: [amt-target-a.invalid, amt-target-b.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/fanout_two_hosts',
             }) }}

    - name: Assert a two-host play is refused by the host-count guard, on every host
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          - nested_obs['amt-target-b.invalid'].outcome == 'failed'
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'ansible_play_hosts_all | length == 1'
          - nested_obs['amt-target-b.invalid'].failed_assertion == 'ansible_play_hosts_all | length == 1'
          - nested_obs['amt-target-a.invalid'].play_hosts_all_count | int == 2
          # Nothing was reconciled or persisted: the guard fires before state.yml.
          - nested_obs['amt-target-a.invalid'].run_state is falsy
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          The fan-out guard did not refuse a two-host play. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    - name: Scenario 2 -- a two-host play is still refused with serial 1
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: fanout_two_hosts_serial_one
        scenario_inventory: "{{ nested_dir }}/inventory_two_hosts.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'nested_serial': 1,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/fanout_serial',
             }) }}

    - name: Assert serial 1 does not buy a way past the host-count guard
      # ansible_play_batch is always a subset of ansible_play_hosts_all -- Ansible's
      # variable manager builds them from one inventory query differing only in whether
      # the batch restriction is honoured (ansible/vars/manager.py) -- so the batch
      # assertion validate.yml used to carry (`ansible_play_batch | length == 1`) could
      # not fail unless the roster assertion already had.
      #
      # This is where that is proved rather than argued. The recorded counts below are a
      # two-host play with batch length 1: exactly the case the removed assertion claimed
      # to be an independent guard against. Its predicate HOLDS here (batch == 1) while
      # the roster assertion is the one that fires. So on its own it would have let a
      # serialised multi-host play straight through to the destructive boundary, and
      # removing it lost nothing.
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'ansible_play_hosts_all | length == 1'
          - nested_obs['amt-target-a.invalid'].play_hosts_all_count | int == 2
          - nested_obs['amt-target-a.invalid'].play_batch_count | int == 1
          # The counterfactual, stated as an assertion: the removed guard's predicate is
          # satisfied in a play that must be (and is) refused.
          - (nested_obs['amt-target-a.invalid'].play_batch_count | int == 1) == true
          - (nested_obs['amt-target-a.invalid'].play_hosts_all_count | int == 1) == false
          # Nothing was reached: the roster guard is the first task in the role.
          - nested_obs['amt-target-a.invalid'].run_state is falsy
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          A serial: 1 two-host play was not refused. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    - name: Assert the surviving fan-out refusal still reports the batch count as a diagnostic
      # The removed assertion was the only thing that told an operator how big the
      # current batch was. That information is deliberately preserved -- as a diagnostic
      # in the surviving guard's message, not as a second guarantee -- so a refusal is no
      # less diagnosable than it was before. This also pins the message against
      # regressing back to advising `serial: 1`, which does not help here and read as
      # though it would.
      ansible.builtin.assert:
        that:
          - "'the current batch contains 1' in nested_obs['amt-target-a.invalid'].failed_msg"
          - "'this play targets 2 hosts' in nested_obs['amt-target-a.invalid'].failed_msg"
          - "'`serial: 1` does not change that' in nested_obs['amt-target-a.invalid'].failed_msg"
        fail_msg: >-
          The fan-out refusal message no longer carries the batch count, so removing the
          batch assertion cost an operator diagnostic information. Message was:
          {{ nested_obs['amt-target-a.invalid'].failed_msg }}

    # ------------------------------------------------------------------------------
    # (2) The destructive-action confirmation gate.
    # ------------------------------------------------------------------------------
    - name: Scenario 3 -- nothing happens without amt_baremetal_install_confirm_destructive
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: confirm_destructive_missing
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_confirm_destructive': false,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/confirm_destructive',
             }) }}

    - name: Assert the role refuses to do anything destructive unconfirmed
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'amt_baremetal_install_confirm_destructive | bool'
          - nested_obs['amt-target-a.invalid'].run_state is falsy
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          The role got past validation with confirmation withheld. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (3) Connection-variable resolution -- regression 2. The negative half; scenario 7
    # asserts the positive half.
    # ------------------------------------------------------------------------------
    - name: Scenario 4 -- an unset amt_host fails at validation, it does not fall back to inventory_hostname
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: amt_host_unset
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        # No amt_host and no amt_baremetal_install_host anywhere. The play's one host is
        # amt-target-a.invalid, so a fallback to inventory_hostname would get past this
        # assert and fail later, in probe.yml, with a name-resolution error instead.
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_port': plain_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/amt_host_unset',
             }) }}

    - name: Assert the unset endpoint is caught by validate.yml, not by a failed connection
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'amt_baremetal_install_host is truthy'
          - nested_obs['amt-target-a.invalid'].resolved_host is falsy
          - nested_obs['amt-target-a.invalid'].resolved_host != nested_obs['amt-target-a.invalid'].inventory_hostname
          # Never reached probe.yml, so nothing was ever contacted.
          - nested_obs['amt-target-a.invalid'].run_state is falsy
        fail_msg: >-
          An unset amt_host did not fail loudly in validate.yml. If failed_assertion is
          something else, the role resolved an endpoint from somewhere -- and
          inventory_hostname is the one it must never use. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (4) Capability preflight: amt_info runs before any mutation, and the role refuses
    # to arm a boot selection the firmware does not advertise.
    # ------------------------------------------------------------------------------
    - name: Scenario 5 -- ider_cdrom is refused when the firmware does not advertise IDE-R
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: capability_ider_absent
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': no_caps_info.port,
               'amt_baremetal_install_boot_provider': 'ider_cdrom',
               'amt_baremetal_install_iso_path': media_outside_dir ~ '/boot.iso',
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/capability_ider',
             }) }}

    - name: Assert the IDE-R preflight refuses the endpoint before mutating it
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - "'AMT_BootCapabilities.IDER' in nested_obs['amt-target-a.invalid'].failed_msg"
          # The preflight is the whole point: nothing was armed, nothing was reset, and
          # no media session was ever started.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == false
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == false
          - nested_obs['amt-target-a.invalid'].run_state.media_attached == false
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          The role did not refuse an endpoint that advertises no IDE-R support.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    - name: Scenario 6 -- pxe is refused when the firmware does not advertise forced PXE boot
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: capability_pxe_absent
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': no_caps_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/capability_pxe',
             }) }}

    - name: Assert the forced-PXE preflight refuses the endpoint before mutating it
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - "'AMT_BootCapabilities.ForcePXEBoot' in nested_obs['amt-target-a.invalid'].failed_msg"
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == false
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == false
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          The role did not refuse an endpoint that advertises no forced-PXE support.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (5) The power-transition decision -- regression 1, and the highest-value pair of
    # assertions in this target.
    # ------------------------------------------------------------------------------
    - name: Scenario 7 -- an endpoint observed powered off is sent 'on', not 'reset'
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: powered_off_gets_on
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': powered_off_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/powered_off',
             }) }}

    - name: Assert the powered-off endpoint was powered on and the run completed
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          # Regression 1. `reset` here is the defect: a master bus reset does nothing to
          # a machine that is already off, and the role would have reported success
          # having booted nothing.
          - nested_obs['amt-target-a.invalid'].power_action == 'on'
          # Regression 2, positive half: resolved from amt_host, and demonstrably not
          # from inventory_hostname, which is a different (unresolvable) name.
          - nested_obs['amt-target-a.invalid'].resolved_host == '127.0.0.1'
          - nested_obs['amt-target-a.invalid'].inventory_hostname == 'amt-target-a.invalid'
          - nested_obs['amt-target-a.invalid'].resolved_port | int == powered_off_info.port | int
          - nested_obs['amt-target-a.invalid'].resolved_username == 'admin'
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
        fail_msg: >-
          A machine observed powered off was not sent 'on'
          (power_action={{ nested_obs['amt-target-a.invalid'].power_action }}).
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    - name: Read the run-state file scenario 7 left on disk
      ansible.builtin.stat:
        path: "{{ scratch_dir.path }}/state/powered_off/127.0.0.1.json"
      register: powered_off_state_stat
      delegate_to: localhost

    - name: Assert the run state is persisted per target, private, and matches what the run reported
      ansible.builtin.assert:
        that:
          - powered_off_state_stat.stat.exists == true
          - powered_off_state_stat.stat.mode == '0600'
          - powered_off_state_on_disk.reset_confirmed == true
          - powered_off_state_on_disk.boot_armed == true
          - powered_off_state_on_disk.action_token_issued_at is truthy
          - powered_off_state_on_disk == nested_obs['amt-target-a.invalid'].run_state
        fail_msg: >-
          The per-target run-state file is what makes an interrupted run resumable, so it
          has to exist, be private, and agree with what the run actually did.
      vars:
        powered_off_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/powered_off/127.0.0.1.json') | from_json }}"

    - name: Scenario 8 -- an endpoint observed powered on is sent 'reset'
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: powered_on_gets_reset
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/powered_on',
             }) }}

    - name: Assert the powered-on endpoint was reset and the run completed
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          - nested_obs['amt-target-a.invalid'].power_action == 'reset'
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
        fail_msg: >-
          A machine observed powered on was not sent 'reset'
          (power_action={{ nested_obs['amt-target-a.invalid'].power_action }}).
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (6) Resumability. A separate ansible-playbook invocation has no memory of an
    # interrupted one, so the state file is the only thing standing between a resumed
    # run and blindly re-arming a one-time boot or re-issuing a reset whose outcome
    # nobody confirmed.
    # ------------------------------------------------------------------------------
    - name: Seed the state directories the resumability scenarios read
      ansible.builtin.file:
        path: "{{ scratch_dir.path }}/state/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - resume_refused
        - resume_acknowledged
        - clean_slate
        - handoff_failure
        - media_failure
      delegate_to: localhost

    - name: Seed an interrupted prior run -- boot armed, outcome never confirmed
      ansible.builtin.copy:
        content: "{{ interrupted_prior_state | to_nice_json }}\n"
        dest: "{{ scratch_dir.path }}/state/{{ item }}/127.0.0.1.json"
        mode: "0600"
      loop:
        - resume_refused
        - resume_acknowledged
      delegate_to: localhost
      vars:
        interrupted_prior_state:
          media_attached: false
          session_id: null
          boot_armed: true
          action_token_issued_at: "2026-01-01T00:00:00Z"
          reset_issued: true
          reset_confirmed: false
          detached: true
          last_failure: seeded by the integration target, not a real failure

    - name: Scenario 9 -- an uncertain prior run is not silently resumed
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: resume_refused
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/resume_refused',
             }) }}

    - name: Assert a boot armed with no confirmed outcome blocks the run
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'amt_baremetal_install_force_resume | bool'
          - "'127.0.0.1.json' in nested_obs['amt-target-a.invalid'].failed_msg"
          # Read the prior run's history rather than starting from scratch, and stopped
          # before probe.yml -- so nothing was re-armed and nothing was reset.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == true
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          The role resumed past an unconfirmed boot/reset without acknowledgement.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    - name: Assert the refusal did not rewrite the prior state file
      ansible.builtin.assert:
        that:
          - refused_state_on_disk.action_token_issued_at == '2026-01-01T00:00:00Z'
          - refused_state_on_disk.boot_armed == true
        fail_msg: >-
          A refused run must leave the prior run's record exactly as it found it -- that
          record is what the operator inspects before deciding to force a resume.
      vars:
        refused_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/resume_refused/127.0.0.1.json') | from_json }}"

    - name: Scenario 10 -- an acknowledged resume proceeds and re-arms with a fresh token
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: resume_acknowledged
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_force_resume': true,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/resume_acknowledged',
             }) }}

    - name: Assert the acknowledged resume ran and never reused the prior token's timestamp
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
          - nested_obs['amt-target-a.invalid'].run_state.action_token_issued_at != '2026-01-01T00:00:00Z'
        fail_msg: >-
          -e amt_baremetal_install_force_resume=true must let the run proceed, and every
          arm must issue a brand new action token rather than reusing a prior attempt's.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    - name: Seed a prior run that completed cleanly, with stale session state attached
      ansible.builtin.copy:
        content: "{{ completed_prior_state | to_nice_json }}\n"
        dest: "{{ scratch_dir.path }}/state/clean_slate/127.0.0.1.json"
        mode: "0600"
      delegate_to: localhost
      vars:
        completed_prior_state:
          media_attached: true
          session_id: stale-session-from-a-finished-run
          boot_armed: true
          action_token_issued_at: "2026-01-01T00:00:00Z"
          reset_issued: true
          reset_confirmed: true
          detached: true
          last_failure: seeded by the integration target, not a real failure

    - name: Scenario 11 -- a confirmed prior run starts the next one from a clean slate
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: clean_slate
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/clean_slate',
             }) }}

    - name: Assert a completed prior run's session id and failure are not carried forward
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          # A finished prior run's session was already detached, so carrying its id
          # forward would hand amt_media a session that no longer exists.
          - nested_obs['amt-target-a.invalid'].run_state.session_id is none
          - nested_obs['amt-target-a.invalid'].run_state.last_failure is none
          - nested_obs['amt-target-a.invalid'].run_state.action_token_issued_at != '2026-01-01T00:00:00Z'
        fail_msg: >-
          A prior run with reset_confirmed=true must reset the slate, not resume from it.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (7) wait_for_handoff. Both hardware stages that drive this role set it false, so
    # until now this phase had never run anywhere. The mock WS-Man server is a listening
    # TCP socket on 127.0.0.1, which is all wait_for needs to answer.
    #
    # Every scenario that enables the wait names amt_baremetal_install_handoff_host
    # explicitly. That is now required rather than merely tidy -- see scenario 15 -- and
    # it is the whole point: the role must not infer the OS's address from the AMT
    # management address it was given.
    # ------------------------------------------------------------------------------
    - name: Scenario 12 -- wait_for_handoff succeeds when something answers on the target
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: handoff_success
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_wait_for_handoff': true,
               'amt_baremetal_install_handoff_host': '127.0.0.1',
               'amt_baremetal_install_handoff_port': plain_info.port,
               'amt_baremetal_install_handoff_delay': 0,
               'amt_baremetal_install_handoff_timeout': 20,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/handoff_success',
             }) }}

    - name: Assert the hand-off phase ran and the run completed through it
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
          # The wait_for task is the only thing in the role that names the hand-off
          # port, so its appearance in the nested output is what proves the phase ran
          # rather than being skipped by the `when` in tasks/main.yml.
          - "'Wait for the installed/booted OS to answer' in nested_run.stdout"
          # Explicitly supplied, and used as supplied.
          - nested_obs['amt-target-a.invalid'].resolved_handoff_host == '127.0.0.1'
        fail_msg: >-
          wait_for_handoff=true did not complete against a listening port.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (8) Media is always detached, even on failure. A leaked IDE-R session holds the
    # target's boot device open, so the `always` block has to run whatever failed.
    #
    # Both scenarios below seed a session id into the prior state so that
    # detach_media.yml's `when: session_id is truthy` is actually satisfied and the real
    # amt_media state=detached call runs, rather than being skipped.
    # ------------------------------------------------------------------------------
    - name: Seed a prior run that left a media session id behind
      ansible.builtin.copy:
        content: "{{ attached_prior_state | to_nice_json }}\n"
        dest: "{{ scratch_dir.path }}/state/{{ item }}/127.0.0.1.json"
        mode: "0600"
      loop:
        - handoff_failure
        - media_failure
      delegate_to: localhost
      vars:
        attached_prior_state:
          media_attached: true
          session_id: seeded-session-not-a-real-ider-session
          boot_armed: false
          action_token_issued_at: null
          reset_issued: false
          reset_confirmed: false
          detached: false
          last_failure: null

    - name: Scenario 13 -- a failure after the reset still detaches media
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: handoff_failure
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        # Points the hand-off wait at a port nothing is listening on, with a short
        # timeout: a deterministic mid-run failure *after* the destructive boundary.
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_wait_for_handoff': true,
               'amt_baremetal_install_handoff_host': '127.0.0.1',
               'amt_baremetal_install_handoff_port': closed_port,
               'amt_baremetal_install_handoff_delay': 0,
               'amt_baremetal_install_handoff_timeout': 5,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/handoff_failure',
             }) }}

    - name: Assert the post-reset failure was recorded, re-raised, and still detached
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          # rescue -> record_failure.yml ran.
          - nested_obs['amt-target-a.invalid'].run_state.last_failure is truthy
          # always -> detach_media.yml ran, after the rescue, and persisted the fact.
          - nested_obs['amt-target-a.invalid'].run_state.detached == true
          - handoff_failure_state_on_disk.detached == true
          - handoff_failure_state_on_disk.last_failure is truthy
          # The reset genuinely happened before the failure, and the role says so.
          - handoff_failure_state_on_disk.reset_issued == true
        fail_msg: >-
          A failure after the reset must still detach media -- a leaked IDE-R session
          holds the target's boot device open. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}
      vars:
        handoff_failure_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/handoff_failure/127.0.0.1.json') | from_json }}"

    - name: Scenario 14 -- a failure in the media phase never reaches the destructive boundary
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: media_failure
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        # allowed_directory and the ISO deliberately disagree, so amt_media refuses the
        # image during its own validation -- before it opens any redirection connection.
        # That makes this a deterministic failure inside the media phase with no IDE-R
        # endpoint involved at all.
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_boot_provider': 'ider_cdrom',
               'amt_baremetal_install_iso_path': media_outside_dir ~ '/boot.iso',
               'amt_baremetal_install_media_allowed_directory': media_allowed_dir,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/media_failure',
             }) }}

    - name: Assert a failed media attach arms nothing, resets nothing, and still detaches
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          - "'outside allowed directory' in nested_obs['amt-target-a.invalid'].failed_msg"
          # The ordering in tasks/main.yml is the safety property: media comes before the
          # one-time boot arm, which comes before the reset. A failure in the media phase
          # must therefore leave the machine untouched.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == false
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == false
          - nested_obs['amt-target-a.invalid'].power_action is falsy
          # ...and the always block still ran.
          - media_failure_state_on_disk.detached == true
          - media_failure_state_on_disk.reset_issued == false
          - media_failure_state_on_disk.last_failure is truthy
          # The resume half of the session-id claim; scenario 17 covers the fresh half.
          # This scenario's seeded prior state already carries a session id, and
          # attach_media.yml must reuse it rather than generate a new one: IDE-R is
          # single-session, and amt_media's idempotent re-attach contract is keyed on being
          # handed the *same* id. A claim step that regenerated unconditionally would
          # strand the prior run's session and start a second against firmware that has
          # only one connection to give.
          - nested_obs['amt-target-a.invalid'].run_state.session_id == 'seeded-session-not-a-real-ider-session'
          - media_failure_state_on_disk.session_id == 'seeded-session-not-a-real-ider-session'
        fail_msg: >-
          A failure in the media phase must not arm a boot selection or reset the
          machine, and must still detach. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}
      vars:
        media_failure_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/media_failure/127.0.0.1.json') | from_json }}"

    # ------------------------------------------------------------------------------
    # (9) The hand-off endpoint is required, not guessed. It used to default to
    # amt_baremetal_install_host -- the AMT *management* address -- which the freshly
    # installed OS does not necessarily answer on. A wrong guess is only discovered after
    # the reset, once the full amt_baremetal_install_handoff_timeout has elapsed, so the
    # refusal has to happen in validate.yml where nothing has been touched yet.
    # ------------------------------------------------------------------------------
    - name: Scenario 15 -- wait_for_handoff without a hand-off host is refused up front
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: handoff_host_missing
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        # amt_host is set, so a fallback to the management address would sail past
        # validation and only fail an hour later in wait_for. Nothing sets
        # amt_baremetal_install_handoff_host.
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_wait_for_handoff': true,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/handoff_host_missing',
             }) }}

    - name: Assert the missing hand-off host is caught in validate.yml, before anything is touched
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          - nested_obs['amt-target-a.invalid'].failed_assertion == 'amt_baremetal_install_handoff_host is truthy'
          # The regression itself: it must not have fallen back to the AMT management
          # address, which is set and would have looked entirely plausible...
          - nested_obs['amt-target-a.invalid'].resolved_handoff_host is falsy
          - nested_obs['amt-target-a.invalid'].resolved_host == '127.0.0.1'
          - nested_obs['amt-target-a.invalid'].resolved_handoff_host != nested_obs['amt-target-a.invalid'].resolved_host
          # ...nor to inventory_hostname, the other plausible-looking wrong answer.
          - nested_obs['amt-target-a.invalid'].resolved_handoff_host != nested_obs['amt-target-a.invalid'].inventory_hostname
          # Refused before state.yml, so nothing was reconciled, contacted or reset. This
          # is the entire value of moving the failure up front.
          - nested_obs['amt-target-a.invalid'].run_state is falsy
          - nested_obs['amt-target-a.invalid'].power_action is falsy
          - "'amt_baremetal_install_wait_for_handoff=false' in nested_obs['amt-target-a.invalid'].failed_msg"
        fail_msg: >-
          wait_for_handoff=true with no handoff_host must fail in validate.yml. If
          failed_assertion is something else, or resolved_handoff_host is truthy, the role
          guessed an address the operator never named. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    - name: Scenario 15b -- the same run is fine once the hand-off wait is opted out of
      # The refusal above must be reachable *only* by the wait being enabled: it is a
      # conditional requirement, not a new unconditional one. Both hardware qualification
      # stages set wait_for_handoff=false, so this is the path they take.
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: handoff_host_not_needed
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_wait_for_handoff': false,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/handoff_host_not_needed',
             }) }}

    - name: Assert no hand-off host is required when the hand-off wait is disabled
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          - nested_obs['amt-target-a.invalid'].resolved_handoff_host is falsy
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
          - "'Wait for the installed/booted OS to answer' not in nested_run.stdout"
        fail_msg: >-
          The hand-off host requirement must be conditional on wait_for_handoff. A run
          with the wait disabled and no handoff_host has to complete. rc={{ nested_run.rc }}.
          Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (10) The media phase, driven all the way to a real IDE-R handshake.
    #
    # attach_media.yml forwarded every connection option to amt_media except `port`, and
    # the role had no media-port variable at all, so IDE-R could only ever reach the stock
    # redirection ports (16995 with TLS, 16994 without). That had two consequences: an
    # operator whose endpoints redirect on a non-default port could not use this role,
    # and this target could not aim the media phase at the mock IDE-R server -- which
    # binds an ephemeral port -- so scenario 14 could only reach amt_media's own
    # validation and stop there.
    #
    # This scenario is the coverage that unblocks. Two mock servers, two planes, two
    # ports: the WS-Man mock answers probe/redirection/boot/power on amt_port, and the
    # IDE-R mock answers the media session on amt_baremetal_install_media_port. Nothing
    # is listening on 16994, so an unforwarded port cannot pass this.
    # ------------------------------------------------------------------------------
    - name: Start the mock IDE-R server the media-phase scenario attaches against
      # Started here rather than alongside the WS-Man mocks at the top: this server plays
      # firmware for exactly one redirection session (see run_ider_mock.py's docstring),
      # so it is brought up immediately before the one scenario that connects to it.
      ansible.builtin.shell: |
        set -e
        nohup {{ ansible_playbook_python }} {{ mock_servers_dir }}/run_ider_mock.py \
          --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ ider_ready_file }} \
          --handshake-timeout 60 \
          > {{ scratch_dir.path }}/ider.log 2>&1 &
        echo $!
      args:
        executable: /bin/bash
      register: ider_start
      changed_when: false
      delegate_to: localhost

    - name: Wait for the mock IDE-R server to report ready
      ansible.builtin.wait_for:
        path: "{{ ider_ready_file }}"
        state: present
        timeout: 15
      delegate_to: localhost

    - name: Read the mock IDE-R server's connection info and pid
      ansible.builtin.set_fact:
        ider_info: "{{ lookup('ansible.builtin.file', ider_ready_file) | from_json }}"
        ider_pid: "{{ ider_start.stdout | trim }}"

    - name: Assert the IDE-R mock is on an ephemeral port, not a stock redirection port
      # The premise of the scenario. If the mock happened to land on 16994/16995 the
      # attach could succeed with the port never forwarded at all, and this would prove
      # nothing.
      ansible.builtin.assert:
        that:
          - ider_info.port | int not in [16994, 16995]
          - ider_info.port | int != plain_info.port | int
          - ider_info.handshake == false
        fail_msg: >-
          The mock IDE-R server must be on an ephemeral port distinct from the WS-Man
          mock's, and must not have handshaked with anything yet. port={{ ider_info.port }}.

    - name: Scenario 16 -- the media phase reaches a mock IDE-R server on an ephemeral port
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: media_ider_port
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_boot_provider': 'ider_cdrom',
               'amt_baremetal_install_media_port': ider_info.port,
               'amt_baremetal_install_iso_path': media_allowed_dir ~ '/boot.iso',
               'amt_baremetal_install_media_allowed_directory': media_allowed_dir,
               'amt_baremetal_install_media_attach_timeout': 30,
               'amt_baremetal_install_media_detach_timeout': 20,
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/media_ider_port',
             }) }}

    - name: Read what the mock IDE-R server recorded about the session it was given
      ansible.builtin.set_fact:
        ider_result: "{{ lookup('ansible.builtin.file', ider_ready_file) | from_json }}"
      delegate_to: localhost

    - name: Assert the role's media session actually reached the ephemeral IDE-R port
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          # The fix, observed from the far end: the mock completed an IDE-R handshake, so
          # amt_media connected to *this* port. Before the port was forwarded, amt_media
          # applied its own default (16994, since use_tls is false here) and the attach
          # failed with nothing listening there.
          - ider_result.handshake == true
          - ider_result.error is none
          # ...and observed from the role's side: the value was forwarded, not defaulted.
          - nested_obs['amt-target-a.invalid'].resolved_media_port | int == ider_info.port | int
          # The two planes stayed separate. This is the assertion that would catch
          # "forward amt_baremetal_install_port to amt_media" as a fix, which would be wrong.
          - nested_obs['amt-target-a.invalid'].resolved_media_port | int != nested_obs['amt-target-a.invalid'].resolved_port | int
          # A real session was attached and recorded, so the media phase genuinely ran
          # rather than being skipped.
          - nested_obs['amt-target-a.invalid'].run_state.media_attached == true
          - nested_obs['amt-target-a.invalid'].run_state.session_id is truthy
          # ...and the lifecycle continued past it, through the destructive boundary.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
          # The always block detached it again, so no daemon is left holding the mock's
          # connection open.
          - nested_obs['amt-target-a.invalid'].run_state.detached == true
          - media_ider_state_on_disk.detached == true
          - media_ider_state_on_disk.media_attached == true
        fail_msg: >-
          The media phase did not reach the mock IDE-R server on port {{ ider_info.port }}.
          handshake={{ ider_result.handshake }}, error={{ ider_result.error }},
          resolved_media_port={{ nested_obs['amt-target-a.invalid'].resolved_media_port }}.
          If handshake is false and the media port resolved correctly, amt_media was given
          the port but could not use it; if resolved_media_port is empty, attach_media.yml
          is not forwarding it. rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}
      vars:
        media_ider_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/media_ider_port/127.0.0.1.json') | from_json }}"

    - name: Confirm the media session left no state file behind in the runtime directory
      ansible.builtin.find:
        paths: "{{ scratch_dir.path }}/media-runtime"
        patterns: "*.json"
      register: media_runtime_leftovers
      delegate_to: localhost

    - name: Assert the detach cleaned up amt_media's own session state file
      ansible.builtin.assert:
        that:
          - media_runtime_leftovers.matched == 0
        fail_msg: >-
          amt_media's session state file was left behind, which means the role's always
          block did not detach the session it attached. Found:
          {{ media_runtime_leftovers.files | map(attribute='path') | list }}

    # ------------------------------------------------------------------------------
    # (11) A failed attach must not orphan the IDE-R session it spawned.
    #
    # amt_media's state=attached forks a detached daemon that owns the connection, and
    # that daemon outlives a failed attach by construction. The role used to record the
    # session id only from a *successful* attach's result -- and amt_media generates its
    # own id when the caller passes none -- so a failed attach left run state with
    # session_id=null, detach_media.yml's `when: ... is truthy` skipped, and the role
    # orphaned the very daemon whose existence the failure was reporting. IDE-R being
    # single-session, that orphan also wedges the endpoint against the next attempt.
    #
    # The leak is observable on the filesystem, which is what this scenario asserts
    # against rather than anything self-reported: amt_media's attach path writes a state
    # file at "<runtime_dir>/<session_id>.json" before it connects, and does not remove it
    # when the attach fails. Only state=detached removes it. So a leftover *.json in the
    # runtime directory after a failed attach *is* the orphan, and an empty runtime
    # directory is proof the always-detach genuinely ran.
    #
    # Note what is deliberately NOT asserted here: `detached` in the run state is useless
    # as evidence, because amt_baremetal_install_default_state starts it at true. A fresh
    # failed run has detached=true whether or not the detach ever happened.
    #
    # The media port points at a port nothing is listening on, so the daemon spawns,
    # fails to connect, and dies -- deterministic, fast, and needs no mock IDE-R server.
    # See the note in the PR description about why the "daemon still alive when
    # attach_timeout expires" variant cannot be expressed against amt_media as it stands.
    - name: Scenario 17 -- a failed media attach does not orphan the session it spawned
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: media_attach_orphan
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_port': plain_info.port,
               'amt_baremetal_install_boot_provider': 'ider_cdrom',
               'amt_baremetal_install_media_port': closed_port,
               'amt_baremetal_install_iso_path': media_allowed_dir ~ '/boot.iso',
               'amt_baremetal_install_media_attach_timeout': 10,
               'amt_baremetal_install_media_detach_timeout': 15,
               'amt_baremetal_install_media_runtime_dir': scratch_dir.path ~ '/media-runtime-orphan',
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/media_attach_orphan',
             }) }}

    - name: Look for an IDE-R session state file the failed attach may have left behind
      ansible.builtin.find:
        paths: "{{ scratch_dir.path }}/media-runtime-orphan"
        patterns: "*.json"
        file_type: file
      register: orphaned_session_files
      delegate_to: localhost

    - name: Assert the failed attach was recorded against a known session id and cleaned up
      ansible.builtin.assert:
        that:
          - nested_run.rc != 0
          - nested_obs['amt-target-a.invalid'].outcome == 'failed'
          # The attach genuinely failed at the connection, so a daemon really was spawned.
          # Asserted against failed_msg rather than failed_error_class because the role's
          # rescue re-raises through ansible.builtin.fail (tasks/main.yml), so
          # ansible_failed_result at the nested play's level is that fail task, not
          # amt_media's result. record_failure.yml folds the module's error_class into the
          # message it builds, which is what survives -- same as scenario 14 asserts.
          - "'error_class=connection' in nested_obs['amt-target-a.invalid'].failed_msg"
          - "'amt_media attach failed' in nested_obs['amt-target-a.invalid'].failed_msg"
          # The fix: the role claimed and persisted a session id BEFORE the attach, so it
          # knows what to detach even though the attach never returned an id to it.
          - nested_obs['amt-target-a.invalid'].run_state.session_id is truthy
          - orphan_state_on_disk.session_id is truthy
          # ...and the attach is still honestly recorded as never confirmed. Claiming the
          # id early must not make a failed attach look like a successful one to a resumed
          # run.
          - nested_obs['amt-target-a.invalid'].run_state.media_attached == false
          - orphan_state_on_disk.media_attached == false
          # The leak itself, measured on the filesystem: state=detached is the only thing
          # that removes this file, so an empty runtime directory proves the always-detach
          # ran. Pre-fix this directory retained the orphaned session's state file.
          - orphaned_session_files.matched == 0
          # Nothing past the media phase happened, so the machine was never touched.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == false
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == false
          - nested_obs['amt-target-a.invalid'].power_action is falsy
        fail_msg: >-
          A failed media attach orphaned its IDE-R session. session_id in run state was
          {{ nested_obs['amt-target-a.invalid'].run_state.session_id | default('(absent)') }};
          leftover session state files:
          {{ orphaned_session_files.files | map(attribute='path') | list }}.
          If session_id is null the role never claimed one before the attach, so
          detach_media.yml was skipped and amt_media's daemon was left holding the session
          -- which for a single-session protocol also blocks the next attempt.
          rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}
      vars:
        orphan_state_on_disk: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/state/media_attach_orphan/127.0.0.1.json') | from_json }}"

    - name: Assert the failure output names the session id an operator would need to clean up
      # A failure that strands a session the operator cannot name is worse than one that
      # names it. record_failure.yml reports the id and runtime directory on every
      # failure, so the recovery path is in the output the operator already has.
      ansible.builtin.assert:
        that:
          - nested_obs['amt-target-a.invalid'].run_state.session_id in nested_run.stdout
          - "'media_session_id' in nested_run.stdout"
          - "'manual_detach_hint' in nested_run.stdout"
        fail_msg: >-
          The role failed without naming the media session id in its output, so an
          operator whose detach also failed has no way to find the stranded session.
          Nested output tail:
          {{ nested_tail }}

    # ------------------------------------------------------------------------------
    # (12) Regression for #87. An unset amt_baremetal_install_port/_media_port must
    # resolve to None-or-omitted, on whatever ansible-core is running this target --
    # never to the empty string. On ansible-core <=2.18, a quoted scalar template that
    # evaluates to Jinja's None is stringified by finalize before Ansible's convert_data
    # step gets a chance to evaluate it back, so `"{{ amt_port | default(None) }}"`
    # arrived at the module boundary as literal "" rather than None -- and amt_port is
    # `type: int` there, so that was a type error raised before any connection was
    # attempted, not a graceful fall-through. An operator on stock ports (i.e. every
    # scenario above except 16 and 17, none of which set amt_port) could not use this
    # role at all on those cores.
    #
    # This scenario is the strongest available proof that the fix (`default(omit, true)`
    # applied at each of the six places tasks/*.yml pass these as a module `port` --
    # see defaults/main.yml's comment on amt_baremetal_install_port for why the
    # conversion lives there and not in the stored role variable itself) actually
    # reaches the module's own default port rather than merely avoiding a crash: a mock
    # is bound to the *exact* plaintext default (module_utils/tls.py's
    # DEFAULT_PLAINTEXT_PORT, 16992) and nothing else in this target ever listens there,
    # so the run below can only reach reset_confirmed=true if probe.yml, arm_boot.yml,
    # reset.yml and observe.yml *all four* independently resolved the omitted port to
    # that same live endpoint. amt_port is not set anywhere in scenario_vars below --
    # that absence is the entire point.
    #
    # To prove this scenario can fail: revert defaults/main.yml's
    # amt_baremetal_install_port to `"{{ amt_port | default(None) }}"` used directly as
    # the six tasks' `port:` value (i.e. drop `| default(omit, true)` at each call site)
    # and rerun on ansible-core <=2.18 -- the assertion below fails with rc!=0 and
    # "cannot be converted to an int" in the nested output, which is exactly the
    # signature this scenario pins against.
    - name: Start a mock WS-Man server on the exact plaintext default port, for the port-fallthrough regression
      ansible.builtin.shell: |
        set -e
        nohup {{ ansible_playbook_python }} {{ role_path }}/files/run_wsman_mock_fixed_port.py \
          --mock-servers-dir {{ mock_servers_dir }} --ready-file {{ default_port_ready_file }} \
          --port 16992 \
          > {{ scratch_dir.path }}/wsman_default_port.log 2>&1 &
        echo $!
      args:
        executable: /bin/bash
      register: default_port_start
      changed_when: false
      delegate_to: localhost
      vars:
        default_port_ready_file: "{{ scratch_dir.path }}/wsman_default_port_ready.json"

    - name: Wait for the fixed-port mock to report ready
      ansible.builtin.wait_for:
        path: "{{ scratch_dir.path }}/wsman_default_port_ready.json"
        state: present
        timeout: 15
      delegate_to: localhost

    - name: Read the fixed-port mock's connection info and pid
      ansible.builtin.set_fact:
        default_port_info: "{{ lookup('ansible.builtin.file', scratch_dir.path ~ '/wsman_default_port_ready.json') | from_json }}"
        default_port_pid: "{{ default_port_start.stdout | trim }}"

    - name: Assert the fixed-port mock actually bound the exact plaintext default, not something else
      # The premise of the scenario: if this landed on a different port (e.g. because
      # 16992 was already taken and the bind silently fell back), success below would
      # prove nothing about the fix.
      ansible.builtin.assert:
        that:
          - default_port_info.port | int == 16992
        fail_msg: >-
          The fixed-port mock did not bind 16992 (module_utils/tls.py's
          DEFAULT_PLAINTEXT_PORT). Got port={{ default_port_info.port }}.

    - name: Scenario 18 -- an unset amt_port falls through to the module's own default port, all the way to a completed run
      ansible.builtin.include_tasks: run_nested.yml
      vars:
        scenario: port_falls_through_to_module_default
        scenario_inventory: "{{ nested_dir }}/inventory_one_host.yml"
        scenario_hosts: [amt-target-a.invalid]
        # amt_port is deliberately absent from this combine -- that is the entire
        # point of the scenario. amt_host still has to be set, or validate.yml would
        # refuse before ever reaching the port this scenario cares about.
        scenario_vars: >-
          {{ nested_base_vars | combine({
               'amt_host': '127.0.0.1',
               'amt_baremetal_install_state_dir': scratch_dir.path ~ '/state/port_fallthrough',
             }) }}

    - name: Assert the run completed end to end with no port ever specified, and never saw the old type-conversion failure
      ansible.builtin.assert:
        that:
          - nested_run.rc == 0
          - nested_obs['amt-target-a.invalid'].outcome == 'succeeded'
          # The stored role variable itself: None on ansible-core >=2.19, "" on <=2.18
          # (see defaults/main.yml) -- never the omit sentinel, and never anything
          # that reads as present.
          - nested_obs['amt-target-a.invalid'].resolved_port is falsy
          # probe.yml, arm_boot.yml, reset.yml and observe.yml all reached the one
          # endpoint listening on the module's own default port -- nothing else in
          # this target listens on 16992, so this could not have completed any other
          # way with amt_port unset everywhere above.
          - nested_obs['amt-target-a.invalid'].run_state.boot_armed == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_issued == true
          - nested_obs['amt-target-a.invalid'].run_state.reset_confirmed == true
          # Pins the exact failure signature #87 reports, so a regression here is
          # never mistaken for an unrelated failure.
          - "'cannot be converted to an int' not in nested_run.stdout"
        fail_msg: >-
          An unset amt_port did not cleanly fall through to the module's own default
          port. rc={{ nested_run.rc }}. Nested output tail:
          {{ nested_tail }}

    - name: Assert nothing in this target ever wrote to the real home directory
      # Every nested run had HOME redirected into the scratch tree, and every scenario
      # overrode the role's state and media-session directories. This confirms both.
      ansible.builtin.stat:
        path: "{{ scratch_dir.path }}/home/.ansible/intel_amt"
      register: redirected_home_stat
      delegate_to: localhost

    - name: Assert the redirected home was used if the role's defaults were ever reached
      ansible.builtin.assert:
        that:
          - redirected_home_stat.stat.exists == false
        fail_msg: >-
          Something fell back to the role's `~/.ansible/intel_amt/...` defaults. Harmless
          here because HOME was redirected, but it means a scenario was not passing the
          state or runtime directory it thought it was.
  always:
    - name: Stop the mock WS-Man servers
      ansible.builtin.command: "kill {{ item }}"
      loop:
        - "{{ plain_pid }}"
        - "{{ powered_off_pid }}"
        - "{{ no_caps_pid }}"
      delegate_to: localhost
      failed_when: false
      changed_when: false

    - name: Stop the mock IDE-R server
      # Guarded by `is defined` because this one is started partway through the block
      # above, so an earlier scenario failing means it was never launched.
      ansible.builtin.command: "kill {{ ider_pid }}"
      delegate_to: localhost
      failed_when: false
      changed_when: false
      when: ider_pid is defined

    - name: Stop the fixed-port mock WS-Man server
      # Guarded the same way as the IDE-R server above: started even later in the
      # block, so an earlier failure means it was never launched.
      ansible.builtin.command: "kill {{ default_port_pid }}"
      delegate_to: localhost
      failed_when: false
      changed_when: false
      when: default_port_pid is defined

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ scratch_dir.path }}"
        state: absent
      delegate_to: localhost
