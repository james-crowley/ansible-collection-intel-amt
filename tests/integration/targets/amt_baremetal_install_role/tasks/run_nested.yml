# The mechanics every scenario in main.yml shares: run files/nested_play.yml as its own
# ansible-playbook process, then load the structured observation each host dumped.
#
# Callers pass, via `vars:` on the include:
#   scenario           - short slug; names this run's observation directory
#   scenario_inventory - path to the inventory to run against
#   scenario_hosts     - the host names that inventory contains, in any order
#   scenario_vars      - the --extra-vars dict (usually nested_base_vars | combine(...))
#
# and afterwards read:
#   nested_run  - the registered command result (rc, stdout_lines)
#   nested_obs  - {host: observation dict}, parsed from the dumps
#   nested_tail - the tail of the nested playbook's output, for assertion fail_msgs
#
# rc is captured rather than enforced (`failed_when: false`): most scenarios here are
# proving the role *refuses* something, so a non-zero rc is the expected result and the
# caller is the only thing that knows which way round it should be.
#
# One assertion lives here rather than in a caller: that an observation value with
# nothing behind it arrives as null. Every scenario depends on that, so it is checked
# once for all of them -- see the last task in this file.

- name: "Derive the observation directory for scenario {{ scenario }}"
  ansible.builtin.set_fact:
    nested_dump_dir: "{{ scratch_dir.path }}/dumps/{{ scenario }}"
    # Reset, so a scenario can never accidentally assert on the previous one's dump.
    nested_obs: {}

- name: "Start from an empty observation directory for scenario {{ scenario }}"
  ansible.builtin.file:
    path: "{{ nested_dump_dir }}"
    state: "{{ item }}"
    mode: "0700"
  loop:
    - absent
    - directory
  delegate_to: localhost

- name: "Run the role under test in its own ansible-playbook process for scenario {{ scenario }}"
  ansible.builtin.command:
    argv:
      - "{{ nested_ansible_playbook }}"
      - "-i"
      - "{{ scenario_inventory }}"
      - "{{ nested_dir }}/nested_play.yml"
      - "--extra-vars"
      - "{{ scenario_vars | combine({'nested_dump_dir': nested_dump_dir}) | to_json }}"
    # A directory this target owns, so the nested run never inherits a world-writable
    # working directory (which Ansible warns about) or anything from the outer run.
    chdir: "{{ nested_dir }}"
  environment: "{{ nested_env }}"
  register: nested_run
  changed_when: true
  failed_when: false
  delegate_to: localhost

- name: "Keep the tail of the nested output for assertion messages in scenario {{ scenario }}"
  ansible.builtin.set_fact:
    nested_tail: '{{ (nested_run.stdout_lines | default([]))[-40:] | join("\n") }}'

- name: "Confirm every host wrote an observation dump in scenario {{ scenario }}"
  ansible.builtin.stat:
    path: "{{ nested_dump_dir }}/{{ item }}.json"
  loop: "{{ scenario_hosts }}"
  register: nested_dump_stat
  delegate_to: localhost

- name: "Assert the dumps exist before anything asserts on them, for scenario {{ scenario }}"
  ansible.builtin.assert:
    that:
      - nested_dump_stat.results | map(attribute='stat.exists') | list == [true] * (scenario_hosts | length)
    fail_msg: >-
      {{ scenario }}: the nested play did not write an observation dump for every host,
      so it failed before or during files/nested_play.yml itself rather than inside the
      role. Nested output tail:
      {{ nested_tail }}

- name: "Load each host's observation dump for scenario {{ scenario }}"
  ansible.builtin.set_fact:
    nested_obs: "{{ nested_obs | combine({item: lookup('ansible.builtin.file', nested_dump_dir ~ '/' ~ item ~ '.json') | from_json}) }}"
  loop: "{{ scenario_hosts }}"

- name: "Assert an absent observation value is null, not empty text, for scenario {{ scenario }}"
  # The canary for issue #80, checked once per scenario before any of them asserts on a
  # value it expects to be absent. nested_play.yml emits absent_value_canary from a
  # variable nothing sets, so it is absent by construction and must serialise as JSON
  # null on every supported ansible-core.
  #
  # Without this, a regression in how that dump is built does not fail here -- it fails
  # in whichever scenario next writes `run_state is none`, whose fail_msg then reports
  # that a destructive-action safety guard did not fire. That message is wrong and
  # costly: it points at the role, and the nested output pasted beneath it shows the
  # guard working. This task is what turns that into one named failure in the shared
  # helper instead.
  ansible.builtin.assert:
    that:
      - nested_obs[scenario_hosts | first].absent_value_canary is none
    fail_msg: >-
      {{ scenario }}: an observation key with no value behind it came back as
      {{ nested_obs[scenario_hosts | first].absent_value_canary | type_debug }}
      ({{ nested_obs[scenario_hosts | first].absent_value_canary | to_json }}) rather
      than null, so every `is none` assertion in tasks/main.yml is now testing the wrong
      thing and will report a safety guard as broken when it is not.

      This is the ansible-core version divergence issue #80 fixed. Something in
      files/nested_play.yml has gone back to emitting an observation value as its own
      quoted per-key template ending in `| default(none)`. Jinja renders None as the
      empty string, and on ansible-core 2.18 and older -- 2.17 is this collection's
      declared floor -- that empty string is what Ansible gets back, while 2.19 and
      newer preserve the real None. The whole observation dict has to be built inside
      one expression, so that only the serialised JSON crosses the template boundary.
      See the comment on nested_observation in files/nested_play.yml.
