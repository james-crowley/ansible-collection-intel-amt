# Hardware qualification stage 6 (see README.md): writable-image test -- confirm the
# floppy/USB-R device is accepted, attached, and presented to the guest as writable.
#
# IMPORTANT -- read this before trusting a green run of this stage:
#
# A BIOS sitting at a boot prompt does not spontaneously write to an attached floppy.
# Without an OS or rescue environment actually booted and issuing SCSI writes on the other
# end of the IDE-R session, NOTHING will write to the device, and bytes_written=0 is the
# correct, expected, LEGITIMATE outcome -- not a failure. This stage therefore only asserts
# what is actually true without an OS on the target:
#
#   - the writable image is accepted and attached,
#   - the device is presented as WRITABLE -- the MODE_SENSE write-protect bit this collection
#     reports to the guest is 0x00, not the 0x80 "write protected" default (see
#     docs/protocol-notes.md s5.2 point 3; surfaced here via RV(devices.floppy.writable)),
#   - the session stays healthy throughout and reports bytes_read/bytes_written,
#   - IF bytes_written is non-zero, the checksum on disk actually changed to match (a real
#     write happened and was observed consistently). If it is zero, that proves nothing wrote
#     -- it does NOT prove the write path is broken.
#
# Confirming a *non-zero* bytes_written requires something that boots and writes: run this
# stage back-to-back with a booted rescue environment attached (e.g. reuse
# qualify_media_attach.yml's ISO slot for a Linux rescue image, alongside this stage's
# writable image on the floppy slot), or a real unattended installer's answer-file workflow
# (roles/amt_baremetal_install's ider_cdrom provider with amt_baremetal_install_answer_image_path
# set). The interactive pause below is where a human (or CI-side scripted equivalent) does
# that; everything else in this file is automated evidence collection either way.
#
# Wired into CircleCI as the hardware-writable job, behind its own approval gate (see
# .circleci/config.yml). In CI (amt_qualify_attended=false) the pause below is skipped, so a
# CI run of this stage always observes bytes_written=0 and reports that honestly rather than
# claiming a write it cannot produce -- see the debug task below.
#
# Run manually, one host at a time, attended:
#
#   ansible-playbook tests/hardware/qualify_writable_image.yml \
#     -i tests/hardware/inventory.yml -l <single-host> \
#     -e amt_test_image_path=/path/to/small-test.img
#
# tests/hardware/make-test-media.sh produces a small zero-filled writable image (a clean
# multiple of 512 bytes) if you do not already have one you are prepared to have overwritten.

- name: "Hardware qualification stage 6: writable-image test"
  hosts: amt_targets
  serial: 1
  gather_facts: false
  connection: local
  vars:
    amt_output_dir: "{{ playbook_dir }}/output"

  tasks:
    - name: Refuse to run against more than one host at a time
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: "This stage attaches real hardware's boot device and must run one machine at a time."

    - name: Require a scratch writable test image path
      ansible.builtin.assert:
        that:
          - amt_test_image_path is defined and amt_test_image_path | length > 0
        fail_msg: >-
          Set amt_test_image_path (e.g. via tests/hardware/make-test-media.sh's
          AMT_TEST_IMAGE_PATH) to a small, disposable raw image (size a multiple
          of 512 bytes) you are prepared to have overwritten. Never commit it --
          see the repository .gitignore.

    - name: Checksum the image before attaching
      ansible.builtin.stat:
        path: "{{ amt_test_image_path }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      register: amt_before_checksum

    # block/rescue/always mirrors qualify_readonly.yml's rescue pattern for diagnosability,
    # and additionally guarantees the media is detached (and the IDE-R session ends) even if
    # anything above fails -- this stage attaches real hardware's boot device, and a stray
    # background media daemon left running is exactly the "media daemon running" failure mode
    # the README's recovery section exists to prevent.
    - name: Attach, exercise, and re-read the writable session
      block:
        - name: Enable IDE-R
          james_crowley.intel_amt.amt_redirection:
            host: "{{ amt_host }}"
            username: "{{ amt_username }}"
            password: "{{ amt_password }}"
            tls_fingerprint: "{{ amt_tls_fingerprint }}"
            state: ider
          delegate_to: localhost
          no_log: true

        - name: Attach the writable test image on the floppy/USB-R slot
          james_crowley.intel_amt.amt_media:
            host: "{{ amt_host }}"
            username: "{{ amt_username }}"
            password: "{{ amt_password }}"
            tls_fingerprint: "{{ amt_tls_fingerprint }}"
            floppy: "{{ amt_test_image_path }}"
            floppy_writable: true
            state: attached
          delegate_to: localhost
          no_log: true
          register: amt_media_write_test

        - name: Confirm the device is presented as writable (MODE_SENSE write-protect bit cleared)
          ansible.builtin.assert:
            that:
              - amt_media_write_test.devices.floppy.writable | default(false) | bool
            fail_msg: >-
              The floppy/USB-R slot did not come back writable
              (devices.floppy.writable={{ amt_media_write_test.devices.floppy.writable | default('unset') }}).
              Per docs/protocol-notes.md s5.2, this reflects the MODE_SENSE write-protect bit
              this collection reports to the guest (0x00 when writable, 0x80 -- "write
              protected" -- otherwise). If it is not writable here, floppy_writable=true was
              not honoured, and nothing downstream could ever write regardless of what boots.
            success_msg: >-
              Device presented as writable (write-protect bit reports 0x00, not 0x80). This
              proves the attach path opened the image read-write; it does NOT by itself prove
              any bytes were written -- see the bytes_written check further below.

        - name: Pause while the operator (or a booted helper OS) writes a known pattern to the device
          ansible.builtin.pause:
            prompt: >-
              IDE-R session {{ amt_media_write_test.session_id }} is attached and presented
              writable. From a booted environment that sees this as a block device, write a
              known pattern (e.g. `dd if=/dev/urandom of=/dev/sdX bs=1M count=1`) and press
              enter once done, or press enter immediately to skip -- bytes_written=0 is a
              legitimate outcome, not a failure. This stage cannot make anything write to the
              device on its own.
          when: amt_qualify_attended | default(true) | bool

        # Every amt_media call needs the full connection options, not just
        # host/username/password. This re-read omitted tls_fingerprint and
        # therefore failed with error_class=tls_validation: amt_media requires a
        # pin whenever use_tls is true, because unauthenticated TLS would let an
        # on-path device serve its own boot media. The endpoint reported as
        # `host:None` was the other tell -- the port was missing too.
        - name: Re-read the session's reported byte counters
          james_crowley.intel_amt.amt_media:
            host: "{{ amt_host }}"
            port: "{{ amt_redirection_port | default(omit) }}"
            username: "{{ amt_username }}"
            password: "{{ amt_password }}"
            use_tls: "{{ amt_use_tls | default(true) }}"
            allow_insecure_transport: "{{ amt_allow_insecure_transport | default(false) }}"
            tls_fingerprint: "{{ amt_tls_fingerprint | default(omit) }}"
            session_id: "{{ amt_media_write_test.session_id }}"
            state: attached
          delegate_to: localhost
          no_log: true
          register: amt_media_write_status

        - name: Confirm the session stayed healthy and reports byte counters
          ansible.builtin.assert:
            that:
              - amt_media_write_status.session_state == 'attached'
              - amt_media_write_status.bytes_written is defined
              - amt_media_write_status.bytes_read is defined
            fail_msg: >-
              Session {{ amt_media_write_test.session_id }} did not stay healthy
              (session_state={{ amt_media_write_status.session_state | default('unset') }}).
              A session that drops or errors mid-test is a real fault, independent of whether
              anything ever wrote to it.

        - name: Checksum the image after the write window
          ansible.builtin.stat:
            path: "{{ amt_test_image_path }}"
            checksum_algorithm: sha256
          delegate_to: localhost
          register: amt_after_checksum

        # This is the deliberately weakened assertion (see the file header): bytes_written=0
        # is expected and correct with nothing on the other end of the session issuing writes,
        # so it must never be reported as this stage's failure. What DOES remain a real bug
        # signal is bytes_written>0 that the checksum disagrees with -- that is a genuine
        # discrepancy between what the session reports and what is actually on disk.
        - name: Report the write outcome plainly -- bytes_written=0 is legitimate, not a failure
          ansible.builtin.debug:
            msg: >-
              {{
                ('bytes_written=' + (amt_media_write_status.bytes_written | string) +
                 ': a write was observed landing on disk, and the on-disk checksum changed to' +
                 ' match. This is the only combination that demonstrates the writable path' +
                 ' actually works end to end.')
                if (amt_media_write_status.bytes_written | int > 0)
                else
                ('bytes_written=0: no write was observed this run. This is a LEGITIMATE' +
                 ' outcome, not a failure -- nothing at the other end of the IDE-R session' +
                 ' (no OS, no booted rescue environment) issued a SCSI write. This stage has' +
                 ' proven the device is accepted, attached, and presented writable; it has' +
                 ' NOT proven writes actually occur. Confirming a non-zero bytes_written' +
                 ' requires pairing this stage with something that boots on the target and' +
                 ' issues writes -- see the header comment in this file.')
              }}

        - name: If bytes were reported written, confirm the on-disk checksum actually changed
          ansible.builtin.assert:
            that:
              - amt_after_checksum.stat.checksum != amt_before_checksum.stat.checksum
            fail_msg: >-
              amt_media reported bytes_written={{ amt_media_write_status.bytes_written }} > 0,
              but the image's on-disk checksum did not change. That is a real discrepancy
              between what the session reports and what actually landed on disk -- do not
              trust bytes_written on this firmware until this is investigated.
          when: amt_media_write_status.bytes_written | int > 0

        - name: Ensure the evidence output directory exists
          ansible.builtin.file:
            path: "{{ amt_output_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost

        - name: Record evidence for this target
          ansible.builtin.copy:
            content: >-
              {{ {'checksum_before': amt_before_checksum.stat.checksum,
                  'checksum_after': amt_after_checksum.stat.checksum,
                  'write_status': amt_media_write_status,
                  'note': 'bytes_written=0 is a legitimate outcome; see this playbook header.'}
                 | to_nice_json }}
            dest: "{{ amt_output_dir }}/{{ inventory_hostname }}-qualify_writable_image.json"
            mode: "0600"
          delegate_to: localhost
      rescue:
        - name: Report the redacted failure detail
          ansible.builtin.debug:
            msg:
              error_class: "{{ ansible_failed_result.error_class | default('(none reported)') }}"
              endpoint: "{{ ansible_failed_result.endpoint | default('(none reported)') }}"
              operation: "{{ ansible_failed_result.operation | default('(none reported)') }}"
              indeterminate: "{{ ansible_failed_result.indeterminate | default(false) }}"
              message: "{{ ansible_failed_result.msg | default('(no message)') }}"
              diagnostic: "{{ ansible_failed_result.diagnostic | default('(none)') }}"

        - name: Fail with the error class in the summary line and the manual recovery path
          ansible.builtin.fail:
            msg: >-
              qualify_writable_image.yml failed against {{ inventory_hostname }} with
              error_class={{ ansible_failed_result.error_class | default('unknown') }}.
              See the redacted detail above. Media is detached in the always block below
              regardless of this failure. Manual recovery path:
              tests/hardware/README.md#if-a-machine-ends-up-in-a-bad-boot-state
      always:
        - name: Always detach the media session, even on failure, so no daemon is left holding the device open
          when: amt_media_write_test is defined and amt_media_write_test.session_id is defined
          block:
            # No tls_fingerprint here, deliberately. amt_media enforces its
            # trust policy on attach only: detach opens no connection at all --
            # it reads the session state file and signals the recorded pid. If
            # detach required a pin, a tightened trust configuration could make a
            # running session unstoppable and leave a daemon holding the boot
            # device open, which is the opposite of what a cleanup path should do.
            - name: Detach
              james_crowley.intel_amt.amt_media:
                host: "{{ amt_host }}"
                username: "{{ amt_username }}"
                password: "{{ amt_password }}"
                session_id: "{{ amt_media_write_test.session_id }}"
                state: detached
              delegate_to: localhost
              no_log: true
          rescue:
            - name: Warn loudly that automated detach failed -- manual recovery is required
              ansible.builtin.debug:
                msg: >-
                  Automated detach failed for {{ inventory_hostname }}. A media daemon may
                  still be holding the boot device open. Follow the manual recovery path in
                  tests/hardware/README.md#if-a-machine-ends-up-in-a-bad-boot-state before
                  running any later stage against this machine.
