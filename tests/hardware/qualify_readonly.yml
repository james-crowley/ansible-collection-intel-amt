#
# Hardware qualification stage 1-2 (see README.md): read-only amt_info on
# every target, cross-checked against a reviewed inventory binding
# (amt_expected_uuid). Never mutates anything -- this is deliberately safe to
# run against every target in one pass, unlike every later stage.
#
# This is the stage wired into .circleci/config.yml's hardware-tests job.

- name: "Hardware qualification stage 1-2: read-only amt_info and inventory cross-check"
  hosts: amt_targets
  gather_facts: false
  connection: local
  vars:
    amt_output_dir: "{{ playbook_dir }}/output"

  tasks:
    # no_log hides the whole result, including the parts that are deliberately
    # safe to show. Every message and diagnostic this collection produces has
    # already been through errors.py's redaction, so the failure detail carries
    # no credential -- but no_log cannot know that, and a censored failure is
    # undiagnosable. The rescue below re-surfaces only the redacted fields, which
    # is the difference between "something went wrong on the lab runner" and an
    # actionable error class.
    - name: Read AMT capabilities and state
      block:
        - name: Read AMT capabilities and state
          james_crowley.intel_amt.amt_info:
            host: "{{ amt_host }}"
            username: "{{ amt_username }}"
            password: "{{ amt_password }}"
            tls_fingerprint: "{{ amt_tls_fingerprint }}"
          delegate_to: localhost
          no_log: true
          register: amt
      rescue:
        - name: Report the redacted failure detail
          ansible.builtin.debug:
            msg:
              error_class: "{{ ansible_failed_result.error_class | default('(none reported)') }}"
              endpoint: "{{ ansible_failed_result.endpoint | default('(none reported)') }}"
              operation: "{{ ansible_failed_result.operation | default('(none reported)') }}"
              indeterminate: "{{ ansible_failed_result.indeterminate | default(false) }}"
              message: "{{ ansible_failed_result.msg | default('(no message)') }}"
              diagnostic: "{{ ansible_failed_result.diagnostic | default('(none)') }}"

        - name: Fail with the error class in the summary line
          ansible.builtin.fail:
            msg: >-
              amt_info failed against {{ inventory_hostname }} with
              error_class={{ ansible_failed_result.error_class | default('unknown') }}.
              See the redacted detail above.

    - name: Require the endpoint to be reachable
      ansible.builtin.assert:
        that:
          - amt.amt.reachable
        fail_msg: "amt_info reports {{ inventory_hostname }} ({{ amt_host }}) unreachable."

    - name: Cross-check the firmware-reported UUID against reviewed inventory
      ansible.builtin.assert:
        that:
          - amt_expected_uuid is not defined or amt.amt.uuid == amt_expected_uuid
        fail_msg: >-
          Identity mismatch for {{ inventory_hostname }}: firmware reports
          UUID {{ amt.amt.uuid }}, reviewed inventory expected
          {{ amt_expected_uuid | default('unset') }}. This is exactly the
          check that catches an inventory/reality mismatch before it becomes
          a reset of the wrong machine -- stop, and re-verify the binding
          between inventory_hostname, amt_host, and the physical machine
          before any later stage runs against this target.
        success_msg: >-
          {{ 'No amt_expected_uuid recorded yet for ' + inventory_hostname + '; nothing to cross-check on this first run.'
             if amt_expected_uuid is not defined
             else 'Firmware-reported UUID matches reviewed inventory for ' + inventory_hostname + '.' }}

    - name: Ensure the evidence output directory exists
      ansible.builtin.file:
        path: "{{ amt_output_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Record evidence for this target
      ansible.builtin.copy:
        content: "{{ amt.amt | to_nice_json }}\n"
        dest: "{{ amt_output_dir }}/{{ inventory_hostname }}-qualify_readonly.json"
        mode: "0600"
      delegate_to: localhost

    # ---------------------------------------------------------------------
    # Hardware/asset inventory, new in 0.5.0. A second amt_info call rather
    # than widening the first, because the first one's evidence file is the
    # baseline every earlier run is compared against and its shape should not
    # move. This one is read-only in exactly the same way -- gather_subset only
    # ever adds Get/Enumerate reads -- so it stays inside stage 1 rather than
    # earning a stage number of its own.
    #
    # This is the first time any real firmware has been asked for these fields.
    # Everything under amt.hardware is Tier 2 until this stage runs: the value
    # tables come from go-wsman-messages and the DMTF schema, which establishes
    # what a value MEANS but not that firmware returns it at all. What this
    # stage can promote is existence and shape. It cannot confirm a decoded name
    # is right -- only the machine's own label or MEBx can do that -- which is
    # why the raw integer travels alongside every decoded name.
    - name: "Stage 1b: hardware/asset inventory (read-only)"
      block:
        - name: Gather hardware inventory facts
          james_crowley.intel_amt.amt_info:
            host: "{{ amt_host }}"
            username: "{{ amt_username }}"
            password: "{{ amt_password }}"
            tls_fingerprint: "{{ amt_tls_fingerprint }}"
            gather_subset:
              - config
              - hardware
          delegate_to: localhost
          no_log: true
          register: amt_hw
      rescue:
        - name: Report the redacted failure detail for the inventory read
          ansible.builtin.debug:
            msg:
              error_class: "{{ ansible_failed_result.error_class | default('none') }}"
              endpoint: "{{ ansible_failed_result.endpoint | default('none') }}"
              operation: "{{ ansible_failed_result.operation | default('none') }}"
              message: "{{ ansible_failed_result.msg | default('none') }}"
        - name: Fail with the inventory error class named
          ansible.builtin.fail:
            msg: >-
              Hardware inventory read failed:
              error_class={{ ansible_failed_result.error_class | default('unknown') }}

    - name: Report which inventory groups the firmware actually populated
      ansible.builtin.debug:
        msg:
          gathered: "{{ amt_hw.amt.hardware.keys() | list if amt_hw.amt.hardware is mapping else 'hardware key absent' }}"
          # null here is the finding worth having: it means the class exists in
          # our reader but this firmware did not return it, which no mock can
          # tell us.
          system: "{{ 'populated' if (amt_hw.amt.hardware.system | default(none)) is not none else 'null' }}"
          processor: "{{ 'populated' if (amt_hw.amt.hardware.processor | default(none)) is not none else 'null' }}"
          memory_modules: "{{ (amt_hw.amt.hardware.memory | default([])) | length }}"
          storage_devices: "{{ (amt_hw.amt.hardware.storage | default([])) | length }}"
          wsman_requests: "{{ amt_hw.operation.wsman_requests_estimated | default('not reported') }}"

    - name: Record hardware inventory evidence for this target
      ansible.builtin.copy:
        content: "{{ amt_hw.amt | to_nice_json }}\n"
        dest: "{{ amt_output_dir }}/{{ inventory_hostname }}-qualify_hardware_inventory.json"
        mode: "0600"
      delegate_to: localhost

    - name: Remind the operator what amt_expected_uuid is for, if it is still unset
      ansible.builtin.debug:
        msg: >-
          Record amt.amt.uuid == {{ amt.amt.uuid }} as amt_expected_uuid for
          {{ inventory_hostname }} in tests/hardware/inventory.yml once you
          have visually confirmed this is the right physical machine. Every
          later run of this stage will then catch a drifted binding.
      when: amt_expected_uuid is not defined
