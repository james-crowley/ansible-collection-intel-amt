#
# Hardware qualification stage 5 (see README.md): IDE-R attach with a small
# test ISO, confirming boot hand-off. This is also the first stage to
# exercise roles/amt_baremetal_install/ against real firmware -- before this
# runs for the first time on a given machine, make sure the manual recovery
# path below is actually reachable (KVM console open, MEBx access confirmed).
#
# Wired into CircleCI as the hardware-media job, behind its own approval gate
# (see .circleci/config.yml) -- but still only ever one host at a time.
#
# Run manually, one host at a time, attended:
#
#   ansible-playbook tests/hardware/qualify_media_attach.yml \
#     -i tests/hardware/inventory.yml -l <single-host> \
#     -e amt_test_iso_path=/path/to/small-test.iso
#
# tests/hardware/make-test-media.sh produces a small genuinely-bootable ISO
# (iPXE's own ipxe.iso) if you do not already have one you trust.
#
# amt_qualify_attended (default true) gates every interactive pause in this
# file. CI sets it false: ansible.builtin.pause blocks on stdin, which the
# CircleCI machine executor cannot supply, and the hardware-media-approval job
# is CI's actual human checkpoint -- the approver is expected to already have
# the KVM console open before clicking approve, exactly as the pause below
# asks an attended operator to do by hand.

- name: "Hardware qualification stage 5: IDE-R attach with a small test ISO; confirm boot hand-off"
  hosts: amt_targets
  serial: 1
  gather_facts: false
  connection: local
  vars:
    amt_baremetal_install_confirm_destructive: true
    amt_baremetal_install_boot_provider: ider_cdrom
    amt_baremetal_install_iso_path: "{{ amt_test_iso_path }}"
    amt_baremetal_install_wait_for_handoff: false
    amt_output_dir: "{{ playbook_dir }}/output"

  pre_tasks:
    - name: Refuse to run against more than one host at a time
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: "This stage resets real hardware and must run one machine at a time. Re-run with -l <single-host>."

    - name: Require a test ISO path
      ansible.builtin.assert:
        that:
          - amt_test_iso_path is defined and amt_test_iso_path | length > 0
        fail_msg: >-
          Set amt_test_iso_path (e.g. -e amt_test_iso_path=/path/to/small-test.iso,
          or run tests/hardware/make-test-media.sh and pass its AMT_TEST_ISO_PATH)
          to a small ISO you can visually confirm booting over KVM/console.
          Never commit the ISO itself -- see the repository .gitignore.

    - name: Pause for the operator to be watching the KVM/console before attaching media
      ansible.builtin.pause:
        prompt: >-
          About to attach {{ amt_test_iso_path }} and reset
          {{ inventory_hostname }}. Have the KVM console (e.g. MeshCentral)
          open and watching before continuing. If this goes wrong, the
          manual recovery path is in this directory's README.md
      when: amt_qualify_attended | default(true) | bool

  # Wrapping the role invocation in a block/rescue -- rather than the play-level `roles:`
  # keyword this file used before -- is what lets this playbook surface a diagnosable failure
  # of its own: the role's tasks/record_failure.yml now reports the redacted error_class/
  # endpoint/operation/indeterminate detail (mirroring qualify_readonly.yml's rescue pattern),
  # but its own rescue always re-raises via a single ansible.builtin.fail so the role never
  # "swallows a failure to keep going" (see the role's tasks/main.yml). This outer rescue is
  # this playbook's own chance to point at the manual recovery path before failing the play.
  tasks:
    - name: Run the amt_baremetal_install lifecycle for this target
      block:
        - name: Attach installer media over IDE-R and boot from it
          ansible.builtin.include_role:
            name: james_crowley.intel_amt.amt_baremetal_install
      rescue:
        - name: Fail with a pointer to the manual recovery path
          ansible.builtin.fail:
            msg: >-
              qualify_media_attach.yml failed for {{ inventory_hostname }}:
              {{ ansible_failed_result.msg | default('see previous task output') }}.
              The role's own rescue already recorded resumption state and (redacted)
              diagnostic detail above. Media is detached in the role's own always block
              regardless of this failure. If the machine is left in a bad boot state, see
              tests/hardware/README.md#if-a-machine-ends-up-in-a-bad-boot-state for the
              manual KVM/MEBx recovery path.

  post_tasks:
    # This stage exercises IDE-R attach and boot hand-off -- the collection's flagship
    # capability and the only Tier 3 claim that used to rest solely on an operator's
    # visual confirmation over KVM/console, with nothing recorded. It passes in CI and
    # has passed on both lab machines (see README.md), but until this task existed there
    # was no artifact a reviewer could open afterwards to see any of that: not the
    # session that got attached, not which one-time boot device got armed, not what
    # power transition actually fired. Every value below is already-parsed module
    # output, matching every other stage's evidence file, not raw WS-Man.
    - name: Ensure the evidence output directory exists
      ansible.builtin.file:
        path: "{{ amt_output_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Record evidence for this target
      ansible.builtin.copy:
        content: >-
          {{ {'media_attach': {'session_id': amt_baremetal_install_media_attach_result.session_id,
                                'session_state': amt_baremetal_install_media_attach_result.session_state,
                                'devices': amt_baremetal_install_media_attach_result.devices,
                                'bytes_read': amt_baremetal_install_media_attach_result.bytes_read,
                                'bytes_written': amt_baremetal_install_media_attach_result.bytes_written,
                                'operation': amt_baremetal_install_media_attach_result.operation},
              'boot_armed': amt_baremetal_install_boot_result.operation.observed,
              'power_action': {'requested': amt_baremetal_install_power_action,
                                'previous_state': amt_baremetal_install_reset_result.previous_state,
                                'operation': amt_baremetal_install_reset_result.operation},
              'observed_after_reset': amt_baremetal_install_observe_result.previous_state,
              'note': "media_attach.devices/bytes_* are amt_media's own report that the ISO was
                       accepted and attached; observed_after_reset is amt_power's postcondition
                       probe. Neither one can see the screen -- boot hand-off itself is confirmed
                       visually, over KVM/console, not by this file. See this playbook's post_tasks
                       debug message and README.md."}
             | to_nice_json }}
        dest: "{{ amt_output_dir }}/{{ inventory_hostname }}-qualify_media_attach.json"
        mode: "0600"
      delegate_to: localhost

    - name: Remind the operator to visually confirm boot hand-off
      ansible.builtin.debug:
        msg: >-
          Reset issued and the postcondition probe ran. Visually confirm
          over KVM/console that {{ inventory_hostname }} actually booted
          from the attached ISO before treating this stage as passed --
          amt_power and amt_media report protocol-level success, not what
          the screen shows. In CI (amt_qualify_attended=false) this
          confirmation is the approver's responsibility, made before
          approving hardware-media -- nothing in this playbook can see the
          screen for you.
