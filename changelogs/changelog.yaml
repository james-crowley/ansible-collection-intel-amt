      - tests/integration/targets/amt_baremetal_install_role - regression-test both
        defects hardware qualification found in this role, the worst defect density
        anywhere in the collection. (1) It always issued C(reset). A master bus reset
        does nothing to a machine that is already off, so the role attached media,
        armed a one-shot boot and reported success having booted nothing; the target
        now asserts an endpoint observed B(off) is sent C(on) and one observed B(on)
        is sent C(reset), each against its own mock endpoint whose power state is
        confirmed first. (2) Its connection variables defaulted to C(inventory_hostname),
        and AMT answers on a separate management address, so the default silently
        targeted the wrong endpoint or an unresolvable name; the target now asserts
        an unset C(amt_host) fails in C(tasks/validate.yml) on the exact assertion
        C(amt_baremetal_install_host is truthy) rather than reaching a connection
        at all, and that a set one resolves from C(amt_host) while C(inventory_hostname)
        is a different, unresolvable name.
      - tests/integration/targets/amt_baremetal_install_role - runs against local
        mock WS-Man servers only, with no hardware, no network beyond C(127.0.0.1)
        and C(HOME) redirected into the target's scratch tree so no scenario can reach
        the role's real C(~/.ansible/intel_amt/) state directories, making it safe
        on every pull request. Note the target is named C(amt_baremetal_install_role)
        rather than C(amt_baremetal_install) deliberately - ansible-test resolves
        each target as a collection-qualified role, so a target sharing a name with
        a role in C(roles/) silently runs B(that role) with no assertions instead
        of the target.
      - tests/integration/targets/amt_media/tasks/main.yml - add two scenarios covering
        the IDE-R feature-toggle fault paths, closing a gap in which the fix for the
        V(attached)-without-media defect was B(unguarded at the integration tier).
        C(feature_toggle_status) had existed on the mock all along and B(nothing anywhere
        had ever passed it anything but the happy-path default), so the refusal path
        had never been exercised end to end - not by a mock, and not by firmware either,
        since no hardware qualification stage covers it. The fix was therefore guarded
        only by unit tests, while the one tier that drives the real C(ider.IderEngine)
        against a real socket had never seen a refusal. Scenario D attaches against
        an endpoint that refuses the toggle and asserts C(amt_media) B(fails) with
        RV(ignore:error_class) V(unsupported_capability) and never reports RV(session_state)
        V(attached); scenario E attaches against one that never reports the toggle
        outcome and asserts it fails with RV(ignore:error_class) V(timeout) and a
        message saying whether media is served is B(unknown). Both were confirmed
        to fail against a staged revert of the attach gate, where they report the
        pre-fix behaviour - a success receipt for media nobody is serving.
      - tests/unit/mock_servers/test_ider_server.py - drive the B(real) client (C(redirection.RedirectionSession)
        plus C(ider.IderEngine)) against the mock IDE-R server over a real socket,
        which nothing below the C(amt_media) integration target did before. The repository
        holds two independent implementations of one wire protocol - the mock plays
        firmware, C(ider.py) plays the client - and each was tested only against its
        own hand-built expectations - the long-standing C(_FakeIderClient) does not
        exercise C(ider.py) at all, and C(tests/unit/plugins/module_utils/test_ider.py)
        feeds C(IderEngine) frames it builds itself. The new tests cover the handshake,
        the accepted/refused/withheld toggle verdicts, and a C(READ_10) large enough
        to force C(DATA_TO_HOST) chunking, for the cost of a socket and no forked
        daemon. Also removes a stale claim in that file's docstring that C(plugins/module_utils/ider.py)
        "is being written in parallel and does not exist yet" - four releases out
        of date.
      release_summary: "A correctness release. No new modules; the work went into
        finding and fixing things\nthat were wrong, and into making the test suite
        capable of catching them.\n\n**Read the breaking change below if you use ``amt_media``.**
        ``attach_timeout`` is now\nan attach deadline: an attach that reaches it with
        the session daemon still alive but\nno ``attached`` verdict *fails*, where
        it previously returned success. That reverses\nbehaviour this collection had
        documented as intentional, and it was wrong \u2014 a caller\nacts on that
        receipt by arming a one-time boot and resetting the machine, into media\nthat
        was never confirmed to be redirected.\n\n**Two more modules were reporting
        success for things that had not happened.**\n``amt_media`` reported ``attached``
        for a session whose IDE-R feature toggle the\nfirmware had *refused*, because
        the flag recording that refusal was set and never\nread. And the bundled role
        skipped its ``always:`` detach on exactly the failure path\nwhere a daemon
        is still running, orphaning it and wedging the endpoint \u2014 IDE-R is\nsingle-session.\n\n**The
        test suite was audited by breaking the implementation on purpose**, 21 mutations\nwith
        the full suite run against each. The worst finding: seven tests, one per module,\nclaimed
        to prove the AMT password never reaches module output, and all seven were\nstructurally
        incapable of failing. Flipping ``no_log`` off was caught by no tier at\nall
        \u2014 not units, not ``validate-modules``, not integration. That is fixed,
        along with\nthe three mutations that survived because they exposed genuine
        bugs rather than test\ndefects.\n\n``roles/amt_baremetal_install`` has automated
        tests for the first time. It was 750\nlines with none, while carrying two
        of the six defects hardware qualification had\nfound. Four more defects surfaced
        within a day of it gaining a target.\n\nAlso: the staging script would delete
        ``$HOME`` given one mistaken export, the mock\nnow rejects the empty ``<Source/>``
        element that real firmware rejects with HTTP 400,\nand ``docs/capability-matrix.md``
        is recalibrated \u2014 including that its claim to cover\nthe media-session
        daemon lifecycle was false when written.\n\nUnit tests 902 to 1070; branch
        coverage 85% to 92%, with the two least-covered files\n\u2014 which were also
        the two highest-consequence ones \u2014 going 50% to 81% and 75% to 92%."
