  0.5.0:
    changes:
      known_issues:
      - 'amt_info - the hardware inventory subsets are Tier 2 in C(docs/capability-matrix.md):
        mock-tested and fixture-derived, and B(not) hardware-verified. No qualification
        stage reads them, so no real firmware has returned any of these fields to
        this collection.'
      minor_changes:
      - 'amt_info - C(gather_subset) uses the same vocabulary as M(ansible.builtin.setup),
        including V(all), V(min) and C(!)-negation, so C([''all'', ''!storage''])
        works as a reader of C(setup) would expect. It deliberately differs from C(setup)
        on one point: the B(default is the pre-0.5.0 fact set), not V(all). Inventory
        costs extra WS-Man round trips, and no existing caller should get slower for
        facts it never asked for. Both shape and cost stay unchanged for anyone who
        does not opt in.'
      - 'amt_info - add hardware/asset inventory under C(amt.hardware), selected with
        a new C(gather_subset) option: serial, model and manufacturer from C(CIM_Chassis)
        and C(CIM_Card), CPUs from C(CIM_Processor), per-DIMM capacity and speed from
        C(CIM_PhysicalMemory), and disks from C(CIM_MediaAccessDevice). AMT answers
        these with the machine B(powered off), which is what makes it the only source
        for a serial number on a host with no OS installed yet.'
      - amt_info - every decoded DMTF enum reports its raw integer alongside the name,
        and an unrecognised value renders as C(unknown(<raw>)) rather than a bare
        C(unknown). Value tables come from C(go-wsman-messages) and the DMTF schema
        only, never from a hardware dump -- a dump proves a value was returned, never
        what it means, which is the mistake that inverted C(wake_on_lan_capable) for
        two releases.
      - 'amt_info - the operation receipt gains C(wsman_requests_estimated), the best-case
        HTTP request count for the resolved subsets. Best-case is load-bearing: a
        faulting C(Get) costs a further C(Enumerate)/C(Pull) pair.'
      release_summary: "Adds hardware and asset inventory to ``amt_info``: serial
        number, model,\nmanufacturer, CPUs, per-DIMM memory, and disks.\n\nThe reason
        this matters more than an ordinary fact addition is *when* AMT can answer.\nIt
        runs beneath the operating system, so it will tell you a machine's serial
        number\nwhile that machine is **powered off**, or before any OS has been installed
        on it. For\na host with no agent to ask, AMT is the only source of truth \u2014
        which is exactly the\nsituation this collection is always in.\n\nSelected
        with a new ``gather_subset`` option using the vocabulary you already know\nfrom
        ``ansible.builtin.setup``, including ``all``, ``min`` and ``!``-negation,
        so\n``['all', '!storage']`` behaves as expected.\n\n**It deliberately differs
        from ``setup`` on one point: the default is the pre-0.5.0\nfact set, not ``all``.**
        Inventory costs extra WS-Man round trips, and no existing\ncaller should get
        slower for facts it never asked for. If you do not opt in, both the\nreturn
        shape and the request count are unchanged. The operation receipt also now\nreports
        ``wsman_requests_estimated`` so that cost is visible rather than implied.\n\n**These
        facts are Tier 2 and not hardware-verified.** No qualification stage reads\nthem,
        so no real firmware has returned any of these fields to this collection. The\nvalue
        tables behind them come from Intel's ``go-wsman-messages`` and the DMTF schema\nonly
        \u2014 never from a hardware dump, because a dump proves a value was *returned*
        and\nnever what it *means*. That distinction is what inverted ``wake_on_lan_capable``
        for\ntwo releases, and every decoded name here carries its raw integer alongside
        so a\nwrong label stays diagnosable.\n\nUnit tests 1078 to 1687."
    fragments:
    - amt-info-hardware-inventory.yml
    - v0.5.0-summary.yml
    release_date: '2026-07-30'
  0.6.0:
    changes:
      bugfixes:
      - tests/hardware/qualify_readonly.yml - stop reporting populated inventory groups
        as C(null). The stage-1b summary read C(amt.hardware.system) and C(amt.hardware.processor)
        -- key names C(amt_info) has never emitted, because V(system) and V(processor)
        are B(gather_subset) names while the B(fact groups) they populate are C(chassis)
        plus C(baseboard) and C(processors) plus C(chips). Jinja's C(| default(none))
        turned each undefined lookup into a printed C(null), so the first hardware
        run reported four of the six groups as unavailable on both lab machines when
        firmware had in fact returned all six fully populated. Only V(memory) and
        V(storage) happen to share a name with the group they fill, which is why those
        two looked correct and hid the pattern. The stage now B(asserts) the six-key
        set before reporting on it, so a renamed or mistyped key fails the stage loudly
        instead of being indistinguishable from an absent class.
      - 'tests/hardware/redact-evidence.py - redact serial numbers and asset tags.
        The 0.5.0 inventory facts put C(serial_number), board and DIMM serials, and
        C(asset_tag) into evidence artifacts, and the redactor had no concept of them
        -- so a hardware run would have published them. A serial is arguably the most
        identifying value AMT reports: it is what a vendor keys a warranty and a support
        case on, and unlike an address it never changes. These match no general pattern
        -- a serial is indistinguishable from a firmware version or part number --
        so they are caught by key rather than by regex. Model, manufacturer and every
        decoded enum are deliberately preserved as diagnostic.'
      known_issues:
      - amt_info - C(amt.hardware.baseboard.serial_number) is C(null) on both lab
        machines (AMT 16.1.30 and 19.0.5) even though the rest of C(CIM_Card) returns
        normally and C(amt.hardware.chassis.serial_number) populates. Nothing available
        distinguishes B(firmware omitted the element) from B(firmware returned it
        empty) -- C(optional_str) maps both to C(null) by design, and the evidence
        artifacts are already-parsed module output -- so settling it needs a raw SOAP
        body. The practical effect is that the V(system) subset cannot tell a board
        swap from a re-rack on this firmware, since that inference needs both serials.
        Tracked as https://github.com/james-crowley/ansible-collection-intel-amt/issues/84.
      minor_changes:
      - amt_info - B(withdraw the 0.5.0 C(known_issues) entry) that called the hardware
        inventory subsets Tier 2 and B(not) hardware-verified. That entry is no longer
        true and cannot be edited where it was published, so it is withdrawn here
        instead. Real firmware has now returned B(all six) fact groups -- C(chassis),
        C(baseboard), C(processors), C(chips), C(memory) and C(storage) -- on both
        lab machines, AMT 16.1.30 and 19.0.5, recorded by stage 1b of C(tests/hardware/qualify_readonly.yml)
        in CircleCI pipeline 167, job UUID C(65ddc061-b273-4777-8c51-174a48e74402).
        The subsets were in fact working when 0.5.0 shipped; what was broken was the
        qualification stage that reported on them, so the entry described a defect
        that never existed.
      - 'amt_info - be precise about what that promotion does and does not cover,
        because conflating the two is how V(wake_on_lan_capable) shipped inverted
        for two releases. The B(existence and shape) of these facts is now Tier 3
        -- observed on real firmware. The B(meaning of every decoded label) is unchanged
        and remains Tier 1 by citation to C(go-wsman-messages) and the DMTF CIM schema:
        a firmware dump proves a value was returned, never what it means. Two machines
        from one vendor''s model family is also not a compatibility guarantee, and
        C(docs/capability-matrix.md) keeps its untested-generation caveat.'
      - 'amt_info - the operation receipt gains C(hardware_reads), recording per WS-Man
        class what actually happened when each inventory class was read: which C(amt.hardware)
        key the result was filed under, whether the class was C(read), answered C(empty)
        with zero instances, or is C(absent), which verb answered, how many instances
        came back, and the C(error_class) of any refusal. B(Diagnostics alongside
        the facts, never instead of them) -- a class that cannot be read still yields
        C(null) for its group, so graceful degradation is unchanged. The reason this
        is worth a receipt field is that C(null) alone cannot distinguish B(this firmware
        has no such class) from B(we asked for it wrongly) from B(it answered and
        the reader did not recognise the shape), and the first hardware run needed
        exactly that distinction. C(verb) also reveals when the C(CIM_Chassis)/C(CIM_Card)
        C(Enumerate) fallback ran, which is the only way to see that a C(system) read
        cost six requests rather than the estimated two.'
      - 'tests/hardware/qualify_readonly.yml - add a read-only stage 1b that gathers
        the 0.5.0 hardware inventory subsets against real firmware and records its
        own evidence file. Until this runs, everything under C(amt.hardware) is Tier
        2: the value tables establish what a value MEANS, never that firmware returns
        it at all. The stage reports which groups came back populated versus C(null),
        which is the finding no mock can produce.'
      release_summary: "Makes a ``null`` inventory fact diagnosable, and withdraws
        a 0.5.0 ``known_issues``\nentry that described a defect which never existed.\n\nThe
        0.5.0 hardware inventory was reported as unavailable on both lab machines.
        It was\nnot. Firmware had returned all six fact groups, fully populated, on
        AMT 16.1.30 and\n19.0.5. What was broken was the qualification stage reporting
        on them: it read\n``amt.hardware.system`` and ``amt.hardware.processor``,
        key names ``amt_info`` has\nnever emitted, because ``system`` and ``processor``
        are *gather_subset* names while the\n*fact groups* they fill are ``chassis``
        plus ``baseboard`` and ``processors`` plus\n``chips``. ``| default(none)``
        turned each undefined lookup into a printed ``null``.\nOnly ``memory`` and
        ``storage`` happen to share a name with the group they fill, which\nis why
        exactly those two looked correct and hid the pattern.\n\nSo the inventory
        facts are Tier 3 rather than Tier 2 \u2014 better than 0.5.0 claimed, and\nthe
        opposite of what its ``known_issues`` entry said. Their *existence and shape*
        are\nnow observed on real firmware; the *meaning of every decoded label* is
        unchanged and\nstill rests on citation to ``go-wsman-messages`` and the DMTF
        schema, never on a\nfirmware dump.\n\nThe substantive addition is ``operation.hardware_reads``,
        which records per WS-Man class\nwhether it was ``read``, answered ``empty``,
        or is ``absent``, along with the verb used,\nthe instance count and the ``error_class``
        of any refusal. ``null`` alone could not\ndistinguish \"this firmware has
        no such class\" from \"we asked wrongly\" from \"it answered\nand the reader
        did not recognise the shape\" \u2014 and that ambiguity is precisely what
        made\nthe misreport above survive review. Diagnostics travel alongside the
        facts, never\ninstead of them: a class that cannot be read still degrades
        its group to ``null``.\n\nOne genuine limitation did come out of reading real
        evidence:\n``amt.hardware.baseboard.serial_number`` is ``null`` on both machines
        while\n``chassis.serial_number`` populates. Whether firmware omits the element
        or returns it\nempty is unresolved and needs a raw SOAP body to settle.\n"
