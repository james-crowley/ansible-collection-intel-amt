        C(amt_media_port) inventory variable like the role''s other connection options.
        C(tasks/attach_media.yml) forwarded every connection option to M(james_crowley.intel_amt.amt_media)
        except C(port), and the role had no media-port variable at all, so an IDE-R
        session could only ever reach the stock redirection ports (V(16995) with TLS,
        V(16994) without) -- an operator whose endpoints redirect elsewhere could
        not use the role. Note this is deliberately a separate variable from C(amt_baremetal_install_port),
        which addresses the WS-Man plane (V(16993)/V(16992)): reusing that one would
        silently aim redirection traffic at the management port.'
      - docs/amt_media.md - replace the Limitations entry describing C(attach_timeout)
        as 'an early-confirmation bound, not an attach deadline', which the change
        above supersedes. It now states the new failure mode, why the reversal is
        deliberate, that the re-probe is a repeated C(state=attached) call for the
        same C(session_id) rather than a blind retry (IDE-R is single-session), and
        why the module does not tear the session down for you -- the session log is
        removed alongside the state file, so an automatic teardown would delete the
        record of how far the attach got.
      - 'docs/capability-matrix.md - record what mutation testing found, including
        that the credential invariant was asserted by seven tests that could not fail
        and that flipping no_log off was caught by no tier. Also records the two structural
        limits it exposed: the LinkPolicy inversion was invisible to both the mock
        and hardware tiers, and an integration target sharing a name with a role silently
        runs the role instead of itself.'
      - tests/integration/mock_servers/ider_server.py / tests/integration/mock_servers/run_ider_mock.py
        - let a test ask the mock IDE-R endpoint to B(refuse) the IDE-R feature toggle,
        or to never answer it at all. C(IderMockServer)'s C(feature_toggle_status)
        now accepts C(0) (report failure for C(STATUS_DATA) type C(3) / C(REGS_TOGGLE))
        and C(None) (consume the client's C(0x48) C(DISABLE_ENABLE_FEATURES) and send
        no verdict back), alongside the existing C(1). Two new C(run_ider_mock.py)
        start-up flags, C(--refuse-feature-toggle) and C(--withhold-feature-toggle),
        reach them from a playbook. Start-up flags rather than a control channel,
        per C(run_wsman_mock.py)'s existing convention - these describe what an endpoint
        B(is), so they hold for its whole lifetime and a failure stays attributable
        to one endpoint's configuration. The two faults are deliberately distinct
        rather than one knob - a refusal is definite, so no media is being served,
        while a withheld verdict leaves that genuinely unknown and can only be ended
        by a bounded wait, and the two carry different RV(ignore:error_class) values
        for that reason.
      - tests/integration/targets/amt_baremetal_install_role - add the first automated
        test of any kind for the C(amt_baremetal_install) role, closing this collection's
        largest untested surface. The role is 14 task files driving the destructive
