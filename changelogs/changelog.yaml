  0.2.0:
    changes:
      bugfixes:
      - amt_power - a new test asserts that every C(state) choice except V(query)
        has an entry in both the action map and the expected-state map, and that the
        module's copy of the expected-state map agrees with the client's. The first
        guards the defect being fixed here -- three actions implemented but not reachable
        -- and the second guards check mode previewing a different outcome than a
        real run would produce.
      minor_changes:
      - amt_info - derive C(amt.network.wake_on_lan_capable) from whether C(LinkPolicy)
        contains V(16) (network link always on), and report C(link_policy_names) decoded
        alongside the raw list. An endpoint without V(16) does not answer WS-Man while
        powered off, so C(amt_power) with C(state=on) fails there looking exactly
        like a network fault; surfacing it read-only turns that into a diagnosis.
        V(null), not V(false), when C(LinkPolicy) is absent.
      - amt_info - normalize C(amt.network.mac_address) to colon-separated lowercase
        and keep the firmware's own formatting in C(amt.network.mac_address_raw).
        Real AMT 10 firmware returns the MAC dash-separated while the research notes'
        own sample claims colons, and the MAC is both a second identity anchor alongside
        the platform GUID and the key a PXE reservation is made against -- comparisons
        a stray separator silently breaks.
      - 'amt_info - report C(AMT_EthernetPortSettings) instance 0 under a new C(amt.network)
        key: MAC address, IPv4 address/mask/gateway/DNS, C(dhcp_enabled), C(link_is_up),
        C(ip_sync_enabled) and the raw C(LinkPolicy) list. Read with C(Get) and an
        exact C(InstanceID) selector, never C(Enumerate). Instance 0 only; a firmware
        with no such instance reports V(null) rather than failing.'
      - 'amt_info - report C(CIM_ComputerSystem) state under a new C(amt.system_state)
        key: C(ElementName), C(EnabledState) and C(OperationalStatus) decoded against
        the full DMTF tables, and C(RequestedState) raw. C(OperationalStatus) is always
        a list because CIM types it as an array. This reintroduces a WS-Man round
        trip that 0.1.0 removed; the class now sources three useful state fields rather
        than a C(UUID) property it does not have. C(amt.uuid) still comes from C(CIM_ComputerSystemPackage.PlatformGUID).'
      - amt_info - report the host BIOS version from C(CIM_BIOSElement.Version) as
        C(amt.bios_version), falling back to C(Enumerate) when the bare C(Get) faults.
        This is the least well-evidenced fact the module returns and is expected to
        be V(null) on some firmware; see C(docs/capability-matrix.md).
      - 'amt_info - report the rest of the C(AMT_GeneralSettings) instance already
        being read for the hostname: C(domain_name), C(idle_wake_timeout), C(ping_response_enabled),
        C(rmcp_ping_response_enabled), C(network_interface_enabled) and C(ddns_update_enabled).
        Zero extra WS-Man round trips. C(PowerSource) and C(PrivacyLevel) are deliberately
        not surfaced: nothing documents what their integers mean.'
      - 'amt_info - the module documentation now states the WS-Man round-trip cost
        explicitly: ten HTTP requests, of which three C(Get)s are new. All new facts
        are additive -- every pre-existing C(amt) key keeps its name, position and
        shape, which a new test asserts.'
      - amt_power - expose the V(sleep-light), V(sleep-deep) and V(hibernate) power
        actions, which were fully implemented in C(module_utils/client.py) -- correct
        CIM C(RequestPowerStateChange) codes 3, 4 and 7, and correct expected-state
        mappings -- but omitted from the module's C(state) choices, so they were unreachable
        dead code. V(hibernate) is convergent; the two sleep depths deliberately are
        not, because CIM 3 (S1) and CIM 4 (S3) both normalize to the single state
        C(sleep), so treating them as convergent would report C(changed=false) for
        a transition that was never issued. All three are unverified against real
        firmware and additionally depend on target-OS ACPI support, which the documentation
        now states.
      - docs/protocol-notes.md - new section 2.7 recording the network and system-state
        classes, their selectors and their property tables, plus the hardware-verified
        finding that C(Enumerate) returns HTTP 400 on AMT 10 for C(AMT_EthernetPortSettings),
        C(AMT_GeneralSettings), C(AMT_BootCapabilities), C(AMT_BootSettingData) and
        C(AMT_TLSSettingData) while C(Get) with an exact selector works. This cuts
        against the enumerate-first habit elsewhere in the client, so the existing
        hardware-verified C(Enumerate) call sites are left alone rather than swapped
        for an unverified verb. Derived from parmstro/intel_amt's hardware research
        notes, with attribution recorded per file in C(NOTICE); protocol facts were
        taken, no code was.
      - 'tests - the mock WS-Man server answers the three new reads the way real firmware
        does: it requires the exact C(Get) selector for C(AMT_EthernetPortSettings)
        and faults without it, serves the MAC dash-separated, renders C(LinkPolicy)
        and C(OperationalStatus) as repeated elements, and can be started with C(--no-ethernet-port)
        or C(--bios-get-faults) so the integration target exercises graceful degradation
        and the C(Enumerate) fallback over a real socket rather than only where a
        unit test mocks the transport away.'
      release_summary: 'Additive release. Nothing in 0.1.0''s return shapes changed,
        so this is a drop-in

        upgrade.


        ``amt_info`` gains network, system-state and BIOS facts, most usefully the

        endpoint''s MAC address -- a second identity anchor alongside the platform
        GUID,

        and the key a PXE reservation is made against -- and ``wake_on_lan_capable``,

        which explains a failure mode that previously looked like a network fault:
        an

        endpoint whose ``LinkPolicy`` omits "network link always on" does not answer

        WS-Man while powered off, so ``amt_power`` with ``state=on`` cannot reach
        it.


        ``amt_power`` gains ``sleep-light``, ``sleep-deep`` and ``hibernate``. These
        were

        already implemented with the correct CIM codes but were unreachable, because
        the

        module''s ``state`` choices omitted them.


        These additions came out of an audit of ``parmstro/intel_amt`` (GPL-3.0-or-later,

        reuse authorised and attributed in ``NOTICE``). What was taken is protocol
        facts

        from that project''s hardware research notes -- property names and values
        dumped

        from a real AMT 10.0.56 machine -- and not code. They are therefore recorded
        as

        Tier 2 in ``docs/capability-matrix.md``: mock-tested here, resting on someone

        else''s hardware, and **unverified on AMT 16.1.30 or 19.0.5**, the two generations

        every hardware-qualified fact in 0.1.0 rests on. The same applies to the three
        new

        power actions, which additionally depend on target-OS ACPI support.


        Deliberately not adopted from that audit: its network-settings, TLS-config
        and

        user modules. ``docs/capability-matrix.md`` records why, and the short version
        is

        that each is either a non-functional stub or capable of stranding the management

        path in a way only a physical MEBx visit recovers.'
    fragments:
    - amt-info-network-and-state-facts.yml
    - expose-sleep-hibernate-power-actions.yml
    - v0.2.0-summary.yml
    release_date: '2026-07-29'
  0.3.0:
    changes:
      bugfixes:
      - CI - add C(scripts/check-circleci-tags.sh), run first in the lint job, failing
        on any double-angle-bracket sequence in C(.circleci/config.yml) that is not
        a parameter tag -- including inside comments, where it is equally fatal. This
        is the regression guard for the above, since the tool that ought to catch
        it does not.
      - 'CI - hardware evidence is now published when a stage FAILS. None of the five
        C(store_artifacts) steps carried C(when: always), and CircleCI skips steps
        after a failed one, so failure evidence was never actually stored -- while
        C(note-recovery-path-on-failure) told the operator it had been. A failed stage
        is exactly when the evidence matters. Safe to publish now that C(redact-hardware-evidence)
        also runs C(when: always) ahead of it.'
      - CI - the C(export-hardware-limit) step said "Destructive stages restricted
        to", but C(hardware-limit) restricts every stage including the read-only ones.
        Corrected, so the log does not understate the flag's reach.
      - CI - the hardware workflow could not launch at all. A bash here-string in
        the lab virtualenv command was parsed by CircleCI as the opening of a parameter
        tag, producing an "Unclosed tag" config error that fails the whole workflow
        rather than the step. It merged undetected because C(circleci config validate)
        reports the config valid, and the hardware workflow is only reachable via
        a pipeline parameter, so nothing exercised it until a run was triggered.
      - CONTRIBUTING / docs/testing.md - state that the C(integration-mock) CI job
        pins ansible-core 2.19, and that the integration suite must be run against
        2.19 rather than the 2.17 the setup step installs. On 2.19 the controller
        adds an C(exception) key to every failed task result while on 2.17 it appears
        only at C(-vvv), so a target asserting on that key passes locally and fails
        in CI. Nothing in the repository stated which core the job used, which is
        exactly how one such target reached review.
      - README - the C(amt_power) row omitted V(sleep-light), V(sleep-deep) and V(hibernate),
        which have been selectable since they were exposed in 0.2.0.
      - README - the CircleCI badge is static again. A live badge needs the Free and
        Open Source project flag, which makes artifacts world-readable; artifacts
        from runs predating C(redact-evidence.py) are still unredacted and cannot
        be deleted. The comment records that the blocker is retention, not code, so
        the badge is not flipped back prematurely.
      - docs/maintainer-setup.md - record that machine 1 was re-run and the v0.2.0
        facts are confirmed on both firmware generations. It still listed that re-run
        as a remaining action and stated the facts had only ever been read on one
        generation, both of which contradicted the capability matrix.
      - 'tests/hardware/qualify_checkmode.yml - write the stage-3 evidence file. The
        playbook runs under C(--check) by design (it asserts C(ansible_check_mode)),
        which also made its own C(copy) task a no-op, so stage 3 was the one stage
        that left no reviewable record of the plans it computed. C(check_mode: false)
        on that task fixes it; the endpoint is still never touched, because every
        AMT task in the playbook carries check mode of its own.'
      known_issues:
      - 'hardware - C(tests/hardware/qualify_checkmode.yml) writes no evidence file.
        Its C(ansible.builtin.copy) evidence task carries no C(check_mode: false)
        and stage 3 runs under C(--check), so the C(-qualify_checkmode.json) file
        is never created and never appears in the C(hardware-evidence) artifact. Observed
        on the 2026-07-29 re-run, where a three-stage run produced two evidence files.
        Nothing leaks as a result -- a file that does not exist cannot be published
        -- but stage 3 leaves no reviewable record of the plans it computed.'
      minor_changes:
      - 'CI - add a C(hardware-limit) pipeline parameter that restricts the destructive
        hardware stages to a subset of the rendered inventory as an Ansible C(--limit)
        pattern. The stage playbooks target C(hosts: amt_targets), so without it a
        run authorised for one machine power-cycles every machine in the lab. Empty
        keeps the previous behaviour. The flag is derived once by a shared C(export-hardware-limit)
        command rather than per job, so a stage cannot silently omit it and widen
        the blast radius.'
      - README - restore the live CircleCI status badge. It reports status again now
        that the project's Free and Open Source flag is back on. The lab platform
        GUIDs that made public logs a concern are held as C(amt-lab-runner) context
        values, and CircleCI masks context values in log output, so they are censored
        rather than hidden by making builds private.
      - 'amt_event_log - new module: read the Intel AMT event log via C(AMT_MessageLog)
        -- C(PositionToFirstRecord) then C(GetRecords), following the iteration to
        completion rather than fetching one batch. This is the only place that records
        B(why) an unattended bare-metal install failed when the failure happened outside
        the host OS -- boot failures, agent-watchdog expiry, power events the OS never
        saw. Read-only, C(changed) always C(false), full check-mode support. Records
        are returned B(both) decoded and as raw bytes (C(raw_base64), C(raw_hex))
        including records that failed to decode, because the record layout is decoded
        from third-party sources rather than from firmware this collection has read
        -- the raw bytes are what make a wrong decode diagnosable. A C(max_records)
        bound (default 390, one whole log on the generation the protocol fixtures
        came from) stops a large log hanging a play, and truncation is reported explicitly
        via C(truncated)/C(stop_reason) against C(total_records) from C(CurrentNumberOfRecords),
        never returned as a silent prefix.'
      - 'amt_log_clear - new module: clear the Intel AMT event log via C(AMT_MessageLog.ClearLog).
        Irreversible, and the risk is destroyed forensic evidence rather than lost
        access -- clearing cannot strand the management path. Requires an explicit
        C(confirm_destructive=true), mirroring C(amt_baremetal_install_confirm_destructive);
        an unconfirmed invocation does not touch the endpoint at all, not even to
        authenticate, and the refusal applies in check mode too. Check mode really
        reads C(CurrentNumberOfRecords) and reports what would be destroyed. C(CurrentNumberOfRecords)
        is recorded before B(and) after in the operation receipt, the after value
        observed from a fresh read rather than assumed from C(ReturnValue == 0). A
        non-zero C(ReturnValue) raises C(error_class=remote_operation) and is never
        demoted to a warning: an operator told "cleared" about a log that was not
        cleared will either hunt for evidence that is gone or stop hunting for evidence
        that is still there. Clearing an already-empty log is a no-op reporting C(changed=false).'
      - "docs - add C(docs/protocol-notes.md) \xA72.8 recording the C(AMT_MessageLog)
