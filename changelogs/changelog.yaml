        check mode mutating nothing for both modules, the confirmation gate refusing,
        a non-zero C(ReturnValue) raising C(remote_operation), and graceful degradation
        to C(unsupported_capability) when C(AMT_MessageLog) is absent. The decode
        is asserted against the two B(real firmware records) in the upstream C(getrecords.xml)
        fixture, using the exact decoded values C(go-wsman-messages)' own tests assert
        for those bytes -- so a drift stops agreeing with published output for real
        firmware data rather than merely failing an internal expectation.
      - 'tests - extend the mock WS-Man server with C(AMT_MessageLog): C(Get), C(Enumerate)/C(Pull),
        C(PositionToFirstRecord), C(GetRecords) and C(ClearLog), shaped to match the
        captured firmware response fixtures rather than this collection''s expectations
        -- including emitting C(IterationIdentifier)/C(NoMoreRecords)/C(RecordArray)
        B(before) C(ReturnValue) as firmware orders them, serving both C(Get) and
        C(Enumerate) because the real fixture set contains responses for both, and
        using the two methods'' B(different) empty-log return values (2 and 3) so
        a client that conflated them fails in CI rather than on hardware. C(GetRecords)
        batches at 2 records regardless of C(MaxReadRecords), so following the iteration
        is exercised over a real socket.'
      - 'tests/hardware/render-inventory.sh - emit C(amt_expected_uuid) from C(AMT_EXPECTED_UUID{,_N})
        when set, activating the stage-2 identity cross-check that had been a no-op
        because nothing ever supplied a value. Still optional: absent the variable
        the playbook prints the observed UUID and proceeds, exactly as before. Recorded
        from an observed value this detects drift -- a reused DHCP lease, a swapped
        inventory suffix -- rather than independently confirming machine identity,
        which needs the booted OS''s own C(dmidecode -s system-uuid) that CI cannot
        reach.'
      release_summary: "Additive release. No return shape from 0.2.0 changed, so this
        is a drop-in upgrade.\n\n**Two new modules.** ``amt_event_log`` reads the
        firmware event log, which is the\nonly place that records *why* an unattended
        install failed \u2014 boot failures,\nwatchdog expiry, power events the operating
        system never saw. ``amt_log_clear``\nclears it, so a log read after an install
        contains only that install. Clearing is\nirreversible and therefore requires
        explicit confirmation.\n\nThe 21-byte record layout is decoded rather than
        guessed: two independent\nimplementations agree byte-for-byte, a captured
        firmware record with its\nIntel-authored expected decode confirms it, and
        the timestamp byte order was\nchecked arithmetically. Five byte fields are
        deliberately left undecoded because\nno table exists for them, and raw bytes
        ship on every record so a wrong decode on\nan unseen firmware generation stays
        diagnosable. ``docs/protocol-notes.md`` \xA72.8\nrecords per fact which source
        established it and what remains inferred.\n\n**Neither new module has been
        exercised against real firmware.** No hardware stage\ncovers them.\n\n**What
        did move to hardware-verified:** both lab machines have now completed all\neight
        qualification stages, across AMT **16.1.30** and **19.0.5**, so power\ncontrol,
        IDE-R media, the writable-image path and native one-time PXE are no longer\na
        single-machine result. Every ``amt_info`` fact added in 0.2.0 also came back\npopulated
        on both generations, which retires the caveat that they rested only on a\nthird
        party's AMT 10.0.56 dump.\n\n**A data-exposure fix worth reading if you run
        the hardware suite.** Evidence\nartifacts carried the endpoint address, gateway,
        MAC, DNS servers, management\ndomain, platform GUID and username in the clear.
        CircleCI masks context values in\nlog output but *not* in stored artifacts,
        so holding those values as secrets did\nnot protect them. ``tests/hardware/redact-evidence.py``
        now redacts them before\npublication, using stable pseudonyms so records stay
        correlatable, while preserving\nthe diagnostic substance. It is verified against
        real evidence, not only unit tests.\n\nAlso fixed: the hardware workflow could
        not launch at all \u2014 a bash here-string was\nparsed as an unclosed CircleCI
        parameter tag, which ``circleci config validate``\ndoes not catch, and because
        that workflow is only reachable via a pipeline\nparameter the break survived
        two releases. A guard script now fails the lint job on\nany stray double angle
        bracket."
      security_fixes:
      - CI - GHSA-w8p5-mx5w-cpqj [HIGH] is now cleared for the self-hosted lab runner
        in practice, not only in configuration. The 2026-07-29 qualification run is
        the first to reach hardware on Python 3.12.13 with ansible-core 2.18.18, the
        first release carrying the fix; the 2.17 line it previously used is EOL and
        permanently affected. Every hardware trigger since v0.1.0 had errored before
        starting, so the pin declared in 0.2.0 had never actually been exercised.
      - 'CI - add C(tests/hardware/redact-evidence.py), run by a shared C(redact-hardware-evidence)
        command immediately before every C(store_artifacts) of C(tests/hardware/output)
        with C(when: always). It rewrites each JSON file in place, replacing addresses,
        MACs, UUIDs, fingerprints, digests, FQDNs and the AMT hostname with stable
        per-run pseudonyms while preserving firmware and BIOS versions, capability
        flags, states, byte counters and the JSON structure. Applied once at the CI
        layer rather than in each of the six playbooks that write evidence, so a playbook
        added later cannot leak by default.'
      - 'CI - redact identifying lab data from hardware qualification evidence before
        CircleCI publishes it. The five hardware jobs stored C(tests/hardware/output)
        as the C(hardware-evidence) artifact unmodified, so the JSON the stage playbooks
        write exposed the target''s IPv4 address, default gateway, subnet mask, DNS
        servers, MAC address, platform GUID and management domain name. Holding those
        values as CircleCI context secrets did not prevent this: B(context masking
        applies to log output only and does not extend to C(store_artifacts) content),
        and artifact visibility follows the project''s Free and Open Source flag,
        which made the evidence world-readable.'
