        the 21-byte little-endian record struct, and the severity/entity/firmware/watchdog
        value tables. Sources are C(device-management-toolkit/go-wsman-messages) (including
        its captured B(real firmware response fixtures) under C(pkg/wsman/wsmantesting/responses/amt/messagelog/))
