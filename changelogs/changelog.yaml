      - plugins/module_utils/ider.py - fix an unbounded spin in the IDE-R read pump
        when a backing image is truncated underneath a live session. C(_scsi_read)
        bounds-checks against C(MediaImage.blocks), which is computed B(once, at open)
        - and C(amt_media)'s detached daemon holds an image for as long as a redirected
        OS install takes, up to an hour. If the file shrinks in that window, C(read())
        returns C(b"") while the transfer still has bytes outstanding, C(remaining)
        never decreases, and C(_pump_read) emits empty C(DATA_TO_HOST) frames forever
        - the process grows until it is OOM killed rather than failing. A short read
        now ends the transfer with C(MEDIUM ERROR / UNRECOVERED READ ERROR) (sense
        C(0x03), asc C(0x11)) in the sense-bearing form, so the host learns why, and
        is B(never) reported as a completed transfer - a BIOS that believes a short
        read succeeded executes whatever was already in its buffer. Reads queued behind
        the failed one are still answered, so the session is not left wedged on an
        unanswered CDB.
      - plugins/module_utils/media_session.py - remove a race in which C(spawn_session)
        B(overwrote the forked daemon's own failure report). C(spawn_session) returns
        only after the daemon has reported its pid back over a pipe, by which point
        the daemon may already have recorded C(connecting) - or its final C(error),
        with the real classification. Writing the C(starting) record unconditionally
        at that point clobbered it, and the daemon never wrote again because it had
        already exited; the caller then polled C(starting) until C(attach_timeout)
        expired and reported a generic failure, having destroyed the specific one.
        Which writer won was pure scheduling luck, so this presented as an intermittent
        B(wrong) RV(ignore:error_class) under CPU contention - a wrong password reported
        as V(protocol) instead of V(authentication) - and not as a reproducible bug.
        The parent's record is now create-only (C(O_CREAT | O_EXCL)), so it serves
        its actual purpose (a daemon that dies before writing anything still leaves
        a pid a later C(state - detached) can find) without being able to overwrite
        anything; the daemon claims the state file before it opens any media; and
        both writers now build the record from one function, C(_initial_state()),
        because they had already drifted - the parent's copy omitted C(error_class),
        which is exactly the key C(amt_media._error_class_of) reads to decide the
        reported failure class. B(The timeout was not lengthened.)
      - plugins/module_utils/models.py / docs/protocol-notes.md - fix an incoherent
        comment on the CIM power-state table and record why the names are what they
        are. Value C(9) was glossed as "Power Cycle (off-hard) -- ends powered off",
        which is self-contradictory. The names follow the DMTF CIM ValueMap for C(CIM_AssociatedPowerManagementService.PowerState),
        which MeshCmd's own C(DMTFPowerStates) array reproduces identically; go-wsman-messages'
        C(pkg/wsman/cim/power/decoder.go) transposes the soft/hard qualifier within
        each pair, but it lists C(RequestPowerStateChange) B(action) codes rather
        than the observed-state ValueMap and carries its own "needs to be scrubbed"
        TODO, so it is explicitly flagged as a decoy rather than followed. Also recorded
        -- C(5) and C(9) are both power cycles yet normalize to C(on) and C(off) respectively,
        an inherited asymmetry left untouched because changing it is a behaviour change
        and nothing has measured it. B(No mapping was changed) - comments and documentation
        only.
      - 'plugins/modules/amt_media.py - an unconfirmed attach now B(fails), classified
        deliberately rather than generically. With the daemon still running and no
        verdict yet (V(starting)/V(connecting), or no readable state record), the
        failure is RV(ignore:error_class) V(timeout) with RV(ignore:indeterminate)
        V(true) - following the rule #69 established one level down in C(media_session._run_daemon),
        V(unsupported_capability) for a B(definite) refusal and V(timeout) for B(no
        verdict). C(indeterminate) carries its established meaning here (see C(plugins/module_utils/errors.py))
        and is the operationally load-bearing part - B(re-probe, do not retry). A
        repeated C(state - attached) call for the same C(session_id) is the re-probe,
        taking C(_attach)''s existing idempotency branch; a blind retry is the one
        thing a caller must not do, because IDE-R is single-session and a second attach
        would collide with a daemon that may still hold the one connection firmware
        has to give. A live daemon whose last report is a B(terminal) state (V(detached)
        - the session ended without ever attaching, typically because the peer closed
        the connection, and it is merely still winding down) is a B(settled) failure
        and is deliberately B(not) marked indeterminate, since there is no attach
        still in flight to re-probe.'
      - plugins/modules/amt_media.py - corrected this module's own C(attach_timeout)
        documentation, which promised the opposite of the behaviour that is now correct.
        It said a slow-but-eventually-successful attach exceeding the timeout "is
        not a failure", which is exactly the fall-through described above written
        down as if intended. It now documents the V(timeout) / C(indeterminate) failure
        and names the re-probe. B(Note for a follow-up outside this change:) C(docs/amt_media.md)'s
        Limitations section carries the same superseded claim ("C(attach_timeout)
        is an early-confirmation bound, not an attach deadline"), and C(roles/amt_baremetal_install)
        never records the generated session id until B(after) a successful attach,
        so its C(always:) detach is gated on C(session_id is truthy) and is B(skipped)
        on this failure - leaving the very daemon this change reports as still running
        unreaped. Neither file was touched here.
      - 'plugins/modules/amt_media.py - stop returning a B(success receipt) for an
        attach that never confirmed. C(_attach) waits C(attach_timeout) seconds for
        the background session daemon to report V(attached), and decided failure purely
        by whether that daemon was still B(alive) -- the fix for issue #44, which
        is correct for the case it addressed (bad credentials kill the daemon during
        the digest handshake, and a dead daemon that never reported V(attached) must
        not fall through to success). But the liveness check only fires when the recorded
        pid is B(dead). A daemon still B(alive) when C(attach_timeout) expired without
        ever reporting V(attached) skipped both that branch and the C(session_state=error)
        branch above it, and fell through to C(OperationReceipt(changed=True, ...))
        -- so the caller received C(changed - true), a C(session_id), RV(ignore:error_class)
        V(null), and RV(session_state) V(connecting) as an ordinary C(ok)/C(changed)
        task result. Nothing had established that media was being served. This is
        the ordinary case rather than an exotic one, because C(attach_timeout) and
        C(connect_timeout) both default to B(10 seconds), so a redirection connect
        that is merely slow reaches this gate with the daemon perfectly healthy.'
      - plugins/modules/amt_media.py - the failure still carries RV(session_id) and
        RV(pid), and the session is deliberately B(not) auto-detached. Both are load-bearing.
        A failure that stranded a session the caller could not name would be worse
        than the receipt it replaces, because the daemon still holds the single IDE-R
        session and every later attach against that endpoint would collide with it.
        Tearing it down was considered and rejected on three grounds - it contradicts
        the C(indeterminate) contract, which promises the caller something left to
        re-probe; C(media_session.remove_state) deletes the session B(log) alongside
        the state file, so the teardown would destroy the only record of how far the
        attach got, with the diagnosis deleted by the code reporting the problem;
        and the ordinary route to this gate is an attach that is slow and about to
        succeed, which a teardown at C(t=attach_timeout) would convert into a guaranteed
        failure. Cleanup stays with the caller, which can sequence it against everything
        else it knows - C(roles/amt_baremetal_install) already detaches from an C(always:)
        block. B(No timeout was lengthened) and no success path changed.
      - 'plugins/modules/amt_media.py - what a caller B(does) with that receipt is
        why it mattered. It is acted on, not inspected - in C(roles/amt_baremetal_install/tasks/main.yml),
        C(attach_media) is followed immediately by C(arm_boot) and then C(reset),
        so the receipt armed a one-time IDE-R boot and master-bus-reset a machine
        into media that was never confirmed to be redirected. That is the same family
        as the defect fixed in #69, where the daemon reported V(attached) for a session
        whose IDE-R feature toggle firmware had B(refused): in both cases the module
        asserted a fact it had not established, and the cost is a machine rather than
        a retry.'
      - plugins/modules/amt_media.py / plugins/module_utils/media_session.py - stop
        reporting RV(session_state) V(attached) for a session that is B(not serving
        the media). An IDE-R attach is two facts arriving in two frames - the endpoint
        opens the session (C(OPEN_SESSION_REPLY)), and then it says whether it will
        actually engage IDE-R (C(STATUS_DATA) type C(3) / C(REGS_TOGGLE), see C(docs/protocol-notes.md)
        section 4.2). The daemon gated V(attached) on the first fact alone, so an
        endpoint that opened the session and then B(refused the feature toggle) was
        reported as a successful attach. C(ider.IderEngine) had recorded the refusal
        in C(feature_toggle_ok) all along and B(no consumer ever read it). This is
        the worst result this module can produce, because of what a caller does next
        with it - C(amt_boot) arms the boot device and C(amt_power) resets the machine,
        into media that is not being redirected. The toggle verdict is now required
        before V(attached), a refusal fails with RV(ignore:error_class) V(unsupported_capability),
        and a verdict that never arrives at all fails with RV(ignore:error_class)
        V(timeout) after a bounded 5-second wait rather than reporting success or
        waiting forever. A refusal arriving B(after) a legitimate attach (C(REGS_AVAIL)
        makes the engine re-send the toggle mid-session) now fails the session too,
        instead of leaving a stale V(attached).
      - scripts/setup-collection-tree.sh - refuse to C(rm -rf) a build root this script
