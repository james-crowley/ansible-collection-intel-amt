      - tests/integration/mock_servers/wsman_server.py - add an B(opt-in) AMT 10-era
        fault mode (C(--amt10-no-enumerate)) in which C(Enumerate) answers HTTP 400
        on classes whose name begins C(AMT) while C(Get) with an exact selector still
        works, as C(docs/protocol-notes.md) s2.7 records hardware-verified on AMT
        10.0.56. Deliberately B(not) unconditional - the same section records this
        collection's C(Enumerate) call sites as working on AMT 16.1.30 and 19.0.5,
        so a mock that always refused the verb would assert something false about
        modern firmware. C(AMT_MessageLog) is exempt because its C(Enumerate) is directly
        evidenced by upstream fixtures. The C(amt_boot) integration target now uses
        this mode to pin, as an executable characterization test, that C(amt_boot)
        B(fails closed) on AMT 10-era firmware because C(discover_and_validate())
        reaches C(AMT_BootCapabilities) via C(Enumerate) with no C(Get)-with-selector
        fallback -- a limitation s2.7 accepts in prose and that had no test.
      - tests/integration/mock_servers/wsman_server.py - align the C(RequestPowerStateChange)
        action-code table with the C(AvailableRequestedPowerStates) the power fixture
        advertises, which the mock now serves. Codes C(11) (Diagnostic Interrupt),
        C(12) (Off - Soft Graceful) and C(14) (Master Bus Reset Graceful) are advertised
        by firmware and were B(refused) by the mock; they are now accepted, with C(11)
        deliberately causing no state transition because an NMI is not a power transition
        and what firmware reports afterwards is not established. Codes C(2) and C(3)
        are absent from that fixture's list but stay B(accepted on purpose) -- the
        advertised set is documented as a function of the current power state and
        the fixture was captured at C(PowerState 2), so C(On) is missing from it precisely
        because the machine was already on.
      - tests/integration/mock_servers/wsman_server.py - answer C(ReturnValue 5) (I(InvalidParameter))
        rather than C(2) for malformed parameters. All three relevant ValueMaps in
        C(device-management-toolkit/go-wsman-messages) agree that C(5) is I(InvalidParameter)
        and C(2) is I(Unknown/Unspecified Error) -- a different condition, and one
        a client could reasonably treat as retryable where an invalid parameter never
        is. C(AMT_MessageLog)'s methods keep their own already-verified values.
      - tests/integration/mock_servers/wsman_server.py - emit an instance's properties
        in B(alphabetical) order, which is how every real firmware response fixture
        in C(go-wsman-messages) orders them; the mock emitted Python dict-insertion
        order, matching for only two of ten handlers. Array properties keep their
        own order, which is the only ordering that carries meaning. This collection's
        parser is B(not) order-sensitive for distinct property names, so this is fidelity
        insurance against a future parser that is, not a bug fix.
      - tests/integration/mock_servers/wsman_server.py - fault a required method parameter
        instead of reporting success. C(CIM_BootService.SetBootConfigRole) answered
        C(ReturnValue 0) when C(Role) was absent entirely; firmware cannot assign
        a role it was not given. C(RequestPowerStateChange) without C(PowerState)
        and C(AMT_RedirectionService.RequestStateChange) without C(RequestedState)
        were likewise successes.
      - tests/integration/mock_servers/wsman_server.py - fix C(CIM_BootSourceSetting.StructuredBootString),
        which was client-visible and the wrong shape entirely - the mock set it equal
        to the instance label. Firmware sends C("<OrgID>:<identifier>:<index>"), and
        the fixture C(responses/cim/boot/sourcesetting/pull.xml) shows C(CIM:Network:1),
        C(CIM:Hard-Disk:1) and C(CIM:CD/DVD:1) verbatim. C(ElementName) was wrong
        the same way - firmware reports the B(same) C(ElementName) (C(Intel(r) AMT
        - Boot Source)) on every instance and distinguishes them by C(InstanceID)
        alone, so a client keying off C(ElementName) would have passed against the
        mock and matched every instance on real hardware. C(FailThroughSupported)
        is now served as the fixture reports it.
      - tests/integration/mock_servers/wsman_server.py - make method-parameter lookup
        namespace- and depth-aware. It was an C(.iter()) walk matching bare local
        names at B(any depth in any namespace), so a parameter placed in the wrong
        namespace or nested one level too deep satisfied the mock and then failed
        schema validation on real firmware -- the same "mock accepts what firmware
        rejects" class as the empty C(<Source/>). Parameters are now read only as
        direct children of the C(_INPUT) wrapper in the wrapper's own namespace, which
        is how MeshCentral, C(go-wsman-messages) and this collection all emit them.
        Endpoint-reference selectors are read at their documented nesting (C(ReferenceParameters/SelectorSet/Selector))
        in the addressing and WS-Man namespaces rather than anywhere in the subtree.
      - tests/integration/mock_servers/wsman_server.py - remove three property names
        with B(no backing) in the class they were attached to, each verified against
        C(go-wsman-messages)' own C(types.go) and recorded response fixtures. C(CIM_BootSourceSetting.BootSourceIndex)
        does not exist on that class under any name; C(AMT_SetupAndConfigurationService.InstanceID)
        does not exist either (the class is keyed by C(Name)/C(CreationClassName)/C(SystemName)/C(SystemCreationClassName),
        all four now served in its place); and C(CIM_AssociatedPowerManagementService.ElementName)
        is absent from both the class definition and the firmware fixture. B(None
        was read by this collection's parser), so no client behaviour changes -- what
        is removed is the chance of a later reader citing the mock as evidence that
