  0.3.1:
    changes:
      bugfixes:
      - 'NOTICE / docs/protocol-notes.md / docs/capability-matrix.md - re-attribute
        the C(LinkPolicy) table to C(go-wsman-messages) and move it to Tier 1 (vendor-sourced),
        keeping the C(parmstro) attribution for what that source genuinely supplied:
        class names, ResourceURIs, selector strings and property names. Record explicitly
        that their C(LinkPolicy) table was wrong. This is the B(second) wrong table
        from that source - their power constants already map C(reset) to CIM code
        11 (Diagnostic Interrupt/NMI) rather than 10 (Master Bus Reset) - so a third
        one should not be trusted without checking it against a vendor reference or
        a firmware fixture.'
      - amt_info - RV(amt.network.link_policy_names) decodes three of its five values
        differently, so B(stored or asserted output from 0.2.0 and 0.3.0 will not
        match). V(14) is now V(sx_ac) (was V(s0_dc)) and V(16) is now V(s0_dc) (was
        V(always_on)); V(224) is newly recognised as V(sx_dc); and V(2)/V(15), previously
        named V(sx_ac)/V(sx_dc), are not defined values in Intel's enum at all and
        now render as V(unknown(2))/V(unknown(15)). They are still reported raw in
        RV(amt.network.link_policy) rather than dropped - inventing names for undefined
        values is what caused this bug. Both lab machines report C(link_policy) V([1,
        14]), so their C(link_policy_names) changes from V([s0_ac, s0_dc]) to V([s0_ac,
        sx_ac]) and their C(wake_on_lan_capable) from V(false) to V(true).
      - 'amt_info - RV(amt.network.wake_on_lan_capable) returned the B(inverse) answer
        on mains-powered hardware in 0.2.0 and 0.3.0. It was derived from C(LinkPolicy)
        containing V(16), described as a I(network link always on) bit. V(16) is in
        fact I(available on S0 DC) - powered on, running on battery - so the field
        actually tested whether the endpoint stays reachable on battery, and returned
        V(false) for every mains-powered desktop that should have read V(true). It
        is now derived from the presence of an B(Sx) value, V(14) (Sx AC) or V(224)
        (Sx DC), which is what I(the link is maintained while the host is asleep,
        hibernating or off) actually means. B(Anyone who branched on this field in
        0.2.0 or 0.3.0 should re-read it): a playbook that skipped a remote power-on
        because the endpoint looked unwakeable was most likely skipping it on a machine
        that was wakeable all along.'
      - 'docs/amt_info.md / docs/capability-matrix.md - rewrite the C(wake_on_lan_capable)
        sections. The old text presented V(false) on both lab machines as the operationally
        interesting finding, and hedged it with a caveat that the value table was
        third-party and should be confirmed via the AMT Web UI. The caveat was correct
        that the table could not be trusted and wrong about what to do next: the vendor
        reference settles it and was one request away. The MEBx screen on one lab
        machine has since been read - C(ME ON in Host Sleep States) is the wake-capable
        option and C(Idle Timeout) is V(65535), matching the reported RV(amt.idle_wake_timeout)
        - so firmware configuration and the corrected table agree, and it was this
        collection''s derivation that disagreed with both.'
      - 'docs/capability-matrix.md - the Tier 4 entry I(whether either endpoint answers
        WS-Man while powered off) is rewritten rather than removed. It is still untested:
        no stage powers a machine off, independently confirms it, and then tries to
        reach it. What changed is that the evidence now points towards reachability
        instead of against it, which is weaker than a measurement and is recorded
        as such. This also resolves a result the document previously called hard to
        square - machine 1''s stage 4 performed an C(off) transition and then a successful
        restore, which fits an endpoint that is reachable while off on AC exactly
        as V(14) says it is.'
      - 'plugins/module_utils/models.py - the C(LinkPolicy) value table came from
        C(parmstro/intel_amt)''s constants file and was wrong in three of its five
        entries, with a fourth value missing. It is replaced with the vendor table
        from C(device-management-toolkit/go-wsman-messages) C(pkg/wsman/amt/ethernetport)
        (tag C(v2.48.3)): V(1) = available on S0 AC, V(14) = available on Sx AC, V(16)
        = available on S0 DC, V(224) = available on Sx DC, and no other defined value.
        There is no I(always on) value; that entry was invented. The module-internal
        constant C(LINK_POLICY_ALWAYS_ON) is gone, replaced by C(LINK_POLICY_S0_AC)/C(LINK_POLICY_SX_AC)/C(LINK_POLICY_S0_DC)/
        C(LINK_POLICY_SX_DC). C(module_utils) is not a supported interface, so this
        is not listed as a breaking change - but anything importing that name will
        need updating.'
      release_summary: "Patch release, and worth taking if you read ``amt_info``'s\n``amt.network.wake_on_lan_capable``
        on 0.2.0 or 0.3.0 \u2014 **it returned the inverse\nanswer on mains-powered
        hardware.**\n\nThe ``LinkPolicy`` value table was taken from a third party's
        constants file and\nthree of its five entries were wrong. The authoritative
        values are ``1`` = S0 AC,\n``14`` = Sx AC, ``16`` = S0 DC, ``224`` = Sx DC;
        there is no \"always on\" value.\nBecause ``14`` was mislabelled and ``16``
        was believed to be a wake bit,\n``wake_on_lan_capable`` tested for \"reachable
        while on battery\" and reported\n``false`` for desktops that are in fact reachable
        while powered off.\n\n``link_policy_names`` values change accordingly, and
        ``wake_on_lan_capable`` now\nreports ``null`` rather than ``false`` when firmware
        does not expose ``LinkPolicy``\nat all \u2014 \"firmware did not say\" and
        \"the link will not stay up\" are different\ndiagnoses, and only the second
        explains why a remote power-on cannot reach an\nendpoint.\n\nNo other module
        is affected, and no return key was added or removed."
    fragments:
    - link-policy-table-correction.yml
    - v0.3.1-summary.yml
    release_date: '2026-07-29'
  0.4.0:
    changes:
      breaking_changes:
      - '``amt_baremetal_install`` role - C(amt_baremetal_install_handoff_host) no
        longer defaults to C(amt_baremetal_install_host) and is now required whenever
        C(amt_baremetal_install_wait_for_handoff) is true (which is the default).
        A play that relied on the old default now fails in C(tasks/validate.yml) before
        anything is contacted, rather than after the reset. To restore the previous
        behaviour exactly, set C(amt_baremetal_install_handoff_host: "{{ amt_baremetal_install_host
        }}"); for a conventional inventory the intended value is usually C("{{ inventory_hostname
        }}"); or set C(amt_baremetal_install_wait_for_handoff: false) to skip the
        hand-off wait entirely. Callers that already set the variable, or that disable
        the wait -- including both hardware qualification stages that drive this role
        -- are unaffected.'
      - amt_media - C(attach_timeout) is now an attach B(deadline) rather than an
        early-confirmation bound. An attach that reaches the timeout with the daemon
        still alive but no V(attached) verdict now B(fails) with C(error_class=timeout)
        and C(indeterminate=true); it previously returned B(success) with C(session_state=starting).
        The old behaviour was documented as intended -- C(docs/amt_media.md) said
        such an attach 'is not reported as a failure' -- so this reverses stated intent
        deliberately, and is called out here rather than buried in bugfixes.
      - 'amt_media - the practical impact is on a genuinely slow endpoint whose attach
        used to exceed the default 10-second C(attach_timeout) and still work. That
        case now fails. B(Raise C(attach_timeout)) rather than treating an unconfirmed
        attach as a success: a caller that acts on the old receipt arms a one-time
        boot and resets the machine into media that was never confirmed to be redirected,
        which is the worst outcome available to a module that serves boot media.'
      bugfixes:
      - .circleci/config.yml - rewrite a stale comment that contradicted the configuration
        below it. It said the destructive hardware stages "are separate playbooks...
        run deliberately by a human, not wired into CI", but stages 4-7 are wired
        in as C(hardware-power), C(hardware-media), C(hardware-writable) and C(hardware-pxe).
        The comment now describes the gating that exists - a strict escalation chain
        in which each stage sits behind its own dedicated approval job, so reaching
        native PXE takes five separate approvals and cannot skip a rung.
      - NOTICE / README.md - record C(kraxel/amtterm)'s C(amtider) as prior art. It
        is a standalone Intel AMT IDE-R client in C (GPL-2.0-or-later), built unconditionally
        since amtterm 1.7, current at tag C(amtterm-1.8-1) (2026-05-04) with Intel
        ME 16 TLS fixes landed in 2026 - and it appeared B(nowhere) in this repository,
        including in C(NOTICE), whose entire selling point is per-file provenance.
        It was not consulted -- this collection's IDE-R was reimplemented from MeshCentral,
        and C(amtider) was identified after the fact during this review. A new "Prior
        art NOT consulted" section in C(NOTICE) says exactly that.
      - NOTICE / docs/protocol-notes.md / docs/capability-matrix.md - withdraw an
        overstated claim about C(parmstro/intel_amt). Three documents said that B(three
        of ten) of its modules "report success while doing nothing"; on re-verification
        exactly B(one) does. C(amt_tls_config) wraps both mutation paths in C(except
        Exception) and falls through to C(exit_json()), so any failure exits C(ok),
        and its C(upload_certificate) is a self-described placeholder that base64-encodes
        the certificate text and computes a C(key_b64) it never uses, silently discarding
        the private key. The other two are B(different) defects, now described accurately
        -- C(amt_system_settings_refactored.py) returns C(changed - False) on check
        mode before computing anything, so C(--check) can never report drift; and
        C(amt_power_policy) does issue real Puts, but with inverted semantics. A claim
        about someone else's project has to meet the same bar as a claim about this
        one.
      - README.md - add C(docs/amt_event_log.md) and C(docs/amt_log_clear.md) to the
        further-reading list, which omitted both.
      - README.md - correct a false hardware-qualification claim. The project status
        said B(all five modules) had been exercised against real Intel AMT firmware,
        directly above a table of seven. Five modules plus the bare-metal install
        role are hardware-qualified; C(amt_event_log) and C(amt_log_clear) have B(never)
        touched real firmware and are now named as such rather than absorbed into
        an "all modules" claim.
      - README.md - narrow the IDE-R novelty claim to what survives scrutiny. The
        old text implied no standalone IDE-R client existed ("which is why most automation
        shells out to MeshCmd"). Defensible and retained -- the first B(pure-Python)
        IDE-R implementation, and the first callable from an Ansible module with no
        Node runtime and no C toolchain on the controller. B(Not) claimed -- first
        or only non-Node.js implementation. Debian and Ubuntu still package amtterm
        B(1.4), which predates C(amtider) and does not contain it, so availability
        of the alternatives is genuinely uneven.
      - README.md / docs/protocol-notes.md / docs/capability-matrix.md / NOTICE /
        plugins/modules/amt_info.py - correct eight references to a C(CHANGELOG) for
        a nonexistent 0.4.0 release. The C(LinkPolicy) table fix and the C(wake_on_lan_capable)
        un-inversion shipped in B(0.3.1) and are documented there in full. The worst
        of these was in C(README.md)'s project status, which is where a reader who
        may have branched on the wrong boolean is sent for detail; three more were
        in C(docs/capability-matrix.md) and two in C(amt_info)'s own RETURN documentation.
      - 'Unit tests - C(tests/unit/plugins/modules/test_amt_media.py)''s C(test_live_daemon_still_starting_is_not_failed)
        asserted the defective behaviour directly, calling it "the legitimate slow-attach
        case", so the fall-through was pinned green rather than merely unnoticed.
        It is rewritten to assert what liveness actually decides - not B(whether)
        an unconfirmed attach fails, but B(which) failure it is - and a new C(TestUnconfirmedAttachIsNotReportedAsSuccess)
        class covers the timeout gate across eight cases. Following PR #72, the assertions
        are on RV(ignore:error_class) and RV(ignore:indeterminate) rather than on
        mere failure, C(read_state) is left real against a real runtime directory,
        and the class carries a positive control (an V(attached) session still succeeds)
        plus a case pinning that the session is B(not) torn down, so a fix that failed
        every attach, or that started auto-detaching, cannot satisfy it. Verified
        by mutation - deleting C(indeterminate=True), collapsing the terminal-state
        branch into the timeout branch, and dropping C(session_id) from the failure
        each turn tests red.'
      - 'Unit tests - ``amt_media``''s issue #44 regression tests (attach failure
        decided by daemon liveness) stubbed all three inputs to that decision, including
        ``read_state``, which collapsed the "re-read the state file once, the daemon
        may have written its error since the last poll" step into the poll result.
        Deleting that re-read from the module left them all passing. ``read_state``
        now runs for real against the real runtime directory, the late error is written
        to disk between the poll and the re-read, and the live-but-still-starting
        case is held against the same intermediate state as the dead-daemon case so
        liveness is what distinguishes them.'
      - Unit tests - ``test_amt_redirection.py``'s ``_no_real_sockets`` fixture never
        took effect, and its comment claiming otherwise was false. ``redirection_service.probe_transport_reachable``
        takes its socket factory as a default argument, bound at import time, so patching
        ``socket.create_connection`` afterwards never reached the call. All eight
        tests in the file were making real TCP connections to the fixture address
        on ports 16994 and 16995 -- 36s of a 78s unit run, and a fixture address in
        10.0.0.0/8 is a plausible host on the lab LAN this collection manages, where
        a live endpoint answering would silently change what the tests observe. Fixed
        by patching the entry the call actually resolves through, moved the fixture
        host to RFC 5737 TEST-NET-1, and added a positive control asserting the probe
        went through the injected factory. The file now runs in 0.11s.
      - 'Unit tests - strengthened a further set of assertions that were dead or close
        to it, each verified by mutation. ``assert "changed" not in result or result["changed"]
        is not True`` claimed a failure was "emphatically not a success" but holds
        for every failure (``AmtError.to_result()`` has never produced a ``changed``
        key) and also for the realistic demotion, ``exit_json(changed=False, **err.to_result())``
        -- making ``amt_log_clear`` demote both its confirmation gate and every firmware
        refusal that way left its whole test file green. ``assert "msg" in result``
        sat on a helper that accepted success or failure, so it could not say which
        failure it got: adding an un-coercible ``port`` to the same arguments makes
        ``amt_power`` fail before the state check is ever reached, and the assertion
        still held. Bare truthiness on ``error_class`` passed for any of the nine
        classes. Existence-only and ``isinstance``-only checks on receipt fields passed
        for a receipt reporting the wrong instance, and for one that had silently
        dropped a field. The per-module ``_run`` helpers are now split into ``_run_ok``/``_run_fail``
        so which of ``exit_json`` and ``fail_json`` a module called is asserted by
        construction. One correction to the audit that prompted this: ``assert "Traceback"
        not in json.dumps(result)`` is narrow rather than dead -- it does catch a
        traceback added to ``to_result()`` -- but it misses everything else about
        the message, so the message is now pinned exactly and the ``exception`` key
        that would really carry a traceback is asserted absent.'
      - 'Unit tests - the collection''s promise that an AMT password never appears
        in a task result was not actually tested. Seven tests, one per module, asserted
        ``password not in json.dumps(exit_json_kwargs)`` while an autouse fixture
        had replaced ``AnsibleModule.exit_json`` with a bare raiser. The real ``exit_json``
        is what injects ``invocation.module_args`` -- the only place in a result a
        credential ever appears -- and what applies ``no_log`` censoring, so those
        seven assertions ran against a dict that structurally could not contain a
        password and could not fail. Verified by mutation: flipping ``no_log: True``
        to ``False`` on ``amt_boot``''s password option made the module emit the operator''s
        real password inside ``invocation.module_args``, and the full unit suite still
        passed, ``ansible-test sanity --test validate-modules`` still exited 0 (an
        explicit ``no_log: False`` reads as a deliberate choice), and the integration
        targets still passed (their tasks set task-level ``no_log: true``, which censors
        regardless of the argument spec). Nothing in the repository would have caught
        it. Replaced with ``tests/unit/plugins/modules/test_credential_contract.py``,
        which runs the real ``exit_json``/``fail_json``, parses the JSON document
        they write to stdout, and asserts on that -- with a positive control on every
        case (``invocation.module_args.username`` must be echoed verbatim) so the
        test cannot go quietly vacuous the same way again. It also asserts the argument-spec
        contract directly over every module discovered by import, so an eighth module
        is covered on the day it is added.'
      - '``amt_baremetal_install`` role - claim and persist the IDE-R C(session_id)
        in run state *before* invoking M(james_crowley.intel_amt.amt_media), instead
        of recording it from a successful attach''s result. C(amt_media)''s C(state=attached)
        forks a detached daemon that owns the redirection connection and outlives
        a failed attach, and it generates its own session id when the caller passes
        none -- which this role did on any fresh run. So a failed attach left run
        state with C(session_id: null), C(tasks/detach_media.yml)''s C(when: ... is
        truthy) skipped, and the role orphaned the very daemon whose existence the
        failure was reporting. IDE-R being single-session, that orphan also blocked
        the next attempt against the same endpoint. The C(always) detach in C(tasks/main.yml)
        now fires on every attach outcome, including a timeout reported as C(indeterminate),
        for which this collection''s contract is to re-probe rather than retry --
        and C(state=detached) is a probe, never a retry. C(media_attached) is still
        set only after a confirmed attach, so a failed attach cannot look like a successful
        one to a resumed run.'
      - '``amt_baremetal_install`` role - remove the second fan-out assertion in C(tasks/validate.yml)
        (C(ansible_play_batch | length == 1)), which the code described as "a second,
        independent guard" and which was neither. Ansible builds C(ansible_play_batch)
        and C(ansible_play_hosts_all) from one inventory query differing only in whether
        the C(serial:) batch restriction is honoured, so the batch is always a subset
        of the roster and the batch assertion could not fail unless the roster assertion
        already had. Worse, its failure message advised setting C(serial: 1), which
        reads as though serialising a multi-host play would make this role safe to
        run -- it does not, because the roster check ignores batch restrictions. The
        surviving roster assertion carries the entire guarantee and now reports the
        batch count as a diagnostic, so no information is lost. The integration target
        asserts the counterfactual directly: in a two-host C(serial: 1) play the removed
        assertion''s predicate holds while the roster assertion is the one that fires.'
      - '``amt_baremetal_install`` role - report the media C(session_id), its C(runtime_dir)
        and a manual-detach hint in C(tasks/record_failure.yml)''s failure output.
        The C(always) detach covers every case except a detach that itself fails or
        exceeds C(detach_timeout); in that one case an operator previously had no
        way to name the stranded IDE-R session, which for a single-session protocol
        also blocks the next attempt. Neither value is a credential.'
      - '``amt_baremetal_install`` role - stop defaulting C(amt_baremetal_install_handoff_host)
        to C(amt_baremetal_install_host). That is the AMT *management* address, while
        the role''s own comment instructed callers to point the variable at whatever
        the freshly installed OS answers on -- and whether AMT shares the host''s
        address or has its own is a per-deployment provisioning choice the role cannot
        see. The consequence of guessing wrong was a full C(amt_baremetal_install_handoff_timeout)
        (default V(3600) seconds) of waiting *after* the destructive boundary, on
