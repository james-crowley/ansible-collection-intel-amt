      - tests/integration/mock_servers/wsman_server.py - teach the mock WS-Man server
        to reject an B(empty) C(<Source/>) element on C(CIM_BootConfigSetting.ChangeBootOrder)
        with B(HTTP 400) and the firmware's own reason, "The supplied SOAP violates
        the corresponding XML schema definition", exactly as real AMT 16.1.30 does
        (C(docs/protocol-notes.md) s2.5). C(Source) is typed as an endpoint reference,
        so the schema requires C(Address) and C(ReferenceParameters) children; an
        B(absent) element is valid because these parameters are C(minOccurs=0), which
