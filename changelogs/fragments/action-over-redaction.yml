---
bugfixes:
  - >-
    tests/hardware/redact-evidence.py - stop redacting C(operation.action). Five of the seven
    values a module can write are dotted (C(amt_event_log.read), C(amt_log_clear.clear),
    C(amt_media.attach), C(amt_media.detach)), and a dotted lowercase token is exactly what the
    C(fqdn) pattern matches -- C(amt_event_log) reads as a label and C(.read) reads as a TLD.
    C(_is_dns_name) does not save them, since it only rejects known public suffixes and
    filename labels. Observed rather than hypothesised: the first real-firmware event-log run
    published C("action": "<redacted-fqdn-2>") where the module had written
    C(amt_event_log.read), so the artifact no longer recorded which operation produced it.
    This is the same failure the file already guards C(raw_hex) against -- B(over-redaction
    corrupting a field nobody would know had been corrupted) -- and it is worse than a leak,
    because a reviewer cannot tell it happened. The value comes from this collection's own
    source and can never identify anything.
