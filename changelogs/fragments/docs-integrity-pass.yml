---
bugfixes:
  - README.md / docs/protocol-notes.md / docs/capability-matrix.md / NOTICE / plugins/modules/amt_info.py - correct eight references
    to a C(CHANGELOG) for a nonexistent 0.4.0 release. The C(LinkPolicy) table fix and the C(wake_on_lan_capable) un-inversion
    shipped in B(0.3.1) and are documented there in full. The worst of these was in C(README.md)'s project status, which is where a
    reader who may have branched on the wrong boolean is sent for detail; three more were in C(docs/capability-matrix.md) and two in
    C(amt_info)'s own RETURN documentation.
  - docs/capability-matrix.md - correct the integration-target count from I(5/5) to I(7/7) and name all seven targets. C(amt_event_log)
    and C(amt_log_clear) had integration targets under C(tests/integration/targets/) but appeared nowhere in the document.
  - README.md - correct a false hardware-qualification claim. The project status said B(all five modules) had been exercised against
    real Intel AMT firmware, directly above a table of seven. Five modules plus the bare-metal install role are hardware-qualified;
    C(amt_event_log) and C(amt_log_clear) have B(never) touched real firmware and are now named as such rather than absorbed into an
    "all modules" claim.
  - docs/capability-matrix.md - add C(amt_event_log) and C(amt_log_clear) to the document at the tier they actually earn. Both gain a
    Tier 2 subsection recording that they are mock-tested only, and a Tier 4 entry stating that no hardware stage exercises either and
    naming what is therefore unproven - the C(GetRecords) iteration, the record layout and little-endian timestamp decode, and that
    C(ClearLog) does what its name says on a live endpoint. Their own module pages already said this; the aggregate document did not.
  - docs/testing.md / tests/hardware/README.md - record that the eight hardware stages cover five of the seven modules. Neither
    document mentioned C(amt_event_log) or C(amt_log_clear) at all, so a green hardware run read as covering the whole collection.
  - README.md - add C(docs/amt_event_log.md) and C(docs/amt_log_clear.md) to the further-reading list, which omitted both.
  - docs/capability-matrix.md - correct the quoted unit-test count from 761 to 902, measured the same way (C(pytest) against a freshly
    staged collection tree). The existing framing is kept -- a point measurement that drifts as tests are added, not a promise.
  - NOTICE / docs/protocol-notes.md / docs/capability-matrix.md - withdraw an overstated claim about C(parmstro/intel_amt). Three
    documents said that B(three of ten) of its modules "report success while doing nothing"; on re-verification exactly B(one) does.
    C(amt_tls_config) wraps both mutation paths in C(except Exception) and falls through to C(exit_json()), so any failure exits C(ok),
    and its C(upload_certificate) is a self-described placeholder that base64-encodes the certificate text and computes a C(key_b64) it
    never uses, silently discarding the private key. The other two are B(different) defects, now described accurately --
    C(amt_system_settings_refactored.py) returns C(changed - False) on check mode before computing anything, so C(--check) can never
    report drift; and C(amt_power_policy) does issue real Puts, but with inverted semantics. A claim about someone else's project has
    to meet the same bar as a claim about this one.
  - docs/capability-matrix.md / docs/protocol-notes.md / NOTICE - state the C(LinkPolicy) risk in the form that is both most
    persuasive and most honest. C(parmstro)'s C(amt_power_policy) treats C(16 in LinkPolicy) as C(always_on) and derives C(wake_on_lan)
    from it, but C(16) means "available on S0 DC" - powered on, on battery - so requesting C(always_on) sets roughly the opposite of
    enabling wake-while-off. B(This collection shipped the same bug, from the same table, and fixed it in 0.3.1.) Recorded as a shared
    error corrected here rather than as an accusation.
  - NOTICE / README.md - record C(kraxel/amtterm)'s C(amtider) as prior art. It is a standalone Intel AMT IDE-R client in C
    (GPL-2.0-or-later), built unconditionally since amtterm 1.7, current at tag C(amtterm-1.8-1) (2026-05-04) with Intel ME 16 TLS
    fixes landed in 2026 - and it appeared B(nowhere) in this repository, including in C(NOTICE), whose entire selling point is
    per-file provenance. It was not consulted -- this collection's IDE-R was reimplemented from MeshCentral, and C(amtider) was
    identified after the fact during this review. A new "Prior art NOT consulted" section in C(NOTICE) says exactly that.
  - README.md - narrow the IDE-R novelty claim to what survives scrutiny. The old text implied no standalone IDE-R client existed
    ("which is why most automation shells out to MeshCmd"). Defensible and retained -- the first B(pure-Python) IDE-R implementation, and
    the first callable from an Ansible module with no Node runtime and no C toolchain on the controller. B(Not) claimed -- first or only
    non-Node.js implementation. Debian and Ubuntu still package amtterm B(1.4), which predates C(amtider) and does not contain it, so
    availability of the alternatives is genuinely uneven.
  - plugins/module_utils/models.py / docs/protocol-notes.md - fix an incoherent comment on the CIM power-state table and record why the
    names are what they are. Value C(9) was glossed as "Power Cycle (off-hard) -- ends powered off", which is self-contradictory. The
    names follow the DMTF CIM ValueMap for C(CIM_AssociatedPowerManagementService.PowerState), which MeshCmd's own C(DMTFPowerStates)
    array reproduces identically; go-wsman-messages' C(pkg/wsman/cim/power/decoder.go) transposes the soft/hard qualifier within each
    pair, but it lists C(RequestPowerStateChange) B(action) codes rather than the observed-state ValueMap and carries its own "needs to
    be scrubbed" TODO, so it is explicitly flagged as a decoy rather than followed. Also recorded -- C(5) and C(9) are both power cycles
    yet normalize to C(on) and C(off) respectively, an inherited asymmetry left untouched because changing it is a behaviour change and
    nothing has measured it. B(No mapping was changed) - comments and documentation only.
  - .circleci/config.yml - rewrite a stale comment that contradicted the configuration below it. It said the destructive hardware
    stages "are separate playbooks... run deliberately by a human, not wired into CI", but stages 4-7 are wired in as
    C(hardware-power), C(hardware-media), C(hardware-writable) and C(hardware-pxe). The comment now describes the gating that exists -
    a strict escalation chain in which each stage sits behind its own dedicated approval job, so reaching native PXE takes five
    separate approvals and cannot skip a rung.
  - docs/testing.md - document what the CI matrix actually covers, because "2.17/2.18/2.19 x 3.10-3.13" is the obvious shorthand and
    overstates it by half. C(sanity) is py3.12 across three core versions (three cells); C(units) is py3.10-3.13 across 2.17 and 2.19
    only, six cells after two upstream-forced excludes. B(ansible-core 2.18 has no unit-test cell) - it is covered by sanity and by the
    hardware jobs' C(ansible-core~=2.18.18) lab virtualenv.
