---
minor_changes:
  - Add ``AmtClient``, the typed facts/power management API that ``amt_info`` and ``amt_power`` adapt to, built on the existing ``WsmanClient`` transport (https://github.com/james-crowley/ansible-collection-intel-amt/issues/2, https://github.com/james-crowley/ansible-collection-intel-amt/issues/3).
  - Add the ``amt_info`` module -- read-only capability and state discovery. Capabilities (``power``, ``boot_once_pxe``, ``sol``, ``storage_redirection``) and redirection-service status are discovered from live firmware responses; a firmware that omits an optional WS-Man class degrades that capability to ``false``/unknown instead of failing the whole read (https://github.com/james-crowley/ansible-collection-intel-amt/issues/2).
  - Add the ``amt_power`` module -- convergent ``on``/``off``, imperative ``reboot``/``reset``/``cycle``, and a non-mutating ``query`` state. A successful ``RequestPowerStateChange`` is polled a bounded, injectable number of times afterwards and reports what was actually observed, since ``ReturnValue == 0`` means accepted, not complete (https://github.com/james-crowley/ansible-collection-intel-amt/issues/3).
  - Extend ``AmtFacts`` with ``reported_hostname``, ``capabilities``, and ``redirection`` fields (all firmware-observed, defaulted for backward compatibility) and add the new ``AmtCapabilities`` dataclass, so facts-gathering has a typed home for capability discovery without collapsing it into an untyped dict (https://github.com/james-crowley/ansible-collection-intel-amt/issues/2).
