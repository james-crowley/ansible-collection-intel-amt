---
minor_changes:
  - ".circleci/config.yml - C(hardware-log-clear-approval) (stage 10, C(amt_log_clear)) now
    requires C(hardware-tests) directly instead of C(hardware-pxe). Stages 10-12 (log-clear,
    sleep/hibernate, wake-from-off) had sat at the end of a single linear chain purely because
    each was appended after the one before it, not because any of the three actually depends on
    the stages in between: C(amt_log_clear) needs only WS-Man (read the log, archive it, then
    clear it -- stage 9's read already lives in C(hardware-tests)), and sleep/hibernate/
    wake-from-off need only power control, not IDE-R media attach (stage 5) or a native PXE arm
    (stage 7). Reaching stage 10 therefore required three approvals and three real hardware
    mutations (power, media, writable-image, plus PXE) that C(amt_log_clear) has no dependency on
    at all. This is a narrower graph, not a weaker gate: the property that matters -- one
    independent, dedicated C(type: approval) job per escalation, so approving one destructive
    action never doubles as approving another -- is unchanged, and C(hardware-log-clear-approval)
    still gates only C(hardware-log-clear) and still requires its own human click. C(hardware-power)
    /C(hardware-media)/C(hardware-writable)/C(hardware-pxe) remain reachable in their original
    order, behind their own approvals, for anyone who wants the full escalation -- this adds a
    second, shorter path to 10-12, it does not remove the existing one. Stages 11
    (C(hardware-sleep-hibernate)) and 12 (C(hardware-wake-from-off)) stay chained after stage 10
    exactly as before, because that ordering is a real dependency: C(amt_log_clear) must follow
    the event-log read it archives, and wake-from-off is deliberately last."
