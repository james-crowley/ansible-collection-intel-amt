---
bugfixes:
  - >-
    plugins/modules/amt_media.py - stop returning a B(success receipt) for an attach that never confirmed. C(_attach) waits
    C(attach_timeout) seconds for the background session daemon to report V(attached), and decided failure purely by whether
    that daemon was still B(alive) -- the fix for issue #44, which is correct for the case it addressed (bad credentials kill
    the daemon during the digest handshake, and a dead daemon that never reported V(attached) must not fall through to
    success). But the liveness check only fires when the recorded pid is B(dead). A daemon still B(alive) when
    C(attach_timeout) expired without ever reporting V(attached) skipped both that branch and the C(session_state=error)
    branch above it, and fell through to C(OperationReceipt(changed=True, ...)) -- so the caller received C(changed - true), a
    C(session_id), RV(ignore:error_class) V(null), and RV(session_state) V(connecting) as an ordinary C(ok)/C(changed) task
    result. Nothing had established that media was being served. This is the ordinary case rather than an exotic one, because
    C(attach_timeout) and C(connect_timeout) both default to B(10 seconds), so a redirection connect that is merely slow
    reaches this gate with the daemon perfectly healthy.
  - >-
    plugins/modules/amt_media.py - what a caller B(does) with that receipt is why it mattered. It is acted on, not inspected -
    in C(roles/amt_baremetal_install/tasks/main.yml), C(attach_media) is followed immediately by C(arm_boot) and then
    C(reset), so the receipt armed a one-time IDE-R boot and master-bus-reset a machine into media that was never confirmed to
    be redirected. That is the same family as the defect fixed in #69, where the daemon reported V(attached) for a session
    whose IDE-R feature toggle firmware had B(refused): in both cases the module asserted a fact it had not established, and
    the cost is a machine rather than a retry.
  - >-
    plugins/modules/amt_media.py - an unconfirmed attach now B(fails), classified deliberately rather than generically. With
    the daemon still running and no verdict yet (V(starting)/V(connecting), or no readable state record), the failure is
    RV(ignore:error_class) V(timeout) with RV(ignore:indeterminate) V(true) - following the rule #69 established one level
    down in C(media_session._run_daemon), V(unsupported_capability) for a B(definite) refusal and V(timeout) for B(no verdict).
    C(indeterminate) carries its established meaning here (see C(plugins/module_utils/errors.py)) and is the operationally
    load-bearing part - B(re-probe, do not retry). A repeated C(state - attached) call for the same C(session_id) is the
    re-probe, taking C(_attach)'s existing idempotency branch; a blind retry is the one thing a caller must not do, because IDE-R is
    single-session and a second attach would collide with a daemon that may still hold the one connection firmware has to
    give. A live daemon whose last report is a B(terminal) state (V(detached) - the session ended without ever attaching,
    typically because the peer closed the connection, and it is merely still winding down) is a B(settled) failure and is
    deliberately B(not) marked indeterminate, since there is no attach still in flight to re-probe.
  - >-
    plugins/modules/amt_media.py - the failure still carries RV(session_id) and RV(pid), and the session is deliberately
    B(not) auto-detached. Both are load-bearing. A failure that stranded a session the caller could not name would be worse
    than the receipt it replaces, because the daemon still holds the single IDE-R session and every later attach against that
    endpoint would collide with it. Tearing it down was considered and rejected on three grounds - it contradicts the
    C(indeterminate) contract, which promises the caller something left to re-probe; C(media_session.remove_state) deletes the
    session B(log) alongside the state file, so the teardown would destroy the only record of how far the attach got, with the
    diagnosis deleted by the code reporting the problem; and the ordinary route to this gate is an attach that is slow and
    about to succeed, which a teardown at C(t=attach_timeout) would convert into a guaranteed failure. Cleanup stays with the
    caller, which can sequence it against everything else it knows - C(roles/amt_baremetal_install) already detaches from an
    C(always:) block. B(No timeout was lengthened) and no success path changed.
  - >-
    plugins/modules/amt_media.py - corrected this module's own C(attach_timeout) documentation, which promised the opposite of
    the behaviour that is now correct. It said a slow-but-eventually-successful attach exceeding the timeout "is not a
    failure", which is exactly the fall-through described above written down as if intended. It now documents the V(timeout) /
    C(indeterminate) failure and names the re-probe. B(Note for a follow-up outside this change:) C(docs/amt_media.md)'s
    Limitations section carries the same superseded claim ("C(attach_timeout) is an early-confirmation bound, not an attach
    deadline"), and C(roles/amt_baremetal_install) never records the generated session id until B(after) a successful attach,
    so its C(always:) detach is gated on C(session_id is truthy) and is B(skipped) on this failure - leaving the very daemon
    this change reports as still running unreaped. Neither file was touched here.
  - >-
    Unit tests - C(tests/unit/plugins/modules/test_amt_media.py)'s
    C(test_live_daemon_still_starting_is_not_failed) asserted the defective behaviour directly, calling it "the legitimate
    slow-attach case", so the fall-through was pinned green rather than merely unnoticed. It is rewritten to assert what
    liveness actually decides - not B(whether) an unconfirmed attach fails, but B(which) failure it is - and a new
    C(TestUnconfirmedAttachIsNotReportedAsSuccess) class covers the timeout gate across eight cases. Following PR #72, the
    assertions are on RV(ignore:error_class) and RV(ignore:indeterminate) rather than on mere failure, C(read_state) is left
    real against a real runtime directory, and the class carries a positive control (an V(attached) session still succeeds)
    plus a case pinning that the session is B(not) torn down, so a fix that failed every attach, or that started
    auto-detaching, cannot satisfy it. Verified by mutation - deleting C(indeterminate=True), collapsing the terminal-state
    branch into the timeout branch, and dropping C(session_id) from the failure each turn tests red.
