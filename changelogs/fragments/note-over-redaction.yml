---
bugfixes:
  - >-
    tests/hardware/redact-evidence.py - stop redacting the prose C(note) fields the
    qualification playbooks write. Stage 5's note reads "media_attach.devices/bytes_* are
    amt_media's own report...", and C(media_attach.devices) is a dotted lowercase token, so
    the C(fqdn) pattern rewrote it to C(<redacted-fqdn-1>/bytes_*) -- the sentence explaining
    what the evidence means stopped naming the field it was explaining. Second instance of
    the same family as the C(operation.action) fix, and found the same way, by reading a
    published artifact rather than by looking for it. C(_is_dns_name) exists partly to
    prevent this but works from a fixed label list, so it only catches dotted words someone
    already anticipated. The exemption is sound only because every note is a literal authored
    in this repository, which is now enforced by
    C(test_no_hardware_note_is_templated) -- that test is the exemption's precondition, and
    neither should be removed without the other.
