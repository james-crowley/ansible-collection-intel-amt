---
bugfixes:
  - >-
    Unit tests - the collection's promise that an AMT password never appears in a task result was
    not actually tested. Seven tests, one per module, asserted ``password not in
    json.dumps(exit_json_kwargs)`` while an autouse fixture had replaced ``AnsibleModule.exit_json``
    with a bare raiser. The real ``exit_json`` is what injects ``invocation.module_args`` -- the
    only place in a result a credential ever appears -- and what applies ``no_log`` censoring, so
    those seven assertions ran against a dict that structurally could not contain a password and
    could not fail. Verified by mutation: flipping ``no_log: True`` to ``False`` on ``amt_boot``'s
    password option made the module emit the operator's real password inside
    ``invocation.module_args``, and the full unit suite still passed, ``ansible-test sanity --test
    validate-modules`` still exited 0 (an explicit ``no_log: False`` reads as a deliberate choice),
    and the integration targets still passed (their tasks set task-level ``no_log: true``, which
    censors regardless of the argument spec). Nothing in the repository would have caught it.
    Replaced with ``tests/unit/plugins/modules/test_credential_contract.py``, which runs the real
    ``exit_json``/``fail_json``, parses the JSON document they write to stdout, and asserts on that
    -- with a positive control on every case (``invocation.module_args.username`` must be echoed
    verbatim) so the test cannot go quietly vacuous the same way again. It also asserts the
    argument-spec contract directly over every module discovered by import, so an eighth module is
    covered on the day it is added.
  - >-
    Unit tests - ``test_amt_redirection.py``'s ``_no_real_sockets`` fixture never took effect, and
    its comment claiming otherwise was false. ``redirection_service.probe_transport_reachable``
    takes its socket factory as a default argument, bound at import time, so patching
    ``socket.create_connection`` afterwards never reached the call. All eight tests in the file were
    making real TCP connections to the fixture address on ports 16994 and 16995 -- 36s of a 78s
    unit run, and a fixture address in 10.0.0.0/8 is a plausible host on the lab LAN this
    collection manages, where a live endpoint answering would silently change what the tests
    observe. Fixed by patching the entry the call actually resolves through, moved the fixture host
    to RFC 5737 TEST-NET-1, and added a positive control asserting the probe went through the
    injected factory. The file now runs in 0.11s.
  - >-
    Unit tests - strengthened a further set of assertions that were dead or close to it, each
    verified by mutation. ``assert "changed" not in result or result["changed"] is not True``
    claimed a failure was "emphatically not a success" but holds for every failure
    (``AmtError.to_result()`` has never produced a ``changed`` key) and also for the realistic
    demotion, ``exit_json(changed=False, **err.to_result())`` -- making ``amt_log_clear`` demote
    both its confirmation gate and every firmware refusal that way left its whole test file green.
    ``assert "msg" in result`` sat on a helper that accepted success or failure, so it could not
    say which failure it got: adding an un-coercible ``port`` to the same arguments makes
    ``amt_power`` fail before the state check is ever reached, and the assertion still held. Bare
    truthiness on ``error_class`` passed for any of the nine classes. Existence-only and
    ``isinstance``-only checks on receipt fields passed for a receipt reporting the wrong
    instance, and for one that had silently dropped a field. The per-module ``_run`` helpers are
    now split into ``_run_ok``/``_run_fail`` so which of ``exit_json`` and ``fail_json`` a module
    called is asserted by construction. One correction to the audit that prompted this: ``assert
    "Traceback" not in json.dumps(result)`` is narrow rather than dead -- it does catch a
    traceback added to ``to_result()`` -- but it misses everything else about the message, so the
    message is now pinned exactly and the ``exception`` key that would really carry a traceback is
    asserted absent.
  - >-
    Unit tests - ``amt_media``'s issue #44 regression tests (attach failure decided by daemon
    liveness) stubbed all three inputs to that decision, including ``read_state``, which collapsed
    the "re-read the state file once, the daemon may have written its error since the last poll"
    step into the poll result. Deleting that re-read from the module left them all passing.
    ``read_state`` now runs for real against the real runtime directory, the late error is written
    to disk between the poll and the re-read, and the live-but-still-starting case is held against
    the same intermediate state as the dead-daemon case so liveness is what distinguishes them.
