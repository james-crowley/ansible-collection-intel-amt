---
security_fixes:
  - "CI - redact identifying lab data from hardware qualification evidence before CircleCI publishes it. The
    five hardware jobs stored C(tests/hardware/output) as the C(hardware-evidence) artifact unmodified, so the JSON
    the stage playbooks write exposed the target's IPv4 address, default gateway, subnet mask, DNS servers, MAC
    address, platform GUID and management domain name. Holding those values as CircleCI context secrets did not
    prevent this: B(context masking applies to log output only and does not extend to C(store_artifacts) content),
    and artifact visibility follows the project's Free and Open Source flag, which made the evidence
    world-readable."
  - "CI - add C(tests/hardware/redact-evidence.py), run by a shared C(redact-hardware-evidence) command immediately
    before every C(store_artifacts) of C(tests/hardware/output) with C(when: always). It rewrites each JSON file in
    place, replacing addresses, MACs, UUIDs, fingerprints, digests, FQDNs and the AMT hostname with stable
    per-run pseudonyms while preserving firmware and BIOS versions, capability flags, states, byte counters and the
    JSON structure. Applied once at the CI layer rather than in each of the six playbooks that write evidence, so a
    playbook added later cannot leak by default."
