---
trivial:
  - >-
    tests/unit/mock_servers/test_wsman_server.py - drive ``AmtState.boot_source_count``
    and ``WsmanMockServer.page_size`` away from their defaults for the first time, and do
    it through the collection's **own** client rather than a hand-rolled
    ``requests.post``, closing issue #92. Both knobs were fully wired in the mock --
    ``boot_source_count`` sizes the ``CIM_BootSourceSetting`` set in
    ``_boot_source_items``, ``page_size`` drives the ``Enumerate``/``Pull`` split in
    ``_handle_pull`` and is even exposed as a ``--page-size`` flag on the standalone
    runner -- but nothing anywhere had ever passed either a non-default value, and a
    constructor knob that is only ever its own default is indistinguishable from one that
    does not work. Two new classes, both narrow on purpose. ``TestRealClientBootSourceCount``
    reaches the two ``discover_and_validate()`` verdicts that protocol-notes.md §2.5
    specifies and that a fixed five-instance set could not produce: firmware serving
    **fewer** boot sources than the module offers targets for must fail closed with
    ``unsupported_capability``/``found 0`` for the missing one rather than guessing or
    taking the first instance (a wrong-device boot being the highest-consequence outcome in
    this collection), and firmware serving **more** must not make a known source ambiguous
    -- the count-8 case puts an ``Intel(r) AMT: Force PXE Boot (5)`` next to
    ``Intel(r) AMT: Force PXE Boot``, so a client matching on prefix or substring instead of
    ``==`` counts two and refuses a boot it should have armed. ``TestRealClientPageSizeBoundaries``
    covers the two boundaries, which is the accurate framing of the gap: the default of 2 does
    genuinely page five instances across three ``Pull``s, so what was untested is
    ``page_size=1`` (a page per instance, the maximum number of continuations) and a page size
    above the instance count (everything in the first ``Pull``, ``EndOfSequence`` and no
    ``EnumerationContext`` -- so a client that keys "keep pulling" off the presence of a
    context rather than the absence of ``EndOfSequence`` never loops). Both assert an exact
    ``Pull`` **count**, not merely a complete result set, via a counting ``requests.Session``
    handed to ``WsmanClient(session=...)``: a complete result set is what you get at every
    page size including one the mock ignored, so the count is what proves the knob reached the
    wire. Per the bar set by PR #91, each test was shown to fail before being accepted --
    making the mock clamp ``count`` to ``len(BOOT_SOURCE_NAMES)`` reddens all three
    boot-source tests; making ``discover_and_validate()`` match with ``startswith`` reddens
    only the ambiguity test, with ``found 2``; hardcoding a page of 2 in ``_handle_pull``
    reddens both page-size boundaries; and making ``WsmanClient.enumerate()`` stop after the
    first page reddens ``page_size=1`` while correctly leaving the single-page case green.
    No production behaviour changes: every code path asserted on already existed, only the
    means of reaching it was missing.
