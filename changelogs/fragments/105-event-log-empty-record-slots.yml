---
bugfixes:
  - >-
    C(amt_event_log) - stop counting zero-filled empty log slots as records. Real
    firmware pads its C(GetRecords) response with all-zero 21-byte entries for record
    slots a previous C(ClearLog) freed, and this module counted them, so RV(records_read)
    could exceed RV(total_records) and RV(records) carried entries with no timestamp, no
    entity, no severity and no event data. Measured on C(amt-lab-01) (AMT 16.1.30,
    CircleCI job 2976): one C(GetRecords) call returned B(223) C(RecordArray) elements
    while C(AMT_MessageLog.CurrentNumberOfRecords) reported B(18) and C(NoMoreRecords)
    was already set. The 223 collapse to 13 distinct values -- 18 real records, then one
    identical all-zero record repeated B(205) times, one per slot a clear earlier the
    same day had freed. Firmware's counter was correct throughout and is not adjusted;
    RV(records_read) is. The new RV(empty_slots) reports how many entries were excluded,
    so the padding stays visible rather than merely vanishing (issue #105).
  - >-
    C(amt_event_log) - the sentinel test is B(all 21 bytes zero) and nothing weaker,
    which is a deliberate choice with a cost attached. A record whose timestamp is V(0)
    but whose other fields are populated is a firmware RTC fault an operator wants to
    see, not padding to discard, and is still returned with RV(records[].timestamp_utc)
    as V(null). An all-zero record of any B(other) length is also still returned, because
    an unexpected record length is itself a finding and no source describes what a record
    longer than C(MaxRecordSize) holds. A record that failed to decode is never treated as
    an empty slot -- "we could not read these bytes" is not "we read them and they were
    empty".
  - >-
    C(amt_event_log) - empty slots are B(skipped), not treated as end-of-data. On
    C(amt-lab-01) the 205 padding entries were contiguous and strictly trailing, so
    stopping at the first one would have been correct there too -- and would have saved
    nothing, because firmware had already set C(NoMoreRecords) in that same batch. It was
    not adopted because no source describes this padding at all: "padding is always
    trailing" rests on one firmware in one state, and a generation that interleaved a
    freed slot between live records would have every record after it silently discarded
    under C(complete: true), which is the exact defect in the prior art this module
    exists to avoid. Skipping costs one wasted decode per slot and can never lose a
    record.
  - >-
    C(amt_event_log) - O(max_records) now bounds the number of C(RecordArray) elements
    B(consumed) from firmware rather than the number of records kept. Budgeting on kept
    records would let firmware serving nothing but padding across advancing iteration
    identifiers never reach the bound, leaving C(NoMoreRecords) as the loop's only exit --
    a new way for a play to hang, which is the thing O(max_records) exists to prevent.
    RV(truncated) is unchanged in meaning: more entries existed and were not fetched.
minor_changes:
  - >-
    C(amt_event_log) - new return value RV(empty_slots): how many all-zero C(RecordArray)
    entries firmware returned that the read excluded from RV(records). V(0) on a log
    firmware did not pad. A non-zero value is normal for a recently cleared log and is
    B(not) a fault; notably it is also B(not) evidence that deleted records are being
    served, since the entries are all zero and contain nothing that was in the log before
    the clear. That distinction was tested rather than assumed -- none of the 205 records
    C(ClearLog) archived on C(amt-lab-01) appear anywhere in the read that followed it, so
    M(james_crowley.intel_amt.amt_log_clear) needs no warning about post-clear reads.
  - >-
    C(tests/integration/mock_servers/wsman_server.py) - new C(AmtState.message_log_empty_slots)
    knob (and C(--message-log-empty-slots) on C(run_wsman_mock.py)): pad the C(GetRecords)
    response with N zero-filled empty record slots after the real records, B(without)
    counting them in C(CurrentNumberOfRecords). Nothing in this mock could previously make
    the container counter and the returned array disagree -- both were derived from the
    same list -- which is precisely why no test caught issue #105 and only hardware did.
    The padding string is the base64 C(amt-lab-01) actually sent, taken from the evidence
    artifact rather than constructed to match the code that reads it. Trailing placement
    only, because that is where firmware put it; the interleaved case is covered against a
    fake transport, where it can be labelled constructed rather than served as evidence.
    Driven through C(message_log.read_records) over the real C(WsmanClient) and through the
    whole module in the C(amt_event_log) integration target, with a response-side
    C(RecordArray) counter and a C(batches) assertion as controls -- issue #92's standard
    for a knob that is exercised rather than merely wired.
