---
minor_changes:
  - "docs - record that C(amt-lab-02) (AMT 19.0.5) completed all eight hardware qualification stages on 2026-07-29.
    Power control, IDE-R media, the writable-image path and native one-time PXE are verified on two machines across two
    firmware generations rather than one. The capability matrix, README project status, testing guide, hardware README,
    per-module limitations and role verification status no longer say otherwise."
  - "docs - promote C(amt_info)'s network, system-state and BIOS facts from Tier 2 to Tier 3 for AMT 19.0.5, which
    returned every one of them populated with nothing null and no class faulted. They are still unverified on 16.1.30 --
    machine 1 has not been re-run since v0.2.0 added them -- and that limit is stated per generation rather than left to
    imply both."
  - "docs - record two protocol facts now confirmed against live firmware: C(system_state.operational_status) really is
    a C(uint16[]) array and not a scalar, and C(idle_wake_timeout) came back as 65535. The timeout is reported only;
    nothing available establishes what the firmware means by that value, so no behaviour is inferred from it."
  - "docs - correct the stage-2 identity cross-check, which executed for the first time and matched. Recorded from a
    value this collection itself observed, it detects drift -- a reused DHCP lease, a swapped inventory suffix -- and is
    not independent machine identity, which would need the booted OS's own C(dmidecode -s system-uuid)."
  - "docs - close the Tier 4 entry for the destructive stages on a second machine, and record issue #13's
    prefixed-namespace EPR form as accepted on a second firmware generation. A non-zero IDE-R write stays unproven:
    C(bytes_written == 0) on both machines, which is evidence the zero belongs to the unattended setup, not to one
    endpoint."
security_fixes:
  - "CI - GHSA-w8p5-mx5w-cpqj [HIGH] is now cleared for the self-hosted lab runner in practice, not only in
    configuration. The 2026-07-29 qualification run is the first to reach hardware on Python 3.12.13 with
    ansible-core 2.18.18, the first release carrying the fix; the 2.17 line it previously used is EOL and permanently
    affected. Every hardware trigger since v0.1.0 had errored before starting, so the pin declared in 0.2.0 had never
    actually been exercised."
