---
minor_changes:
  - Add SECURITY.md with a private reporting channel, and a plain explanation of why this collection warrants unusual care -- AMT credentials are equivalent to physical access, and writable IDE-R hands a remote BIOS raw block access to a local file.
  - Add GitHub issue forms for bug reports and feature requests. The bug form asks for the fields that actually make a report actionable -- ``error_class``, AMT firmware version, and transport mode -- since behaviour genuinely differs across firmware generations.
  - Add a pull request template whose checklist items each correspond to a class of bug that has really occurred in this collection, including running sanity against the oldest supported ansible-core rather than only the newest.
  - Add CODE_OF_CONDUCT.md referencing the Ansible Community Code of Conduct, and .github/CODEOWNERS marking the wire-protocol and hardware-touching paths.
  - "Add renovate.json covering the dependency surfaces Renovate can actually see: pip requirements, ``cimg/python`` CI images, and the single ``ansible-core`` pin used by the hardware job."
  - "Add docs/maintainer-setup.md documenting every one-time human step: claiming a Galaxy namespace, creating the restricted publish context, installing Renovate, and the public-versus-private trade-off."
bugfixes:
  - "Exclude repository tooling from the built collection artifact. ``renovate.json`` was being shipped to consumers; ``CODE_OF_CONDUCT.md`` and ``SECURITY.md`` are now excluded too."
