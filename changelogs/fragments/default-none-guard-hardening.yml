---
bugfixes:
  - >-
    scripts/check-default-none-template.sh - stop matching the pattern inside B(comments).
    This project documents the ``| default(none)`` hazard extensively, and both
    C(roles/amt_baremetal_install/tasks/validate.yml) and the role's integration target quote
    the offending shape verbatim in prose to explain it. The guard flagged those comments, so
    writing the trap down tripped the check that exists because of it -- which would have
    taught contributors to stop writing it down.
  - >-
    scripts/check-default-none-template.sh - key reviewed exceptions by B(name rather than
    line number). The allowlist shipped keyed by C(path:line) and went stale inside one pull
    request: adding a comment block to C(defaults/main.yml) shifted every entry (27 to 73, 34
    to 80, 89 to 145), so the guard failed on exactly the lines it was meant to excuse. A line
    number is not an identity. All six reviewed lines now carry an inline
    C(# default-none-reviewed:) marker -- which the script's own header already recommended --
    so the reason sits beside the line and cannot drift out of alignment. The allowlist is now
    empty by design.
