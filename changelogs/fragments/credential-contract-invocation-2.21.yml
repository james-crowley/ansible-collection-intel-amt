---
trivial:
  - >-
    tests/unit/plugins/modules/test_credential_contract.py - opt in to the
    ``invocation`` echo the way the executor does, so the credential-censoring
    positive control keeps working on ansible-core 2.21. 2.21 made
    ``invocation.module_args`` conditional on ``_ansible_inject_invocation``; the
    harness did not set it, so all 22 tests raised ``KeyError`` there. Gated on
    the presence of ``inject_invocation`` in core's ``PASS_VARS`` rather than on a
    version number, because 2.17-2.20 reject the flag as an unsupported parameter.
    Module behaviour is unaffected -- censoring itself was never broken.
