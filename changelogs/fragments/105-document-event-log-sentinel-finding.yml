---
minor_changes:
  - >-
    docs/capability-matrix.md - record issue #105 as what it is: a **Tier 3 success**.
    Stage 9 on C(amt-lab-01) (AMT 16.1.30, CircleCI job B(2976), evidence
    C(amt-lab-01-qualify_event_log.json)) read B(223) records against
    C(total_records: 18) and B(found a real defect) -- C(amt_event_log) was counting
    firmware's zero-filled empty record slots as records. The 223 collapse to 13
    distinct values: 9 appearing once, 3 appearing three times, and one all-zero
    record repeated B(205) times, so 9 + (3 x 3) = 18 and B(firmware's counter was
    correct). Recorded as the seventh row of the hardware-defect table at the top of
    the document, because no unit or mock test could have produced it: the mock
    derived both the C(GetRecords) record array B(and) the container's own
    C(CurrentNumberOfRecords) from one list, so the two could not disagree there,
    and the defect is only visible when they do. C(amt-lab-02) (AMT 19.0.5) passed
    the identical stage cleanly, 110 records, C(records_read == total_records) -- the
    difference is the B(log's state), a cleared-then-partially-refilled log, not the
    firmware version, and the document says so explicitly so nobody files it as
    version-specific. The event-log B(decode) is unaffected and stays hardware-proven
    on both generations (205 records on 16.1.30 in pipeline 208, 110 on 19.0.5 in
    pipeline 226); what was wrong is B(accounting), not decoding, and that distinction
    is stated rather than left for a reader to infer.
  - >-
    docs/capability-matrix.md - B(record permanently that the scary hypothesis was
    refuted.) The leading explanation for the 205 was that C(GetRecords) serves
    records C(ClearLog) deleted, which would have made every post-clear read
    untrustworthy, would have made stage 10's confirmation re-read meaningless, and
    would have needed a standing warning in
    M(james_crowley.intel_amt.amt_log_clear)'s documentation. B(It was tested and
    disproven): zero of the 205 pre-clear archived records appear anywhere in the read,
    and the padding entries are all zero and carry nothing that was in the log before
    the clear. The mechanism is B(padding, not stale data.) The arithmetic that made
    it plausible is recorded alongside the refutation rather than dropped --
    C(records_read - total_records) = 223 - 18 = 205, exactly the archived count,
    reproduced twice -- as a coincidence of the padding count necessarily equalling
    the freed-slot count. Written up plainly and in the tier document rather than only
    in a commit message, because a refuted hypothesis that is never written down gets
    repeated as fact.
  - >-
    docs/capability-matrix.md - stage 9 is now a two-machine row; C(amt_event_log)
    joins the rest of Tier 3 at two firmware generations. The Tier 3 run list gains a
    sixth run, the Tier 2 subsection is retitled off "on machine 1", and the Tier 4
    backlog entry that covered both log modules on machine 2 B(half closes): what is
    left is C(amt_log_clear) on machine 2 and, with it, whether AMT 19.0.5 pads freed
    record slots at all -- machine 2 has only ever been read on a log nobody had
    cleared. The sixth run's citation is deliberately the thinnest in the tier: job
    2976 is cited with B(no) workflow UUID and B(no) pipeline number, because neither
    was captured and this document does not reconstruct an identifier from the fact
    that 226 came earlier. Its evidence filename is named instead.
  - >-
    docs/amt_event_log.md - new "Empty record slots are not records" section: what
    firmware does (a zero-filled 21-byte entry per slot a C(ClearLog) freed, uncounted
    in C(CurrentNumberOfRecords)), and B(exactly what a caller on 0.7.0 or earlier
    saw) -- C(records_read) larger than C(total_records), which is the one comparison
    the same document tells you to use to detect truncation; entries in RV(records)
    with no timestamp, no entity, no severity and no event data that decoded without
    error; and any Jinja counting or grouping over RV(records) skewed by one entry per
    record the last clear archived. Documents the new RV(empty_slots) return value,
    that a non-zero value is normal rather than a fault, that the sentinel test is all
    21 bytes zero and nothing weaker, and that the padding is measured on B(one)
    generation in B(one) log state with no source describing it anywhere -- which is
    why empty slots are skipped rather than treated as end-of-data.
  - >-
    docs/amt_log_clear.md - new "A read after a clear is trustworthy -- this was
    tested, not assumed" section. This module B(deliberately does not gain) a
    "post-clear reads are unreliable" warning, and the reason is stated positively:
    that claim was measured and disproven, so a warning would enshrine the refuted
    explanation as a caveat. Also records the two practical consequences -- that
    RV(records_after) was never exposed to the #105 defect, because it reads
    C(CurrentNumberOfRecords) from the log container rather than counting returned
    records (firmware reported 18 while the read returned 223 entries, and firmware
    was right), and that a non-zero RV(empty_slots) on the next
    M(james_crowley.intel_amt.amt_event_log) read is expected after a clear.
  - >-
    docs/testing.md - the stage 9/10 hardware claims said "once, on one machine",
    which is no longer true for stage 9, and the run list had no entry for the run
    that found #105. Both corrected. Adds an explicit statement that B(a failing
    qualification stage is the tier working) -- stage 9's failure is the reason #105
    exists -- so "stage 9 failed" is not read as a hardware-tier problem to tidy away.
    The "a shared misunderstanding between implementation and mock passes both" bullet
    now cites #105 as the second recorded instance after the C(wake_on_lan_capable)
    inversion, and the sharper of the two, since the mock's agreement with the code
    was B(structural) -- one list feeding both the record array and the count -- rather
    than a matter of understanding.
