---
bugfixes:
  - "amt_info - RV(amt.network.wake_on_lan_capable) returned the B(inverse) answer on mains-powered hardware in 0.2.0 and
    0.3.0. It was derived from C(LinkPolicy) containing V(16), described as a I(network link always on) bit. V(16) is in
    fact I(available on S0 DC) - powered on, running on battery - so the field actually tested whether the endpoint stays
    reachable on battery, and returned V(false) for every mains-powered desktop that should have read V(true). It is now
    derived from the presence of an B(Sx) value, V(14) (Sx AC) or V(224) (Sx DC), which is what I(the link is maintained
    while the host is asleep, hibernating or off) actually means. B(Anyone who branched on this field in 0.2.0 or 0.3.0
    should re-read it): a playbook that skipped a remote power-on because the endpoint looked unwakeable was most likely
    skipping it on a machine that was wakeable all along."
  - "amt_info - RV(amt.network.link_policy_names) decodes three of its five values differently, so B(stored or asserted
    output from 0.2.0 and 0.3.0 will not match). V(14) is now V(sx_ac) (was V(s0_dc)) and V(16) is now V(s0_dc) (was
    V(always_on)); V(224) is newly recognised as V(sx_dc); and V(2)/V(15), previously named V(sx_ac)/V(sx_dc), are not
    defined values in Intel's enum at all and now render as V(unknown(2))/V(unknown(15)). They are still reported raw in
    RV(amt.network.link_policy) rather than dropped - inventing names for undefined values is what caused this bug.
    Both lab machines report C(link_policy) V([1, 14]), so their C(link_policy_names) changes from
    V([s0_ac, s0_dc]) to V([s0_ac, sx_ac]) and their C(wake_on_lan_capable) from V(false) to V(true)."
  - "plugins/module_utils/models.py - the C(LinkPolicy) value table came from C(parmstro/intel_amt)'s constants file and
    was wrong in three of its five entries, with a fourth value missing. It is replaced with the vendor table from
    C(device-management-toolkit/go-wsman-messages) C(pkg/wsman/amt/ethernetport) (tag C(v2.48.3)):
    V(1) = available on S0 AC, V(14) = available on Sx AC, V(16) = available on S0 DC, V(224) = available on Sx DC, and no
    other defined value. There is no I(always on) value; that entry was invented. The module-internal constant
    C(LINK_POLICY_ALWAYS_ON) is gone, replaced by C(LINK_POLICY_S0_AC)/C(LINK_POLICY_SX_AC)/C(LINK_POLICY_S0_DC)/
    C(LINK_POLICY_SX_DC). C(module_utils) is not a supported interface, so this is not listed as a breaking change - but
    anything importing that name will need updating."
  - "NOTICE / docs/protocol-notes.md / docs/capability-matrix.md - re-attribute the C(LinkPolicy) table to
    C(go-wsman-messages) and move it to Tier 1 (vendor-sourced), keeping the C(parmstro) attribution for what that
    source genuinely supplied: class names, ResourceURIs, selector strings and property names. Record explicitly that
    their C(LinkPolicy) table was wrong. This is the B(second) wrong table from that source - their power constants
    already map C(reset) to CIM code 11 (Diagnostic Interrupt/NMI) rather than 10 (Master Bus Reset) - so a third one
    should not be trusted without checking it against a vendor reference or a firmware fixture."
  - "docs/amt_info.md / docs/capability-matrix.md - rewrite the C(wake_on_lan_capable) sections. The old text presented
    V(false) on both lab machines as the operationally interesting finding, and hedged it with a caveat that the value
    table was third-party and should be confirmed via the AMT Web UI. The caveat was correct that the table could not be
    trusted and wrong about what to do next: the vendor reference settles it and was one request away. The MEBx screen on
    one lab machine has since been read - C(ME ON in Host Sleep States) is the wake-capable option and C(Idle Timeout) is
    V(65535), matching the reported RV(amt.idle_wake_timeout) - so firmware configuration and the corrected table agree,
    and it was this collection's derivation that disagreed with both."
  - "docs/capability-matrix.md - the Tier 4 entry I(whether either endpoint answers WS-Man while powered off) is rewritten
    rather than removed. It is still untested: no stage powers a machine off, independently confirms it, and then tries to
    reach it. What changed is that the evidence now points towards reachability instead of against it, which is weaker
    than a measurement and is recorded as such. This also resolves a result the document previously called hard to square
    - machine 1's stage 4 performed an C(off) transition and then a successful restore, which fits an endpoint that is
    reachable while off on AC exactly as V(14) says it is."
