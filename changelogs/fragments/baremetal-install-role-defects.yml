---
minor_changes:
  - "``amt_baremetal_install`` role - add C(amt_baremetal_install_media_port), the IDE-R/redirection-plane port for the
    media phase, falling back to a conventional C(amt_media_port) inventory variable like the role's other connection
    options. C(tasks/attach_media.yml) forwarded every connection option to M(james_crowley.intel_amt.amt_media) except
    C(port), and the role had no media-port variable at all, so an IDE-R session could only ever reach the stock
    redirection ports (V(16995) with TLS, V(16994) without) -- an operator whose endpoints redirect elsewhere could not
    use the role. Note this is deliberately a separate variable from C(amt_baremetal_install_port), which addresses the
    WS-Man plane (V(16993)/V(16992)): reusing that one would silently aim redirection traffic at the management port."

bugfixes:
  - "``amt_baremetal_install`` role - remove the second fan-out assertion in C(tasks/validate.yml)
    (C(ansible_play_batch | length == 1)), which the code described as \"a second, independent guard\" and which was
    neither. Ansible builds C(ansible_play_batch) and C(ansible_play_hosts_all) from one inventory query differing only
    in whether the C(serial:) batch restriction is honoured, so the batch is always a subset of the roster and the batch
    assertion could not fail unless the roster assertion already had. Worse, its failure message advised setting
    C(serial: 1), which reads as though serialising a multi-host play would make this role safe to run -- it does not,
    because the roster check ignores batch restrictions. The surviving roster assertion carries the entire guarantee and
    now reports the batch count as a diagnostic, so no information is lost. The integration target asserts the
    counterfactual directly: in a two-host C(serial: 1) play the removed assertion's predicate holds while the roster
    assertion is the one that fires."
  - "``amt_baremetal_install`` role - claim and persist the IDE-R C(session_id) in run state *before* invoking
    M(james_crowley.intel_amt.amt_media), instead of recording it from a successful attach's result. C(amt_media)'s
    C(state=attached) forks a detached daemon that owns the redirection connection and outlives a failed attach, and it
    generates its own session id when the caller passes none -- which this role did on any fresh run. So a failed attach
    left run state with C(session_id: null), C(tasks/detach_media.yml)'s C(when: ... is truthy) skipped, and the role
    orphaned the very daemon whose existence the failure was reporting. IDE-R being single-session, that orphan also
    blocked the next attempt against the same endpoint. The C(always) detach in C(tasks/main.yml) now fires on every
    attach outcome, including a timeout reported as C(indeterminate), for which this collection's contract is to re-probe
    rather than retry -- and C(state=detached) is a probe, never a retry. C(media_attached) is still set only after a
    confirmed attach, so a failed attach cannot look like a successful one to a resumed run."
  - "``amt_baremetal_install`` role - report the media C(session_id), its C(runtime_dir) and a manual-detach hint in
    C(tasks/record_failure.yml)'s failure output. The C(always) detach covers every case except a detach that itself
    fails or exceeds C(detach_timeout); in that one case an operator previously had no way to name the stranded IDE-R
    session, which for a single-session protocol also blocks the next attempt. Neither value is a credential."
  - "``amt_baremetal_install`` role - stop defaulting C(amt_baremetal_install_handoff_host) to
    C(amt_baremetal_install_host). That is the AMT *management* address, while the role's own comment instructed callers
    to point the variable at whatever the freshly installed OS answers on -- and whether AMT shares the host's address or
    has its own is a per-deployment provisioning choice the role cannot see. The consequence of guessing wrong was a full
    C(amt_baremetal_install_handoff_timeout) (default V(3600) seconds) of waiting *after* the destructive boundary, on a
    machine that may well have installed correctly. C(tasks/validate.yml) now requires the variable explicitly whenever
    C(amt_baremetal_install_wait_for_handoff) is true, and refuses before probe, attach or reset. This is the same class
    of defect as the historical regression where connection variables defaulted to C(inventory_hostname), inverted."

breaking_changes:
  - "``amt_baremetal_install`` role - C(amt_baremetal_install_handoff_host) no longer defaults to
    C(amt_baremetal_install_host) and is now required whenever C(amt_baremetal_install_wait_for_handoff) is true (which
    is the default). A play that relied on the old default now fails in C(tasks/validate.yml) before anything is
    contacted, rather than after the reset. To restore the previous behaviour exactly, set
    C(amt_baremetal_install_handoff_host: \"{{ amt_baremetal_install_host }}\"); for a conventional inventory the
    intended value is usually C(\"{{ inventory_hostname }}\"); or set
    C(amt_baremetal_install_wait_for_handoff: false) to skip the hand-off wait entirely. Callers that already set the
    variable, or that disable the wait -- including both hardware qualification stages that drive this role -- are
    unaffected."
