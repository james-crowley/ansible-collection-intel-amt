---
minor_changes:
  - >-
    amt_info - each C(CIM_Chassis) and C(CIM_Card) read now carries a per-property B(shape census)
    on the operation receipt: C(operation.hardware_reads.<class>.property_shapes), a mapping from
    the property name firmware sent to one of V(absent), V(empty), V(text), V(nested) or
    V(repeated). B(Names and shapes only -- no property value appears there, in any form.) This
    exists to make issue #84 answerable instead of guessable. C(models.optional_str()) maps B(four)
    different findings onto one V(null) -- the element was absent, present but empty, carrying child
    elements, or repeated -- and every evidence artifact this project publishes is already-parsed
    module output, taken after that collapse, so no amount of re-reading it could recover the
    distinction. The five states are exhaustive over the ways a scalar fact arrives V(null) from a
    class that answered, because they are exactly the inputs that coercion refuses; V(nested) and
    V(repeated) are the two that would mean firmware sent a value and B(this collection dropped
    it), which is a defect here rather than a firmware limitation. Both C(#84) candidates are
    served over a real socket by the mock (C(run_wsman_mock.py --baseboard-serial
    {populated,empty,absent})), so the mechanism is exercised end to end rather than only against a
    mocked parser.
  - >-
    amt_info - the shape census deliberately needs B(no raw SOAP body), which C(docs/amt_info.md)
    and C(docs/capability-matrix.md) both previously said was required to settle issue #84. Both
    have been corrected rather than quietly edited: C(wsman._element_to_value()) already preserves
    the distinction (an omitted element has no key in the parsed instance; a present-but-empty one
    has a key holding an empty string), and it survives right up to the C(from_instance) call that
    destroys it -- so the census is taken there, one line earlier. A raw body would have answered
    the question by publishing B(everything), including values the evidence redactor has never been
    shown; this answers it by publishing nothing. No length, no prefix and no hash either: a hash
    of a serial from a known vendor prefix is a guessable oracle, which is the same reasoning
    C(redact-evidence.py) already applies to hashing an address.
  - >-
    amt_info - the census is scoped to the two single-instance classes, and both reasons are on the
    record. A census is a statement about B(one) instance, so a multi-instance class would need one
    per DIMM or disk and the receipt would grow with the machine rather than with the question --
    and C(CIM_Chassis)/C(CIM_Card) are exactly the pair whose asymmetry is the open question
    (C(baseboard.serial_number) V(null) on both lab machines while C(chassis.serial_number)
    populates, across AMT 16.1.30 and 19.0.5), so having both censuses side by side in one receipt
    B(is) the finding. A property name firmware sent that this collection never reads is included
    too, because "the board serial arrives under a property we do not look at" is a live hypothesis
    for #84 and the census is the only place it would be visible.
  - >-
    amt_info - a property name is published only if it matches the CIM property-name grammar (a
    letter, then letters, digits and underscores, 64 maximum, per DSP0004); anything else is
    counted in C(operation.hardware_reads.<class>.property_names_dropped) instead. A census key is
    the B(one) place firmware-supplied text becomes a JSON key in this module's output, and
    C(tests/hardware/redact-evidence.py) never rewrites keys by a deliberate design decision that
    renaming a key corrupts the structure the redaction exists to keep readable. Safety there
    therefore cannot come from the redactor and comes from the grammar: every identifying category
    that script knows about needs a character the grammar forbids, or exceeds its length. The count
    is an integer, which the redactor leaves alone and which cannot identify anything, and a
    non-zero value means a firmware sent a shape nobody has seen and it should be looked at
    interactively.
  - >-
    tests/hardware/qualify_readonly.yml - stage 1b now prints the shape census for both
    identity-plate classes and B(asserts) it: that both classes carry one, that every value in it
    is one of the five shapes, that no property name was withheld, and that a V(null)
    C(serial_number) is never accompanied by a census claiming V(text). That last check is what
    makes the evidence self-checking, which is the property the first run of this stage lacked --
    it reported four fact groups as absent on both machines and nothing in the output could
    contradict it. The block sits B(after) the evidence file is written, unlike the read-outcome
    cross-check above it: this stage exists to produce an artifact, and an assertion that fails
    before the artifact is written destroys the evidence someone would need to understand the
    failure. Every lookup in its messages is render-safe for a reason worth recording -- C(assert)
    finalises both C(fail_msg) and C(success_msg) before it evaluates a single condition, so a
    C(success_msg) that cannot be templated replaces the real failure with a template error, which
    is exactly the "structurally incapable of reporting itself" shape of C(#85). The strictness
    lives in the conditions, which use no C(default) at all.
bugfixes:
  - >-
    tests/hardware/redact-evidence.py - stop censoring the per-property shape census. The census is
    keyed by CIM property name, which puts the literal string C(SerialNumber) in B(key) position,
    and C(serialnumber) is in C(_IDENTIFYING_KEYS) -- so the script rewrote the B(shape) V(absent)
    to C(<redacted-serial-1>) and the artifact stopped saying the one thing the census was added to
    say. Observed, not hypothesised: that is what the first draft of this pair of changes did, and
    a unit test now pins it. This is the third instance of B(over-redaction) being the failure to
    guard against in this file, and the worst-behaved of the three -- a reader would see a
    plausible token and have no way to know a diagnostic had been destroyed, exactly as the
    C(raw_hex) and C(action) exemptions already warn. The exemption is scoped two ways so it cannot
    become a hole, and both are covered by a negative control: by B(container), only strings
    directly inside a mapping under C(property_shapes), handled as a unit rather than by threading
    a flag down the walk so the one-level scope is structural; and by B(closed vocabulary), only
    the five shapes C(amt_info) can emit, so a real serial (caught by key) or an address (caught by
    pattern) appearing in census position is still redacted. The vocabulary duplicates
    C(hardware.PROPERTY_SHAPES) rather than importing it, because this script is deliberately
    stdlib-only and runs from the system C(python3) at a point in CI where the collection may not
    be installed -- an import would make redaction depend on a successful install -- and two tests
    pin the copies to each other and to a field C(ClassRead) actually has.
  - >-
    tests/hardware/qualify_readonly.yml - the stage 1b census guard names the offending B(property
    names) in its failure message and never the values. One of the things that check catches is a
    firmware value reaching the census, and a message that dumped the census to prove it would
    print that value into the job log -- a leak guard that leaks. CircleCI masks context values in
    log output, and a serial number is not a context value; it comes from firmware.
