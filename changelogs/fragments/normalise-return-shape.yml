---
breaking_changes:
  - "amt_boot, amt_redirection, amt_media - the ``intel-amt-operation/v1`` receipt (``schema``, ``action``, ``endpoint``, ``previous``, ``desired``, ``observed``, ``tls_peer_fingerprint``, and the success-path ``error_class``) is now nested under an ``operation`` key on every module, matching the shape ``amt_power`` already used. It was previously spread directly at the top level of these three modules' results, which meant a caller could not write one helper that reads ``error_class``/``tls_peer_fingerprint`` from any module in the collection -- exactly the defect tracked as issue #22. Module-specific return values (for example ``amt_boot``'s ``device``/``boot_config_selector``/``boot_source_selector``, ``amt_redirection``'s ``supported``/``enabled``/``transport_reachable``, and ``amt_media``'s ``session_id``/``session_state``/``devices``/``bytes_read``/``bytes_written``) are unaffected and remain at the top level. A failed module's result is unaffected by this change: ``error_class`` still surfaces at the top level of ``fail_json``, since that is what Ansible itself surfaces and what rescue blocks read via ``ansible_failed_result.error_class``."
  - "amt_info - now returns a non-secret ``intel-amt-operation/v1`` receipt under an ``operation`` key, for parity with the other four modules. It is read-only (``operation.action`` is always ``get_facts``, ``operation.changed`` is always ``false``), and ``operation.previous``/``operation.desired``/``operation.observed`` are always ``null`` -- a read has no prior, intended, or separately-observed state to report beyond what the existing ``amt`` return key already carries."
