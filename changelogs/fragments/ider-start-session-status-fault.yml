---
trivial:
  - >-
    tests/integration/mock_servers/run_ider_mock.py,
    tests/unit/mock_servers/test_ider_server.py,
    tests/integration/targets/amt_media - drive
    ``IderMockServer.start_session_status`` to a non-zero value from a test for the
    first time. The knob was fully wired in the mock (accepted as a constructor
    argument, stored, sent in the ``0x11`` StartRedirectionSessionReply, and checked
    to decide whether to abort the handshake) but nothing anywhere ever set it away
    from its zero default, so the client-side handling of a refused redirection
    session -- ``RedirectionSession._read_start_session_reply`` raising a classified
    ``ProtocolError`` naming the status byte -- had never actually run against the
    mock. Added a ``--start-session-status`` CLI flag on the standalone runner, a
    unit test that drives the real client against the mock and asserts the raised
    error is ``ProtocolError`` (not a hang, and not misclassified as
    ``authentication``) and carries the status byte decoded off the wire, and a
    lettered integration scenario (F) in the ``amt_media`` target proving the same
    thing through the module boundary: ``error_class: protocol``,
    ``session_state: error``, no bytes moved. Module behaviour is unchanged --
    the classification code already existed; only the path to exercise it was
    missing.
