---
trivial:
  - >-
    CI now runs ``sanity`` against every currently-supported ansible-core release
    (2.19, 2.20, 2.21) in addition to the two EOL releases ``requires_ansible``
    still declares, and adds unit-test cells for 2.21. ``requires_ansible`` is
    unchanged, so nothing changes for consumers.
  - >-
    Added a weekly, advisory ``sanity-devel`` job that runs sanity against
    ansible-core's ``devel`` branch. It is deliberately kept off the pull-request
    path -- the collection requirements accept a weekly schedule, and a check that
    goes red for upstream reasons contributors cannot act on would only train
    people to ignore red checks. Its value is lead time on new sanity
    requirements, which land in ``devel`` first.
