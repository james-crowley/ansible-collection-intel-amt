---
minor_changes:
  - >-
    CI - wire hardware qualification stages 4-7 (``qualify_power``, ``qualify_media_attach``,
    ``qualify_writable_image``, ``qualify_pxe``) into the ``hardware`` workflow as four new jobs
    (``hardware-power``, ``hardware-media``, ``hardware-writable``, ``hardware-pxe``), each
    escalating past the last and each behind its own independent ``type: approval`` job, so a
    human confirms every escalation separately rather than one approval covering everything from
    a power-cycle through arming a native PXE boot. All four keep the ``amt-lab-runner`` context
    and the main-branch filter. Stage 7's ``amt_pxe_prereqs_confirmed`` attestation is wired to a
    new ``pxe-prereqs-confirmed`` pipeline parameter (default ``false``), not hardcoded ``true``,
    so it has to be a fresh decision at trigger time.
  - >-
    tests/hardware/make-test-media.sh - new script that provisions the small bootable ISO (iPXE's
    own ``ipxe.iso``) and zero-filled writable raw image stages 5 and 6 need, entirely inside the
    workspace. Idempotent and safe to re-run; fails loudly rather than producing a placeholder
    file if the download fails or a size check does not land on a multiple of 512 bytes.
  - >-
    tests/hardware - every stage 4-7 playbook (``qualify_power``, ``qualify_media_attach``,
    ``qualify_writable_image``, ``qualify_pxe``) now has the same block/rescue pattern
    ``qualify_readonly.yml`` already used, surfacing ``error_class``/``endpoint``/``operation``/
    ``indeterminate`` on failure instead of a ``no_log``-censored, undiagnosable one.
    ``roles/amt_baremetal_install``'s own rescue (used by stages 5 and 7) does the same before
    re-raising, so a firmware failure inside the role is diagnosable too. A new
    ``amt_qualify_attended`` variable (default ``true``) gates every interactive
    ``ansible.builtin.pause`` in these playbooks, so they can run unattended in CI -- where
    ``pause`` would otherwise block forever on stdin the machine executor cannot supply -- with
    the corresponding approval job acting as the human checkpoint instead.
  - >-
    tests/hardware/qualify_writable_image.yml - weaken the "bytes actually landed on disk"
    assertion. A BIOS sitting at a boot prompt does not spontaneously write to an attached
    floppy, so ``bytes_written=0`` (nothing booted on the target to issue a write) is now reported
    as a legitimate, expected outcome rather than a failure. What is still asserted every run:
    the image is accepted and attached, and the device is presented to the guest as writable
    (the MODE_SENSE write-protect bit is ``0x00``, not ``0x80``). A non-zero ``bytes_written`` is
    still cross-checked against the on-disk checksum, since that combination disagreeing would be
    a real bug.
  - >-
    tests/hardware/qualify_pxe.yml - assert that ``AMT_BootSettingData`` reads back unchanged
    after the one-time PXE boot's reset, in addition to confirming the arm reads back armed and
    the reset is issued and recovered. Documented plainly, in both the playbook and
    ``tests/hardware/README.md``, that this does not read Intel AMT's internal one-shot
    (``IsNextSingleUse``) role bit -- no module in this collection exposes a getter for it -- and
    that netboot succeeding is outside this playbook's authority to verify, since it depends on
    DHCP/boot-service infrastructure this collection cannot observe.
