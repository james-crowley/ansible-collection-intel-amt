---
minor_changes:
  - "Add per-module reference pages under C(docs/) for M(james_crowley.intel_amt.amt_info),
    M(james_crowley.intel_amt.amt_power), M(james_crowley.intel_amt.amt_boot),
    M(james_crowley.intel_amt.amt_redirection), and M(james_crowley.intel_amt.amt_media),
    each covering options, return values, examples, idempotence/check-mode behaviour,
    error classes, and known limitations, verified against the argument specs and
    rendered C(ansible-doc) output rather than written from memory
    (https://github.com/james-crowley/ansible-collection-intel-amt/issues/10)."
  - "Add C(docs/capability-matrix.md), distinguishing what is verified against an
    authoritative firmware/reference source, what is only unit/mock tested, and what
    has not been verified against real firmware at all, plus a firmware-generation
    compatibility table marking inferred rows and the known open risks (issue number 13's
    WS-Addressing EPR byte-form ambiguity, the reset-during-write IDE-R deferral gap,
    Small Business Mode's hardware-verified lack of TLS, and C(amt_media)'s
    C(validate_certs)/C(ca_path) divergence from the WS-Man modules)
    (https://github.com/james-crowley/ansible-collection-intel-amt/issues/10)."
  - "Add C(CONTRIBUTING.md) documenting the local verification sequence, the
    C(scripts/setup-collection-tree.sh) staging requirement (it copies rather than
    symlinks, and C(COLLECTION_BUILD_ROOT) must be set when several checkouts stage
    concurrently), conventional commits, the changelog-fragment requirement, and the
    two gates in front of hardware-in-the-loop tests
    (https://github.com/james-crowley/ansible-collection-intel-amt/issues/10)."
bugfixes:
  - "README - fix the unattended-install example playbook referencing
    C(media.operation.session_id), which does not exist: M(james_crowley.intel_amt.amt_media)
    returns RV(session_id) at the top level of its result, not nested under an
    C(operation) key (that nesting is specific to M(james_crowley.intel_amt.amt_power)).
    Corrected to C(media.session_id) in both the boot-arming and detach tasks
    (https://github.com/james-crowley/ansible-collection-intel-amt/issues/10)."
