---
minor_changes:
  - tests/integration/targets/amt_baremetal_install_role - add the first automated test of any kind for the C(amt_baremetal_install) role,
    closing this collection's largest untested surface. The role is 14 task files driving the destructive lifecycle (validate, probe, attach
    media, arm one-time boot, reset, observe, wait for hand-off, detach) and had B(no) integration target and B(no) molecule scenario; it
    appeared only in hardware playbooks behind a manual CI trigger, so nothing exercised it on a pull request. No coverage figure revealed
    the gap because coverage is measured over C(plugins/) only.
  - tests/integration/targets/amt_baremetal_install_role - regression-test both defects hardware qualification found in this role, the worst
    defect density anywhere in the collection. (1) It always issued C(reset). A master bus reset does nothing to a machine that is already
    off, so the role attached media, armed a one-shot boot and reported success having booted nothing; the target now asserts an endpoint
    observed B(off) is sent C(on) and one observed B(on) is sent C(reset), each against its own mock endpoint whose power state is confirmed
    first. (2) Its connection variables defaulted to C(inventory_hostname), and AMT answers on a separate management address, so the default
    silently targeted the wrong endpoint or an unresolvable name; the target now asserts an unset C(amt_host) fails in C(tasks/validate.yml)
    on the exact assertion C(amt_baremetal_install_host is truthy) rather than reaching a connection at all, and that a set one resolves from
    C(amt_host) while C(inventory_hostname) is a different, unresolvable name.
  - tests/integration/targets/amt_baremetal_install_role - cover the role's remaining safety properties across 14 scenarios, each a separate
    nested C(ansible-playbook) process so that play-scoped behaviour is reachable and no scenario inherits another's facts. The fan-out guard
    is proven to refuse a two-host play, with and without a C(serial) of 1 - the guard standing between an operator and power-cycling a whole
    lab, previously untested; C(amt_baremetal_install_confirm_destructive) is proven to gate everything destructive; the C(amt_info) capability
    preflight is proven to refuse an endpoint advertising neither C(AMT_BootCapabilities.IDER) nor C(ForcePXEBoot) B(before) arming or
    resetting anything; media is proven to be detached by the C(always) block after a forced failure both before and after the destructive
    boundary; and the per-target run-state file is proven to be written C(0600), to refuse a silent resume past an unconfirmed boot/reset, to
    proceed with C(amt_baremetal_install_force_resume=true) and re-arm with a fresh token, and to start from a clean slate after a confirmed
    prior run. C(amt_baremetal_install_wait_for_handoff) is exercised for the first time anywhere - both hardware stages that drive this role
    set it C(false), so that phase had never run.
  - tests/integration/targets/amt_baremetal_install_role - runs against local mock WS-Man servers only, with no hardware, no network beyond
    C(127.0.0.1) and C(HOME) redirected into the target's scratch tree so no scenario can reach the role's real C(~/.ansible/intel_amt/)
    state directories, making it safe on every pull request. Note the target is named C(amt_baremetal_install_role) rather than
    C(amt_baremetal_install) deliberately - ansible-test resolves each target as a collection-qualified role, so a target sharing a name with
    a role in C(roles/) silently runs B(that role) with no assertions instead of the target.
