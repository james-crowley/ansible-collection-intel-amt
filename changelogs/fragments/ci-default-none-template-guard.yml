---
bugfixes:
  - "CI - add C(scripts/check-default-none-template.sh), run in the lint job, failing on a quoted scalar Jinja template
    whose entire value is C({{ ... | default(none) }}) (or C(default(None))) -- the exact shape that renders as the
    empty string rather than C(null) on ansible-core <= 2.18 (2.17 is this collection's declared floor). This is the
    third time that divergence has caused a real defect (issue #80, the 0.6.0 qualification-summary bug, and the role
    connection-guard weakening tracked as
    https://github.com/james-crowley/ansible-collection-intel-amt/issues/87), so this is the regression guard for a
    fourth. It supports a documented per-line opt-out: an inline C(# default-none-reviewed:) comment for a reviewed
    exception in a file the reviewer can edit, or the script's own allowlist for the handful of existing, reviewed
    C(roles/amt_baremetal_install/defaults/main.yml) lines this script's introduction could not annotate inline. The
    legitimate case looks like this: a required value with no viable C(default(omit)) alternative, checked downstream
    with C(is truthy) rather than C(is none)/C(is not none) -- V(is truthy) treats an empty string exactly like C(None),
    so the divergence this script exists to catch does not matter there."
