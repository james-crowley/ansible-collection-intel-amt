---
minor_changes:
  - amt_boot - new module that arms a one-time boot device selection (``pxe``, ``hdd``, ``cd``, ``bios``, ``ider_floppy``, ``ider_cdrom``) using the exact five-step ``AMT_BootSettingData`` / ``CIM_BootConfigSetting`` / ``CIM_BootService`` sequence documented in this collection's protocol notes, with mandatory discovery before any mutation and a required per-call ``action_token`` that is never re-armed automatically (https://github.com/james-crowley/ansible-collection-intel-amt/pull/13).
  - amt_redirection - new module that reports Intel AMT redirection-service support, enablement, and TCP reachability as three separate signals, and optionally mutates enablement via ``AMT_RedirectionService.RequestStateChange``; read-only by default and never attaches or streams media (https://github.com/james-crowley/ansible-collection-intel-amt/pull/13).
  - "plugins/module_utils/boot.py - data-driven allow/deny-list Put-body construction for ``AMT_BootSettingData``, deleting the fields newer firmware rejects when echoed back and zeroing ``UefiBootNumberOfParams`` when present (https://github.com/james-crowley/ansible-collection-intel-amt/pull/13)."
  - plugins/module_utils/redirection_service.py - WS-Man view of redirection-service capability/enablement plus an injectable TCP reachability probe, kept separate from the stateful IDE-R/SOL session transport (https://github.com/james-crowley/ansible-collection-intel-amt/pull/13).
