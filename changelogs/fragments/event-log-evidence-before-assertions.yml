---
bugfixes:
  - >-
    tests/hardware/qualify_event_log.yml - write the evidence artifact B(before) the
    assertions rather than after them. The stage recorded evidence as its last task, so a
    failing assertion aborted the play and destroyed the artifact needed to diagnose it.
    That is not hypothetical: on C(amt-lab-01) in CircleCI pipeline 226 the accounting
    assertion fired (C(records_read=223) against C(total_records=18), issue #105), and the
    223 records that would have identified B(which) number was wrong were never written, so
    a second run was needed to learn only that the numbers reproduce. The evidence for a
    failure is worth more than the evidence for a pass, and ordering it last guaranteed only
    the latter was kept.
  - >-
    .gitignore - ignore C(.ansible/), which C(ansible-lint) materialises locally to make the
    checkout resolvable as its own collection (the same symlink the CI lint job creates).
    Untracked and unignored, it showed up as a pending change and drew C(yamllint) into
    scanning a copy of C(changelogs/changelog.yaml) through the symlink.
