minor_changes:
  - amt_media - new module that attaches a bootable read-only ISO and/or a writable answer image over IDE-R, and detaches a previously attached session. An IDE-R session is a long-lived process, so ``state=attached`` forks a detached background daemon that owns the connection, writes a small JSON state/receipt file keyed by ``session_id``, and returns once that daemon has reported success or an early failure; ``state=detached`` looks the daemon up by the recorded pid and asks it to stop. Credentials reach the daemon only as in-memory arguments across the fork -- never via argv or the environment, since no process is ever spawned or exec'd (https://github.com/james-crowley/ansible-collection-intel-amt/issues/7).
  - "plugins/module_utils/media_session.py - the detached-session lifecycle this module builds on: double-fork daemonization, an atomically-written state file, pid-liveness-based staleness recovery, and pre-spawn media validation shared between check mode and real attach (https://github.com/james-crowley/ansible-collection-intel-amt/issues/7)."
  - plugins/module_utils/redirection.py - add ``RedirectionSession.set_recv_timeout()`` (so a long-lived caller can wake periodically without busy-polling) and ``peer_certificate_sha256()`` (best-effort TLS peer fingerprint, mirroring ``tls.peer_certificate_evidence()`` for the WS-Man transport) (https://github.com/james-crowley/ansible-collection-intel-amt/issues/7).
  - "Add integration test targets for amt_info, amt_power, amt_boot, amt_redirection, and amt_media, driving the real modules against the mock WS-Man and IDE-R fixture servers over both plaintext and TLS with a pinned fingerprint, including idempotence, check-mode, a per-module fault-injection case, and (for amt_media) a multi-frame write verified byte-for-byte on disk (https://github.com/james-crowley/ansible-collection-intel-amt/issues/8)."
bugfixes:
  - "tests/integration/mock_servers/wsman_server.py - AMT_BootCapabilities now answers Enumerate as well as Get. amt_boot's discover_and_validate() and redirection_service.py's get_capabilities() both reach it via Enumerate+Pull (it has no natural instance key for a Get SelectorSet); the mock only implemented the Get form used by amt_info's facts-gathering path, which every prior unit test masked by mocking WsmanClient.enumerate() directly instead of exercising this server (https://github.com/james-crowley/ansible-collection-intel-amt/issues/8)."
