---
security_fixes:
  - "CI - move the self-hosted lab runner's hardware-qualification virtualenv off ansible-core 2.17 and onto
    ``ansible-core~=2.18.18``. The 2.17 line is affected by GHSA-w8p5-mx5w-cpqj [HIGH] -- argument injection in
    ``ansible-galaxy role install`` leading to arbitrary code execution -- and that line is EOL, so no 2.17 release will
    ever carry the fix. 2.18.18 is the first release that does. The pin had been held at 2.17 only because the runner
    host had nothing but Python 3.10 and ansible-core 2.18+ requires 3.11+ on the controller; the host now has Python
    3.12, so the blocker is gone rather than merely accepted. Nothing changes for consumers -- ``requires_ansible``
    stays at ``>=2.17.0``, which is a floor and not a pin."
minor_changes:
  - "CI - build the lab runner's qualification virtualenv from an explicitly versioned Python interpreter instead of
    bare ``python3``, which on that host is still the system Python 3.10 and cannot run ansible-core 2.18 at all. The
    command prefers ``python3.12``, falls back to ``python3.11``/``python3.13``, and fails immediately -- naming what
    it looked for and what it found -- when none of them exists, rather than letting the problem surface forty lines
    later as a pip resolution error nobody can debug without logging into the host. It echoes the interpreter it chose
    and that interpreter's version, so every job log records which one actually ran. 3.12 rather than the newest
    available Python for two reasons: ansible-core 2.18's supported controller range ends at 3.13, and 3.12 is also the
    newest version that can still run ansible-core 2.17, the collection's declared floor."
  - "renovate.json - drop the ``allowedVersions: '<2.18'`` cap on ansible-core. Its own documented removal condition,
    the lab runner host being on Python 3.11 or newer, is now met, so the cap no longer suppresses anything and the
    risk-acceptance note explaining it has been removed rather than left behind as stale warning text. Renovate will
    now raise 2.18+ updates for the hardware pin and list them on the Dependency Dashboard."
  - "renovate.json - repair the custom regex manager for the hardware ansible-core pin. Its pattern assumed a trailing
    literal ``.0`` (``ansible-core~=(?<currentValue>\\d+\\.\\d+)\\.0``) and so matched nothing once the pin became
    2.18.18, which would have left the only ansible-core version Renovate can see silently unmanaged, with no error
    anywhere to reveal it."
