---
trivial:
  - >-
    tests/integration/mock_servers/wsman_server.py - documentation only, no behaviour
    change. ``_boot_source_items``' docstring claimed the ``count > len(BOOT_SOURCE_NAMES)``
    branch existed "so a test can make discovery *ambiguous*". It cannot: the branch suffixes
    each synthesised label with ``" (<idx>)"``, so every ``InstanceID`` stays distinct and a
    client matching on equality still finds exactly one. Corrected to say what the branch
    actually produces -- a near-miss neighbour per known name, which catches prefix/substring
    matching -- and to spell out that the *below*-``len`` direction is the one that reaches
    the "absent" verdict. Also documented ``boot_source_count`` on ``AmtState`` and
    ``page_size`` on ``WsmanMockServer``, in each case naming which values are worth
    passing and why, since "the default already exercises this" was true of ``page_size`` and
    is exactly what made the missing boundary coverage hard to see.
