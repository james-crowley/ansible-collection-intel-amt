# ---------------------------------------------------------------------------
# Connection options. These map 1:1 onto the shared `connection` doc fragment
# every module in this collection extends (plugins/doc_fragments/connection.py).
#
# Each falls back to the conventional `amt_*` inventory variable of the same
# name, which is what this collection's README, docs/ examples, and
# tests/hardware/inventory.yml.example all use. That means a conventional
# inventory drives this role with no per-variable mapping, while an explicit
# amt_baremetal_install_* value still wins.
#
# Note amt_baremetal_install_host does NOT fall back to inventory_hostname. It
# used to, and that is wrong for AMT: the inventory hostname is the operating
# system's name, whereas AMT answers on a separate management address, so the
# default silently pointed at the wrong endpoint (or an unresolvable name).
# It resolves via amt_host and otherwise stays unset so validate.yml fails
# loudly.
#
# amt_baremetal_install_password and amt_baremetal_install_tls_fingerprint have
# no default beyond that fallback on purpose: a missing required value must fail
# loudly in tasks/validate.yml, not coerce silently.
#
# amt_baremetal_install_port and amt_baremetal_install_media_port below keep the same
# `default(None)` shape as every other variable here, even though "unset" for either of
# them has to reach amt_info/amt_media/etc. as an *omitted* keyword, not as None. On
# ansible-core <=2.18, a quoted scalar template that evaluates to Jinja's None is
# stringified by finalize, and Ansible's convert_data step only evaluates a template's
# text back into dicts, lists and booleans -- not None -- so `"{{ amt_port |
# default(None) }}"` arrives as the literal string "" on those cores rather than as the
# value None. amt_port and amt_media_port are `type: int` at the module boundary, so an
# empty string is not "unset", it is a type error: "argument 'port' is of type <class
# 'str'> and we were unable to convert to int". An operator on stock ports -- i.e.
# anyone who does not set amt_port -- could not use this role at all on those cores.
#
# The fix is NOT to make these two variables resolve to `omit` here, even though that
# looks like the obvious parallel to the rest of this file. Tried and measured: doing
# so makes the *stored role variable itself* hold Ansible's omit placeholder whenever
# amt_port/amt_media_port are unset, and what that placeholder actually is differs by
# core. On <=2.18 it is a harmless literal string (`__omit_place_holder__<hash>`),
# because Ansible's stringify-then-convert round trip works in `omit`'s favour there
# rather than against it. On >=2.19, native Jinja templating instead preserves the
# real `_OmitType` sentinel *object* as the variable's value -- which is fine as long as
# nothing but a module-parameter assignment ever touches it, but this collection's own
# integration target's diagnostic dump (files/nested_play.yml) does exactly that for
# every scenario, via `to_nice_json`, and `_OmitType` is not JSON-serializable: "Object
# of type '_OmitType' is not JSON serializable by the 'tagless' profile." A role
# default that only behaves once, in one specific position, and throws an unrelated
# hard error the moment anything else touches it, is a worse contract than the one it
# would replace.
#
# So these two stay `default(None)` here, matching amt_baremetal_install_host/_password
# above -- "" on <=2.18, real None on >=2.19, exactly like those -- and the actual
# omit conversion happens only at each place that passes the value straight into a
# module's `port` parameter (tasks/probe.yml, tasks/arm_boot.yml, tasks/reset.yml,
# tasks/observe.yml, tasks/attach_media.yml -- both its ports), via
# `| default(omit, true)`. The `true` second argument is what makes that filter treat
# any falsy value -- None *or* "" -- as needing replacement, not only Jinja's Undefined,
# which is what actually closes the gap on <=2.18: `default(omit)` alone only replaces a
# genuinely undefined variable, and amt_baremetal_install_port is always defined here
# (its value is merely falsy). Confining the conversion to those six call sites means
# the omit sentinel is created and consumed within the same task's argument templating
# and never becomes a stored variable value anywhere -- so nothing else in this role or
# any caller of it can observe, forward, or serialize it. Verified end-to-end on 2.17,
# 2.19 and 2.21: an explicit port is preserved (dials it), an unset one falls through to
# the module's own use_tls-dependent default, and the integration target's dump of an
# unset port/media_port is `""`/`null` like every other unset connection variable,
# never the sentinel.
# ---------------------------------------------------------------------------
amt_baremetal_install_host: "{{ amt_host | default(None) }}"  # default-none-reviewed: checked `is truthy`
amt_baremetal_install_port: "{{ amt_port | default(None) }}"  # default-none-reviewed: used via default(omit, true), #87
amt_baremetal_install_username: "{{ amt_username | default('admin') }}"
amt_baremetal_install_password: "{{ amt_password | default(None) }}"  # default-none-reviewed: checked `is truthy`, #87
amt_baremetal_install_use_tls: "{{ amt_use_tls | default(true) }}"
amt_baremetal_install_allow_insecure_transport: "{{ amt_allow_insecure_transport | default(false) }}"
amt_baremetal_install_validate_certs: "{{ amt_validate_certs | default(true) }}"
amt_baremetal_install_ca_path: "{{ amt_ca_path | default(None) }}"  # default-none-reviewed: all consumers truthy
amt_baremetal_install_tls_fingerprint: "{{ amt_tls_fingerprint | default(None) }}"  # default-none-reviewed: checked `is truthy`, #87
amt_baremetal_install_timeout: "{{ amt_timeout | default(30) }}"
amt_baremetal_install_connect_timeout: "{{ amt_connect_timeout | default(10) }}"

# ---------------------------------------------------------------------------
# The single most important variable in this role. Must be explicitly set to
# `true` (e.g. `-e amt_baremetal_install_confirm_destructive=true`) or the role refuses to go
# past validation -- see tasks/validate.yml.
# ---------------------------------------------------------------------------
amt_baremetal_install_confirm_destructive: false

# ---------------------------------------------------------------------------
# Which one-time boot provider arms the destructive reset.
#
#   ider_cdrom - boot from IDE-R virtual media this role attaches (the
#                Proxmox VE worked example in README.md). Requires
#                amt_baremetal_install_iso_path and/or amt_baremetal_install_answer_image_path.
#   pxe        - arm native one-time PXE boot. Skips the media phase
#                entirely. Requires DHCP/boot-service prerequisites this
#                role cannot verify -- see tests/hardware/README.md stage 7.
#
# Native PXE and IDE-R boot are mutually exclusive by firmware construction
# (see amt_boot's DOCUMENTATION): selecting one boot source overrides the
# other's redirection. This role therefore requires exactly one explicit
# choice and rejects anything else rather than guessing -- see
# tasks/validate.yml.
# ---------------------------------------------------------------------------
amt_baremetal_install_boot_provider: ider_cdrom

# --- amt_baremetal_install_boot_provider: ider_cdrom -----------------------------------------
# Bootable ISO for the read-only CD/DVD slot. The CD/DVD slot is read-only by
# firmware design; there is no writable option for it anywhere in this role
# or the amt_media module it drives.
amt_baremetal_install_iso_path: null
# Raw image for the writable floppy/USB-R slot -- the only slot that can ever
# be opened writable. This is where an unattended installer's answer file
# (e.g. Proxmox VE's answer.toml) lives.
amt_baremetal_install_answer_image_path: null
amt_baremetal_install_answer_image_writable: true
amt_baremetal_install_media_start_mode: on_reboot
# TCP port of the IDE-R/redirection plane -- NOT the WS-Man management port that
# amt_baremetal_install_port above sets. They are different planes on different
# ports (16994/16995 vs 16992/16993), and amt_media speaks the redirection
# protocol directly over socket/ssl rather than WS-Man; see its DOCUMENTATION.
# Left unset, amt_media picks 16995 when use_tls is true and 16994 otherwise,
# which is right for a stock endpoint -- so this exists for endpoints whose
# redirection plane is somewhere else. Until it did, the media phase could not be
# aimed anywhere but the stock ports: an operator whose endpoints redirect on a
# non-default port could not use this role at all.
#
# Falls back to the conventional amt_media_port inventory variable, exactly like
# the connection block above. amt_port is deliberately NOT the fallback: an
# operator who sets amt_port for a non-default WS-Man port would otherwise have
# their redirection traffic silently aimed at the WS-Man port as well.
#
# Kept as `default(None)` -- same reasoning as amt_baremetal_install_port above,
# including why NOT `default(omit)` here despite this being the variable the
# media_failure integration scenario actually exposed: it never sets amt_media_port, so
# on ansible-core <=2.18 the unset value arrived as "" and amt_media's `type: int` port
# argument raised a conversion error before the role's own "outside allowed directory"
# refusal was ever reached. tasks/attach_media.yml applies `| default(omit, true)` at
# the one place this reaches a module parameter, so the conversion happens there and
# this variable's own value stays a plain, serializable None/"" like every other unset
# connection variable.
amt_baremetal_install_media_port: "{{ amt_media_port | default(None) }}"  # default-none-reviewed: used via default(omit, true), #87
amt_baremetal_install_media_allowed_directory: null
amt_baremetal_install_media_runtime_dir: ~/.ansible/intel_amt/media-sessions
amt_baremetal_install_media_attach_timeout: 10
amt_baremetal_install_media_detach_timeout: 15

# --- amt_baremetal_install_boot_provider: pxe -------------------------------------------------
# (no extra variables -- native PXE needs nothing beyond amt_baremetal_install_boot_provider:
# pxe and a working DHCP/PXE boot service on the target's network, which this
# role cannot verify on your behalf.)

# ---------------------------------------------------------------------------
# Postcondition wait: whether/how long to wait for something to answer on the
# target after the reset, before declaring hand-off complete. Point this at
# whatever the freshly installed/booted OS answers on (SSH by default).
#
# amt_baremetal_install_handoff_host has no default, and that is the whole point.
# It used to default to amt_baremetal_install_host -- the AMT *management*
# address -- while the sentence above told the operator to point it at whatever
# the OS answers on. Those are not the same endpoint in general: whether AMT
# shares the host's address or is given its own is a per-deployment provisioning
# choice, and this role cannot see which. So the old default was a plausible
# guess whose failure mode was a full amt_baremetal_install_handoff_timeout
# (3600s) hang *after* the destructive boundary, on a machine that may well have
# installed correctly. tasks/validate.yml now refuses up front instead, whenever
# amt_baremetal_install_wait_for_handoff is true -- see the reasoning there,
# including why this NOT defaulting to inventory_hostname is the right call even
# though inventory_hostname is usually the right value for a caller to pass.
# ---------------------------------------------------------------------------
amt_baremetal_install_wait_for_handoff: true
amt_baremetal_install_handoff_host: null
amt_baremetal_install_handoff_port: 22
amt_baremetal_install_handoff_timeout: 3600
amt_baremetal_install_handoff_delay: 120

# Bounded power-state postcondition probing immediately after the reset,
# mirroring amt_power's own bounded, non-retrying probe contract. This is
# separate from amt_baremetal_install_wait_for_handoff: it only confirms AMT itself observed the
# machine come back on, well before an OS or installer would answer anything.
amt_baremetal_install_observe_retries: 5
amt_baremetal_install_observe_delay: 10

# ---------------------------------------------------------------------------
# Resumability. One JSON state file per target, so re-running this role after
# an interruption can tell what a prior, incomplete run already did instead of
# blindly re-arming one-time boot or re-issuing a reset of uncertain outcome.
# See tasks/state.yml and README.md#resumability.
# ---------------------------------------------------------------------------
amt_baremetal_install_state_dir: ~/.ansible/intel_amt/baremetal-install

# Explicit human acknowledgement required to proceed past a prior run left in
# an uncertain state (boot armed and/or reset issued with no confirmed
# postcondition). Never set this from automation -- only after a human has
# checked the machine's actual state via the manual recovery path in
# tests/hardware/README.md.
amt_baremetal_install_force_resume: false
