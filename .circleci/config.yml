---
version: 2.1

# ---------------------------------------------------------------------------
# Pipeline parameters
#
# run-hardware-tests gates the hardware-in-the-loop workflow. Those jobs run on
# a self-hosted CircleCI machine runner inside the lab network and touch real
# Intel AMT endpoints (power cycling machines, attaching boot media), so they
# must never fire on an ordinary push. Trigger deliberately:
#
#   curl -X POST https://circleci.com/api/v2/project/<project-slug>/pipeline \
#     -u "${CIRCLE_TOKEN}:" -H 'Content-Type: application/json' \
#     -d '{"parameters":{"run-hardware-tests":true}}'
# ---------------------------------------------------------------------------
parameters:
  run-hardware-tests:
    type: boolean
    default: false
  # Stage 7 (qualify_pxe.yml) refuses to arm a native one-time PXE boot unless told that
  # DHCP and a TFTP/HTTP boot service have been proven to work on the target's network
  # independently of AMT -- amt_pxe_prereqs_confirmed is an operator attestation, not
  # something any module in this collection can check. Defaulting to false here means a
  # pipeline trigger that only sets run-hardware-tests=true still stops at that assertion
  # for the pxe stage; a human must deliberately also set this on the SAME trigger, after
  # actually verifying the network, rather than it being a standing "true" baked into this
  # file that nobody re-confirms.
  pxe-prereqs-confirmed:
    type: boolean
    default: false

  # hardware-limit restricts the destructive stages to a subset of the rendered
  # inventory, as an Ansible --limit pattern. Empty means every host in
  # amt_targets, which is the historical behaviour.
  #
  # This exists because the stage playbooks target `hosts: amt_targets`, so
  # without it a run authorised for one machine power-cycles every machine in the
  # lab. "You may test machine 2" and "you may test everything" are different
  # permissions, and a harness that cannot express the narrower one will always be
  # run with the broader one.
  hardware-limit:
    type: string
    default: ""

executors:
  python:
    parameters:
      python-version:
        type: string
        default: "3.12"
    docker:
      - image: cimg/python:<< parameters.python-version >>
    working_directory: ~/project

commands:
  export-hardware-limit:
    description: >-
      Turn the hardware-limit pipeline parameter into an ANSIBLE_LIMIT_FLAG the
      stage steps interpolate. Kept as one command so every stage derives the flag
      identically -- a stage that forgot it would silently widen the blast radius
      of a run authorised for one machine.
    steps:
      - run:
          name: Resolve the inventory limit for this run
          command: |
            limit='<< pipeline.parameters.hardware-limit >>'
            if [ -n "${limit}" ]; then
              echo "export ANSIBLE_LIMIT_FLAG='--limit ${limit}'" >> "$BASH_ENV"
              echo "Destructive stages restricted to: ${limit}"
            else
              echo "export ANSIBLE_LIMIT_FLAG=''" >> "$BASH_ENV"
              echo "No hardware-limit set; stages target every host in amt_targets."
            fi

  install-ansible:
    description: Install a specific ansible-core minor series plus test deps.
    parameters:
      ansible-core-version:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-pip-<< parameters.ansible-core-version >>-{{ checksum "tests/unit/requirements.txt" }}
            - v1-pip-<< parameters.ansible-core-version >>-
      - run:
          name: Install ansible-core << parameters.ansible-core-version >>
          command: |
            python -m pip install --upgrade pip
            python -m pip install "ansible-core~=<< parameters.ansible-core-version >>.0"
            python -m pip install -r tests/unit/requirements.txt
            ansible --version
      - save_cache:
          paths:
            - ~/.cache/pip
          key: v1-pip-<< parameters.ansible-core-version >>-{{ checksum "tests/unit/requirements.txt" }}

  collect-test-results:
    description: >-
      Copy ansible-test JUnit output back out of the staged collection tree.
      The subdirectory must not be hidden or CircleCI silently ignores it.
    parameters:
      label:
        type: string
    steps:
      - run:
          name: Gather JUnit results
          when: always
          command: |
            mkdir -p ~/project/test-results/<< parameters.label >>
            if [ -d "${COLLECTION_PATH:-}/tests/output/junit" ]; then
              cp -a "${COLLECTION_PATH}/tests/output/junit/." \
                 ~/project/test-results/<< parameters.label >>/ 2>/dev/null || true
            fi
      - store_test_results:
          path: ~/project/test-results
      - store_artifacts:
          path: ~/project/test-results
          destination: test-results

  # ---------------------------------------------------------------------------
  # Shared steps for the hardware-in-the-loop jobs (hardware-tests plus the stage 4-7 jobs
  # below). Factored out once there were five jobs repeating the same credential check,
  # venv/collection install, and inventory render -- a second (or fifth) copy drifting from
  # the first is exactly how e.g. the ansible-core pin or the required-variable list would go
  # stale in only some jobs.
  verify-lab-credentials:
    description: >-
      Verify the restricted amt-lab-runner context injected the required AMT credentials, and
      either a reviewed TLS fingerprint or an explicit insecure-transport override, before
      anything tries to use them.
    steps:
      - run:
          name: Verify the lab credentials were injected
          command: |
            missing=""
            for var in AMT_HOST AMT_USERNAME AMT_PASSWORD; do
              eval "val=\${$var:-}"
              [ -n "$val" ] || missing="$missing $var"
            done
            if [ -n "$missing" ]; then
              echo "Missing required context variables:$missing" >&2
              echo "Add them to the amt-lab-runner context:" >&2
              echo "  circleci context store-secret amt-lab-runner --org gh/james-crowley <NAME>" >&2
              exit 1
            fi
            if [ -z "${AMT_TLS_FINGERPRINT:-}" ] && [ "${AMT_ALLOW_INSECURE:-false}" != "true" ]; then
              echo "AMT_TLS_FINGERPRINT is not set." >&2
              echo "Run the hardware-observe job, review the fingerprint it prints, then store it." >&2
              echo "This refusal is deliberate: pinning is the only trust mode AMT's" >&2
              echo "self-signed, bare-IP certificate supports, and unauthenticated TLS would" >&2
              echo "let an on-path device impersonate the endpoint." >&2
              exit 1
            fi
            echo "Credentials present for $(echo "${AMT_HOSTS:-$AMT_HOST}" | tr ',' '\n' | wc -l) endpoint(s)."

  install-lab-ansible-venv:
    description: >-
      Install ansible-core 2.18.18+ into a workspace virtualenv -- the runner is rootless with
      a read-only root filesystem, so nothing may be installed system-wide -- and build+install
      this collection from the checkout, so qualification runs against the code under test.
      The interpreter is chosen at runtime, not assumed: bare `python3` on this host is still
      the system Python 3.10, which ansible-core 2.18 cannot run on at all.
    steps:
      - run:
          name: Install ansible-core into a workspace virtualenv
          command: |
            # ansible-core 2.18.18 is the first release that fixes
            # GHSA-w8p5-mx5w-cpqj [HIGH] (argument injection in `ansible-galaxy role
            # install`); the whole 2.17 line is EOL and will never be fixed, so the pin
            # has to sit at >= 2.18.18. ~=2.18.18 takes 2.18.x patches but not 2.19,
            # keeping hardware qualification on one deliberately chosen series.
            #
            # 2.18 requires Python 3.11+ on the controller, so the venv must NOT be
            # built from bare `python3`: that is the host's system Python 3.10, which
            # stays where it is. 3.12 is the target rather than the newest available:
            # 2.18's supported controller range ends at 3.13, and 3.12 is also the
            # newest version that can still run ansible-core 2.17 -- the collection's
            # requires_ansible floor -- so one interpreter can reproduce a floor run by
            # hand on this host. 3.14 is deliberately not a candidate: 2.18 does not
            # support it. 3.11 and 3.13 are accepted fallbacks so a reinstalled runner
            # does not silently block qualification.
            #
            # Nobody can log into this host from CI, so failing here with the full
            # inventory of what was looked for and what exists beats a dependency
            # resolver error forty lines later.
            for candidate in python3.12 python3.11 python3.13; do
              if command -v "$candidate" >/dev/null 2>&1; then
                LAB_PYTHON="$(command -v "$candidate")"
                break
              fi
            done
            if [ -z "${LAB_PYTHON:-}" ]; then
              # Pure-bash discovery on purpose: this branch has to be able to report
              # what it found even on a host whose PATH is itself part of the problem.
              available=""
              IFS=':' read -r -a lab_path_dirs <<< "$PATH"
              for dir in "${lab_path_dirs[@]}"; do
                for exe in "$dir"/python3*; do
                  if [ -x "$exe" ] && [ ! -d "$exe" ]; then
                    name="${exe##*/}"
                    case " $available " in
                      *" $name "*) ;;
                      *) available="$available $name" ;;
                    esac
                  fi
                done
              done
              [ -n "$available" ] || available=" (no python3* executable at all)"
              echo "ERROR: no usable Python interpreter for the lab virtualenv." >&2
              echo "Looked for, in order: python3.12 (preferred), python3.11, python3.13." >&2
              echo "Found on PATH:${available}" >&2
              echo "Bare 'python3' is not a candidate: it is this host's system Python 3.10." >&2
              echo "ansible-core 2.18+ requires Python 3.11+ on the controller, so no venv" >&2
              echo "built from 3.10 can install the pinned version. Install python3.12 (and" >&2
              echo "its matching venv package) on the runner host, then re-run." >&2
              exit 1
            fi
            echo "Selected interpreter: ${LAB_PYTHON}"
            "$LAB_PYTHON" --version
            if ! "$LAB_PYTHON" -m venv .venv; then
              echo "ERROR: '${LAB_PYTHON} -m venv' failed. On Debian/Ubuntu the stdlib venv" >&2
              echo "module ships separately -- install the matching python3.X-venv package" >&2
              echo "on the runner host." >&2
              exit 1
            fi
            . .venv/bin/activate
            python --version
            python -m pip install --upgrade pip
            python -m pip install "ansible-core~=2.18.18" -r requirements.txt
            ansible --version
      - run:
          name: Install the collection from this checkout
          command: |
            . .venv/bin/activate
            ansible-galaxy collection build --output-path ./dist --force
            ansible-galaxy collection install ./dist/*.tar.gz --force

  provision-test-media:
    description: >-
      Materialise the small bootable ISO (stage 5) and writable raw image (stage 6) that
      tests/hardware/make-test-media.sh produces, entirely inside the workspace -- neither may
      ever be committed (.gitignore blocks *.iso/*.img) -- and export their absolute paths so
      the render-lab-inventory command below picks them up.
    steps:
      - run:
          name: Provision local test media (ISO + writable image)
          command: |
            export AMT_TEST_ISO_PATH="$(pwd)/tests/hardware/media/ipxe-test.iso"
            export AMT_TEST_IMAGE_PATH="$(pwd)/tests/hardware/media/writable-test.img"
            ./tests/hardware/make-test-media.sh
            echo "export AMT_TEST_ISO_PATH=${AMT_TEST_ISO_PATH}" >> "$BASH_ENV"
            echo "export AMT_TEST_IMAGE_PATH=${AMT_TEST_IMAGE_PATH}" >> "$BASH_ENV"

  render-lab-inventory:
    description: >-
      Render tests/hardware/inventory.yml from the amt-lab-runner context. Must run after
      provision-test-media, when that command is used, so AMT_TEST_ISO_PATH/AMT_TEST_IMAGE_PATH
      are already exported and render-inventory.sh picks them up.
    steps:
      - run:
          name: Render the lab inventory from the context
          command: |
            ./tests/hardware/render-inventory.sh > tests/hardware/inventory.yml
            # Safe to display: the renderer emits env lookups, not secret values, so the
            # password and fingerprint never touch disk. Printing it makes a host/group
            # mismatch obvious instead of silently matching 0 hosts.
            cat tests/hardware/inventory.yml

  remove-lab-inventory:
    description: Remove the rendered inventory, always -- even on failure, so a resolvable secret lookup never lingers past the job that needed it.
    steps:
      - run:
          name: Remove the rendered inventory
          when: always
          command: rm -f tests/hardware/inventory.yml

  note-recovery-path-on-failure:
    description: >-
      On failure, point at the manual KVM/MEBx recovery path documented in
      tests/hardware/README.md -- every stage 4-7 job can leave real hardware in a state that
      needs a human to look at the console, and the next person debugging a red build should
      not have to go hunting for that document.
    steps:
      - run:
          name: If this failed, see the manual recovery path
          when: on_fail
          command: |
            echo "This job mutates real hardware and can leave it in an uncertain state." >&2
            echo "Manual recovery path: tests/hardware/README.md#if-a-machine-ends-up-in-a-bad-boot-state" >&2
            echo "Evidence written before the failure (if any) is under tests/hardware/output/," >&2
            echo "stored above as this job's hardware-evidence artifact." >&2

jobs:
  # -------------------------------------------------------------------------
  lint:
    executor:
      name: python
      python-version: "3.12"
    steps:
      - checkout
      - install-ansible:
          ansible-core-version: "2.19"
      - run:
          # From requirements-dev.txt, not a bare `pip install ansible-lint
          # yamllint ruff`: unpinned linters make a lint result a function of the
          # day it ran. ruff in particular adds and widens rules continuously --
          # 0.15.5 reports three S603 findings in the unit tests that 0.16.0 does
          # not -- so an unpinned install can turn main red with no code change,
          # or disagree with what a contributor ran locally. This file is the
          # single place those versions are declared, which is what makes
          # "install the dev requirements" in CONTRIBUTING.md a truthful
          # instruction rather than an approximation.
          name: Install pinned linters (same file contributors install)
          command: python -m pip install -r requirements-dev.txt
      - run:
          name: yamllint
          command: yamllint -c .yamllint .
      - run:
          name: ruff
          command: ruff check plugins tests
      - run:
          name: ruff format check
          command: ruff format --check plugins tests
      - run:
          # tests/hardware/*.yml are this repository's first real top-level
          # playbooks (files with their own `hosts:` key). ansible-lint's
          # syntax-check[unknown-module] rule (tagged "unskippable" -- it
          # cannot be silenced with a per-line `# noqa`) only performs real
          # module resolution for files shaped like a playbook, and unlike
          # ansible-test it does not stage the ansible_collections/<ns>/<name>/
          # layout scripts/setup-collection-tree.sh builds. A plain symlink is
          # enough to make this checkout resolvable as its own collection.
          name: Make this checkout resolvable as its own collection (for ansible-lint)
          command: |
            mkdir -p ~/.ansible/collections/ansible_collections/james_crowley
            ln -sfn "$(pwd)" ~/.ansible/collections/ansible_collections/james_crowley/intel_amt
      - run:
          name: ansible-lint
          command: ansible-lint --offline

  # -------------------------------------------------------------------------
  sanity:
    parameters:
      ansible-core-version:
        type: string
      python-version:
        type: string
    executor:
      name: python
      python-version: << parameters.python-version >>
    steps:
      - checkout
      - install-ansible:
          ansible-core-version: << parameters.ansible-core-version >>
      - run:
          name: ansible-test sanity
          command: |
            COLLECTION_PATH="$(./scripts/setup-collection-tree.sh)"
            echo "export COLLECTION_PATH=${COLLECTION_PATH}" >> "$BASH_ENV"
            cd "${COLLECTION_PATH}"
            # --venv, not --docker: the CircleCI Docker executor cannot bind-mount
            # the working directory into a remote-docker container, which is what
            # `ansible-test --docker` requires. See docs/testing.md.
            ansible-test sanity --venv --python << parameters.python-version >> \
              --color -v --junit
      - collect-test-results:
          label: sanity-py<< parameters.python-version >>-core<< parameters.ansible-core-version >>

  # -------------------------------------------------------------------------
  units:
    parameters:
      ansible-core-version:
        type: string
      python-version:
        type: string
    executor:
      name: python
      python-version: << parameters.python-version >>
    steps:
      - checkout
      - install-ansible:
          ansible-core-version: << parameters.ansible-core-version >>
      - run:
          name: ansible-test units
          command: |
            COLLECTION_PATH="$(./scripts/setup-collection-tree.sh)"
            echo "export COLLECTION_PATH=${COLLECTION_PATH}" >> "$BASH_ENV"
            cd "${COLLECTION_PATH}"
            ansible-test units --venv --python << parameters.python-version >> \
              --color -v --coverage
      - run:
          name: Coverage report
          when: always
          command: |
            cd "${COLLECTION_PATH}"
            ansible-test coverage report --omit 'tests/*' --color -v || true
      - collect-test-results:
          label: units-py<< parameters.python-version >>-core<< parameters.ansible-core-version >>

  # -------------------------------------------------------------------------
  # Mock integration tests. These run the modules end-to-end against a local
  # deterministic WS-Man + IDE-R fixture server. No real AMT hardware.
  integration-mock:
    executor:
      name: python
      python-version: "3.12"
    steps:
      - checkout
      - install-ansible:
          ansible-core-version: "2.19"
      - run:
          name: ansible-test integration (mock endpoints)
          command: |
            COLLECTION_PATH="$(./scripts/setup-collection-tree.sh)"
            echo "export COLLECTION_PATH=${COLLECTION_PATH}" >> "$BASH_ENV"
            cd "${COLLECTION_PATH}"
            # No skip-guard here on purpose. There used to be one, from the era
            # when tests/integration/targets was empty (issue #8) and a fatal
            # "no targets" exit would have held main red. All five targets are
            # committed now, so the guard was dead code whose only remaining
            # effect would be to exit 0 -- green -- if the targets ever silently
            # disappeared from the staged tree, which is precisely the failure it
            # should report.
            ansible-test integration --venv --python 3.12 --color -v
      - collect-test-results:
          label: integration-mock

  # -------------------------------------------------------------------------
  build:
    executor:
      name: python
      python-version: "3.12"
    steps:
      - checkout
      - install-ansible:
          ansible-core-version: "2.19"
      - run:
          name: Build collection artifact
          command: |
            ansible-galaxy collection build --output-path ./dist -v
            ls -la ./dist
      - run:
          name: Verify the artifact installs cleanly
          command: |
            ansible-galaxy collection install ./dist/*.tar.gz -p /tmp/verify-install -v
            ansible-doc --list \
              --module-path /tmp/verify-install/ansible_collections/james_crowley/intel_amt/plugins/modules \
              2>/dev/null || true
      - store_artifacts:
          path: ./dist
          destination: collection
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop. Runs on a self-hosted machine runner sitting inside the
  # lab network, with access to real AMT endpoints. Four independent controls
  # stand in front of it, because a job here can power-cycle and reimage physical
  # machines and reaches into a private network:
  #
  #   1. the `run-hardware-tests` pipeline parameter, false by default, so an
  #      ordinary push cannot reach this workflow at all;
  #   2. a manual approval job, so a human confirms before anything is touched;
  #   3. the `amt-lab-runner` context, restricted to this project only, so no
  #      other project in the org can borrow the lab credentials;
  #   4. a branch filter, so only main can target the runner.
  #
  # CircleCI additionally refuses to run self-hosted runner jobs for forked-PR
  # builds, which matters if this repository is ever made public.
  # A deliberately harmless first job: prove the runner works, and learn the TLS
  # fingerprint the credentialed stages need in order to pin anything.
  #
  # Sends NO credentials and touches no state. It completes a TLS handshake to
  # read the certificate each AMT port offers. That is safe to run against an
  # endpoint whose identity is not yet established, which is exactly the position
  # we are in before a pin exists. Requires the context only for AMT_HOST.
  hardware-observe:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      - run:
          name: Runner environment
          command: |
            echo "host:    $(hostname)"
            echo "python:  $(python3 --version)"
            echo "workdir: $(pwd)"
            # The runner is rootless with a read-only root filesystem, so confirm
            # the workspace is actually writable before anything relies on it.
            touch .writable-probe && rm -f .writable-probe && echo "workspace: writable"
      - run:
          name: Observe TLS certificates offered by every configured AMT endpoint
          command: |
            test -n "${AMT_HOST:-}" || { echo "AMT_HOST is not set in the context." >&2; exit 1; }
            # Every machine is observed, not just the first. Each AMT endpoint
            # presents its own self-signed certificate, so each needs its own
            # reviewed pin -- a single shared fingerprint cannot work across two
            # machines and would surface as a confusing pin mismatch rather than a
            # clear configuration error.
            status=0
            n=1
            host="${AMT_HOST}"
            while [ -n "${host}" ]; do
              echo "================ machine ${n} ================"
              python3 tests/hardware/observe-tls-fingerprint.py \
                "${host}" "${AMT_PORT:-16993}" "${AMT_REDIRECTION_PORT:-16995}" || status=1
              n=$((n + 1))
              eval "host=\${AMT_HOST_${n}:-}"
            done
            exit "${status}"

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop. Runs on a self-hosted machine runner sitting inside the
  # lab network, with access to real AMT endpoints. Five independent controls
  # stand in front of it, because a job here can power-cycle and reimage physical
  # machines and reaches into a private network:
  #
  #   1. the `run-hardware-tests` pipeline parameter, false by default, so an
  #      ordinary push cannot reach this workflow at all;
  #   2. a manual approval job, so a human confirms before anything is touched;
  #   3. the `amt-lab-runner` context, restricted to this project only, so no
  #      other project in the org can borrow the lab credentials;
  #   4. a branch filter, so only main can target the runner;
  #   5. AMT_TLS_FINGERPRINT must be present, so we never speak to an AMT
  #      endpoint over TLS we cannot authenticate.
  #
  # CircleCI additionally refuses to run self-hosted runner jobs for forked-PR
  # builds, which matters if this repository is ever made public.
  #
  # This job is READ-ONLY and check-mode only. It never mutates power or boot
  # state. The destructive stages (attended power cycling, media attach, writable
  # image, native PXE) are separate playbooks under tests/hardware/ and are run
  # deliberately by a human, not wired into CI.
  hardware-tests:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      # The lab inventory and credentials come from the restricted context, never
      # from the repository -- tests/hardware/inventory.yml is gitignored and only
      # an .example is committed. The context must supply:
      #
      #   AMT_HOST             AMT endpoint address (AMT_HOSTS for several)
      #   AMT_USERNAME         AMT account (usually "admin")
      #   AMT_PASSWORD         AMT password
      #   AMT_TLS_FINGERPRINT  reviewed SHA-256 leaf fingerprint, from the
      #                        hardware-observe job above
      #   AMT_PORT             optional; WS-Man port, else derived (16993/16992)
      #   AMT_REDIRECTION_PORT optional; IDE-R port, else derived (16995/16994)
      #   AMT_ALLOW_INSECURE   "true" only for firmware with no TLS at all
      #
      # Env vars rather than a committed vault: the runner host is the trust
      # boundary here, and a vault password would have to come from the context
      # anyway.
      - verify-lab-credentials
      - install-lab-ansible-venv
      - render-lab-inventory
      - export-hardware-limit
      - run:
          name: "Stage 1: read-only AMT qualification"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_readonly.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} -v
      - run:
          name: "Stage 3: check-mode power and boot plans (no mutation)"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_checkmode.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} --check -v
      - run:
          name: "Stage 8: idempotent re-probe"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_idempotent_reprobe.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} -v
      - store_artifacts:
          path: tests/hardware/output
          destination: hardware-evidence
      - remove-lab-inventory
      - note-recovery-path-on-failure

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop, stage 4 (tests/hardware/qualify_power.yml): attended power on/off.
  # Same five controls as hardware-tests above, PLUS its own approval gate
  # (hardware-power-approval) escalating past hardware-tests's read-only/check-mode-only
  # stages -- this job actually power-cycles the machine. amt_qualify_attended=false skips
  # the playbook's interactive pauses, which would otherwise block forever on stdin the
  # machine executor cannot supply; the approval gate is this job's real human checkpoint,
  # and the approver is expected to already be watching the console before approving.
  hardware-power:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      - verify-lab-credentials
      - install-lab-ansible-venv
      - render-lab-inventory
      - export-hardware-limit
      - run:
          name: "Stage 4: attended power on/off (unattended in CI; the approval gate is the human checkpoint)"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_power.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} -e amt_qualify_attended=false -v
      - store_artifacts:
          path: tests/hardware/output
          destination: hardware-evidence
      - remove-lab-inventory
      - note-recovery-path-on-failure

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop, stage 5 (tests/hardware/qualify_media_attach.yml): IDE-R attach with
  # a small test ISO, confirming boot hand-off. Escalates past hardware-power behind its own
  # approval gate. provision-test-media materialises tests/hardware/make-test-media.sh's ISO
  # (iPXE's own ipxe.iso) before rendering the inventory, so amt_test_iso_path is populated.
  #
  # A green run here proves the attach-and-boot-handoff path accepted the media and issued a
  # reset; it does NOT by itself prove the screen showed iPXE booting -- that still needs an
  # operator (or the approver, in CI) watching the console. See the playbook's own header.
  hardware-media:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      - verify-lab-credentials
      - install-lab-ansible-venv
      - provision-test-media
      - render-lab-inventory
      - export-hardware-limit
      - run:
          name: "Stage 5: IDE-R attach with a small test ISO (unattended in CI)"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_media_attach.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} -e amt_qualify_attended=false -v
      - store_artifacts:
          path: tests/hardware/output
          destination: hardware-evidence
      - remove-lab-inventory
      - note-recovery-path-on-failure

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop, stage 6 (tests/hardware/qualify_writable_image.yml): writable-image
  # test. Escalates past hardware-media behind its own approval gate.
  #
  # IMPORTANT: a green run here does NOT prove bytes were written to the device. With nothing
  # booted on the target to issue SCSI writes (amt_qualify_attended=false skips the interactive
  # "go write something now" pause), bytes_written=0 is the expected outcome every time this
  # runs unattended in CI, and the playbook reports that as a legitimate result, not a
  # failure. What this job DOES prove every run: the writable image is accepted and attached,
  # and the device is presented to the guest as writable (MODE_SENSE write-protect bit
  # cleared). See the playbook's own header for the full breakdown.
  hardware-writable:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      - verify-lab-credentials
      - install-lab-ansible-venv
      - provision-test-media
      - render-lab-inventory
      - export-hardware-limit
      - run:
          name: "Stage 6: writable-image test (unattended in CI -- bytes_written=0 is expected)"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_writable_image.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} -e amt_qualify_attended=false -v
      - store_artifacts:
          path: tests/hardware/output
          destination: hardware-evidence
      - remove-lab-inventory
      - note-recovery-path-on-failure

  # -------------------------------------------------------------------------
  # Hardware-in-the-loop, stage 7 (tests/hardware/qualify_pxe.yml): one-time native PXE boot.
  # The last and most escalated of the gated hardware jobs, behind its own approval gate.
  #
  # amt_pxe_prereqs_confirmed is wired to the pxe-prereqs-confirmed pipeline parameter
  # (default false), NOT hardcoded true -- this attestation ("DHCP and a boot service already
  # proven to work on this network, independently of AMT") has to be a fresh, informed
  # decision made at trigger time, not a standing value baked into this file that nobody
  # re-confirms. A pipeline triggered with only run-hardware-tests=true will reach this job
  # and fail closed at that assertion, which is correct, not a bug.
  #
  # IMPORTANT: this job cannot verify netboot itself succeeds -- that depends on DHCP/TFTP/HTTP
  # boot-service infrastructure this collection has no way to observe. What it DOES prove: the
  # one-time PXE arm is accepted and reads back as armed, the reset is issued and the endpoint
  # recovers, and AMT_BootSettingData is not left drifted or corrupted by the reset. See the
  # playbook's own header for exactly what it cannot prove about the internal one-shot role
  # bit either.
  hardware-pxe:
    machine: true
    resource_class: crowley/amt-runner
    steps:
      - checkout
      - verify-lab-credentials
      - install-lab-ansible-venv
      - render-lab-inventory
      - export-hardware-limit
      - run:
          name: "Stage 7: one-time native PXE boot (unattended in CI)"
          command: |
            . .venv/bin/activate
            ansible-playbook tests/hardware/qualify_pxe.yml \
              -i tests/hardware/inventory.yml ${ANSIBLE_LIMIT_FLAG} \
              -e amt_qualify_attended=false \
              -e amt_pxe_prereqs_confirmed=<< pipeline.parameters.pxe-prereqs-confirmed >> \
              -v
      - store_artifacts:
          path: tests/hardware/output
          destination: hardware-evidence
      - remove-lab-inventory
      - note-recovery-path-on-failure

  # -------------------------------------------------------------------------
  publish:
    executor:
      name: python
      python-version: "3.12"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-ansible:
          ansible-core-version: "2.19"
      # A Galaxy version is IMMUTABLE once published: it cannot be replaced,
      # only superseded by a higher version. So the one mistake this job must
      # make impossible is publishing under a version nobody intended -- tagging
      # v0.2.0 while galaxy.yml still says 0.1.0 would either burn 0.1.0 a second
      # time or ship 0.2.0's contents as 0.1.0, irrecoverably, and the tag and
      # the release notes would forever disagree with what Galaxy serves. The tag
      # is what a human deliberately chose; galaxy.yml's version is what the
      # artifact actually claims to be. They must agree before anything is
      # uploaded, and this check has to be here rather than in `build` because
      # `build` also runs on untagged branches where CIRCLE_TAG is empty.
      #
      # `import yaml` below is satisfied by the install-ansible step above, NOT
      # by the executor image: cimg/python:3.12 ships no PyYAML (verified), while
      # ansible-core hard-depends on it. Keep this step after install-ansible.
      - run:
          name: Tag must match galaxy.yml version
          command: |
            want="${CIRCLE_TAG#v}"
            have="$(python -c 'import yaml,sys;print(yaml.safe_load(open("galaxy.yml"))["version"])')"
            if [ "$want" != "$have" ]; then
              echo "git tag ${CIRCLE_TAG} implies version ${want}, but galaxy.yml declares ${have}" >&2
              exit 1
            fi
            # Pin the artifact by exact filename rather than publishing a
            # ./dist/*.tar.gz glob: the glob would happily upload whatever single
            # tarball happened to be in the attached workspace, which is the same
            # class of mistake one step later.
            ls ./dist/james_crowley-intel_amt-"${have}".tar.gz
      - run:
          name: Publish to Ansible Galaxy
          command: |
            test -n "${GALAXY_API_KEY}" || {
              echo "GALAXY_API_KEY is not set; is the galaxy-publish context attached?" >&2
              exit 1
            }
            ansible-galaxy collection publish \
              "./dist/james_crowley-intel_amt-${CIRCLE_TAG#v}.tar.gz" \
              --api-key "${GALAXY_API_KEY}" -v

workflows:
  # -------------------------------------------------------------------------
  # Ordinary CI. Tag filters are present on every job because CircleCI skips
  # jobs without them on tag pushes, which would strand the publish job.
  test:
    when:
      not: << pipeline.parameters.run-hardware-tests >>
    jobs:
      - lint:
          filters:
            tags:
              only: /^v.*/
      - sanity:
          requires: [lint]
          filters:
            tags:
              only: /^v.*/
          matrix:
            parameters:
              python-version: ["3.12"]
              ansible-core-version: ["2.17", "2.18", "2.19"]
      - units:
          requires: [lint]
          filters:
            tags:
              only: /^v.*/
          matrix:
            parameters:
              # 3.10 is here because ansible-core 2.17 -- this collection's
              # declared floor -- supports it, so users can legitimately run on
              # it. The lab runner does exactly that, and its Python 3.10 caught
              # two 3.11-only APIs (enum.StrEnum, datetime.UTC) that this matrix
              # had been blind to while it started at 3.11.
              python-version: ["3.10", "3.11", "3.12", "3.13"]
              ansible-core-version: ["2.17", "2.19"]
            exclude:
              # Python 3.13 controller support arrived in ansible-core 2.18.
              - python-version: "3.13"
                ansible-core-version: "2.17"
              # ansible-core 2.19 requires Python 3.11+ on the controller.
              - python-version: "3.10"
                ansible-core-version: "2.19"
      - integration-mock:
          requires: [lint]
          filters:
            tags:
              only: /^v.*/
      - build:
          requires: [sanity, units, integration-mock]
          filters:
            tags:
              only: /^v.*/
      - publish-approval:
          type: approval
          requires: [build]
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          requires: [publish-approval]
          context: galaxy-publish
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

  # -------------------------------------------------------------------------
  # Opt-in only. Never runs on a normal push. See the hardware-tests job for the
  # full list of controls in front of the lab runner.
  hardware:
    when: << pipeline.parameters.run-hardware-tests >>
    jobs:
      # Lint first: no reason to wake a human for an approval on a branch that
      # cannot even pass static checks.
      - lint:
          filters:
            branches:
              only: main

      # Deliberately NOT behind the approval gate. It sends no credentials,
      # mutates nothing, and only reads the certificate each AMT port offers --
      # so it is both safe to run freely and the thing you need first, since it
      # produces the fingerprint everything else pins. It still needs the
      # restricted context for AMT_HOST, and still only runs on main.
      - hardware-observe:
          requires: [lint]
          context: amt-lab-runner
          filters:
            branches:
              only: main

      - hardware-approval:
          type: approval
          requires: [hardware-observe]
          filters:
            branches:
              only: main

      - hardware-tests:
          requires: [hardware-approval]
          # Restricted to this project only, so no other project in the org can
          # use the lab credentials it carries.
          context: amt-lab-runner
          filters:
            branches:
              only: main

      # -----------------------------------------------------------------------
      # Stages 4-7, escalating past hardware-tests's read-only/check-mode-only floor. Each one
      # power-cycles, attaches media to, writes to, or PXE-boots real hardware, and each sits
      # behind its OWN type: approval job -- deliberately not one approval covering all four,
      # so a human confirms every escalation independently rather than one click green-lighting
      # everything from "read a certificate" through "arm a native PXE boot." See each job's own
      # comment above (and the corresponding playbook's header) for exactly what it proves and
      # does not prove.

      - hardware-power-approval:
          type: approval
          requires: [hardware-tests]
          filters:
            branches:
              only: main
      - hardware-power:
          requires: [hardware-power-approval]
          context: amt-lab-runner
          filters:
            branches:
              only: main

      - hardware-media-approval:
          type: approval
          requires: [hardware-power]
          filters:
            branches:
              only: main
      - hardware-media:
          requires: [hardware-media-approval]
          context: amt-lab-runner
          filters:
            branches:
              only: main

      - hardware-writable-approval:
          type: approval
          requires: [hardware-media]
          filters:
            branches:
              only: main
      - hardware-writable:
          requires: [hardware-writable-approval]
          context: amt-lab-runner
          filters:
            branches:
              only: main

      - hardware-pxe-approval:
          type: approval
          requires: [hardware-writable]
          filters:
            branches:
              only: main
      - hardware-pxe:
          requires: [hardware-pxe-approval]
          context: amt-lab-runner
          filters:
            branches:
              only: main
