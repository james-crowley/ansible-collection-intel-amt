# Tooling configuration only. This collection is distributed via
# ansible-galaxy, not as a Python package, so there is no [project] table.

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["dist", "tests/output", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
]
ignore = [
    # Ansible modules legitimately use broad excepts to convert any failure into
    # a classified module failure via fail_json.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# MD5 is mandated by the RFC 2617 digest scheme that Intel AMT's redirection
# port implements. It is not a security choice available to us.
"plugins/module_utils/redirection.py" = ["S324"]
# requirements.txt is deliberately stdlib-only for XML (no lxml/defusedxml,
# a C-extension dependency with no benefit here): WS-Man responses are small
# and come from an endpoint already authenticated via HTTP Digest before any
# XML is parsed.
"plugins/module_utils/wsman.py" = ["S314"]
# Ansible module convention requires DOCUMENTATION/EXAMPLES/RETURN string
# literals at the top of the file, before any import -- ansible-doc and the
# sanity toolchain both depend on that ordering, so the imports that follow
# are legitimately not at the top of the file.
"plugins/modules/*.py" = ["E402"]
# Tests use asserts and construct fixture data freely. S603
# (subprocess-without-shell-equals-true) is ignored because several tests
# deliberately spawn a helper process: a throw-away `sys.executable -c ...` child
# whose liveness stands in for the IDE-R media session daemon, and an `openssl`
# invocation that mints the mock WS-Man server's self-signed fixture cert. Every
# one of those builds its argv as a literal list in the test itself, with no
# shell and no untrusted input -- which is the case S603 exists to distinguish
# from. Note this ignore is version-sensitive: ruff 0.15.5 raises S603 on these
# call sites and 0.16.0 does not, which is part of why requirements-dev.txt pins
# ruff exactly rather than with a floor.
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
